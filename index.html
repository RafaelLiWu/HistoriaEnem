olução permanente')"], "Atenção: A Revolução de 1917 ocorreu em duas fases distintas: Fevereiro (menchevique/liberal, deposição do czar) e Outubro (bolchevique/socialista, instalação do regime soviético).", "Declaração dos Direitos do Povo Trabalhador e Explorado (Rússia Soviética, janeiro de 1918):\n\n'Fica abolida a propriedade privada da terra. Ficam declaradas patrimônio nacional todas as terras com todos os seus bens, gados e alfaias agrícolas, sem qualquer indenização aos antigos senhores latifundiários. Confirma-se a entrega de todas as fábricas, minas, caminhos de ferro e meios de produção ao Estado operário e camponês.'\n\n(Fonte: Decretos do Poder Soviético, Moscou).", "A legislação revolucionária decretada pelos bolcheviques após a Revolução de Outubro de 1917 estabeleceu:", ["o fortalecimento da propriedade privada agrária e a privatização de empresas públicas essenciais.", "a subordinação da economia soviética ao controle de investidores britânicos e franceses da Entente.", "a manutenção do Império czarista e a continuidade dos combates russos na Primeira Guerra Mundial.", "o estímulo à livre concorrência mercantil desregulamentada no setor financeiro internacional.", "a estatização dos meios de produção e a extinção da propriedade privada da terra sob controle do poder operário."], 4, "Passo a passo:\n1. Fonte e contexto: O decreto soviético de 1918 confisca terras da nobreza e meios industriais em nome da classe trabalhadora.\n2. Raciocínio: O projeto bolchevique rompeu com a estrutura capitalista, socializando terras e fábricas sob tutela estatal e saindo da Primeira Guerra pelo Tratado de Brest-Litovsk (Gabarito E).\n3. Distratores: A e E são medidas capitalistas liberais; B e D contrariam a ruptura com a burguesia ocidental e a saída imediata do conflito imperialista mundial."], "Crise de 1929 e o New Deal": ["Durante a década de 1920 ('Roaring Twenties'), os Estados Unidos viveram grande euforia econômica baseada no modelo de consumo em massa ('American Way of Life'). Contudo, a superprodução industrial e agrícola (não acompanhada pelo poder aquisitivo dos salários) e a desenfreada especulação financeira culminaram na Quebra da Bolsa de Nova York ('Quinta-Feira Negra', 24 de outubro de 1929). A Grande Depressão espalhou falências bancárias, desemprego em massa de 25% e miséria global. Em 1933, o presidente Franklin Delano Roosevelt implementou o 'New Deal', pacote de medidas de intervenção estatal na economia inspirado nas teorias do economista John Maynard Keynes, gerando empregos em obras públicas, seguro-desemprego e regulamentação financeira.", ["Causas: Superprodução, subconsumo relativo e especulação desregulada no mercado de ações", "Outubro de 1929: Quebra de Wall Street e propagação da Grande Depressão para o mundo capitalista", "Impacto no Brasil: Queda abrupta nas exportações de café, precipitando a Revolução de 1930", "New Deal (1933): Intervenção estatal contundente com investimentos públicos em infraestrutura (Tennessee Valley)", "Keynesianismo: Superação do dogma liberal do 'laissez-faire' por meio de políticas anticíclicas de estímulo à demanda"], "O New Deal não transformou os EUA em um país socialista; tratou-se de uma estratégia estatal deliberada para salvar o próprio capitalismo de suas crises cíclicas de superprodução.", "Discurso de Posse de Franklin D. Roosevelt (março de 1933):\n\n'Nossa maior tarefa prioritária é colocar o povo para trabalhar. Isto não é um problema insolúvel se o enfrentarmos com sabedoria e coragem. Pode ser realizado em parte mediante o recrutamento direto pelo próprio governo, tratando a tarefa como trataríamos a emergência de uma guerra, mas ao mesmo tempo realizando obras grandiosas e necessárias para estimular e reorganizar o uso de nossos recursos.'\n\n(Fonte: Discursos Presidenciais Americanos, Washington).", "A política do New Deal implementada nos Estados Unidos representou uma profunda inflexão na economia liberal ao:", ["romper com o liberalismo clássico do laissez-faire mediante a intervenção do Estado como indutor da economia e gerador de empregos.", "eliminar todo o sistema de impostos sobre grandes fortunas e extinguir as agências reguladoras estatais.", "instituir a planificação centralizada soviética com proibição absoluta da iniciativa privada no comércio.", "incentivar a especulação bursátil irrestrita nas bolsas de valores sem nenhuma fiscalização pública.", "fechar as indústrias manufatureiras para priorizar exclusivamente a exportação de trigo para a Europa devastada."], 0, "Passo a passo:\n1. Fonte e contexto: Roosevelt propõe a convocação estatal direta para erguer obras de infraestrutura e empregar milhões.\n2. Raciocínio: O New Deal desafiou o dogma liberal da 'mão invisível', demonstrando a necessidade de regulação estatal, seguridade social e gasto público para reativar o consumo (Gabarito A).\n3. Distratores: A e D defendem o liberalismo desregulado que causou a crise; B confunde intervenção reformista keynesiana com socialismo soviético; E é uma invenção sem respaldo factual."], "Fascismo Italiano e Nazismo Alemão": ["A crise do pós-Primeira Guerra, a Grande Depressão de 1929 e o temor burguês da expansão da revolução comunista propiciaram a emergência dos totalitarismos de extrema-direita na Europa. Na Itália, Benito Mussolini fundou o Fascismo e tomou o poder após a Marcha sobre Roma (1922). Na Alemanha, Adolf Hitler e o Partido Nazista ascenderam em 1933. Ambos compartilhavam o ultranacionalismo agressivo, militarismo, culto fanático ao líder (Duce / Führer), corporativismo antissindical, anticomunismo virulento e violência paramilitar (Camisas Negras / SA e SS). O nazismo distinguia-se pela ideologia da superioridade da 'raça ariana', antissemitismo sistemático (Leis de Nuremberg de 1935) e a busca militar pelo 'espaço vital' (Lebensraum) no leste europeu.", ["Totalitarismo: Controle absoluto do Estado sobre a vida pública e privada e partido único", "Propaganda de Massa: Utilização sistemática do rádio, cinema e cartazes sob comando de Goebbels", "Militarismo e Expansionismo: Rearmamento clandestino e invasão de territórios violando tratados internacionais", "Eugenia e Antissemitismo Nazista: Perseguição biológica e jurídica aos judeus consolidada nas Leis de Nuremberg (1935)", "Guerra Civil Espanhola (1936-1939): Laboratório militar para o nazi-fascismo com o bombardeio de Guernica"], "Diferença essencial: Todo nazismo é fascista, mas nem todo fascismo é nazista. O elemento biológico e racial do arianismo e o antissemitismo exterminador são marcas exclusivas do nazismo de Hitler.", "Trecho da Doutrina do Fascismo, de Benito Mussolini (1932):\n\n'O fascismo nega que o número, pela simples circunstância de ser número, possa dirigir as sociedades humanas; nega que esse número possa governar mediante uma consulta periódica: afirma a desigualdade irremediável, fecunda e benéfica dos homens. Para o fascista, tudo está no Estado, e nada de humano ou espiritual existe, e muito menos tem valor, fora do Estado.'\n\n(Fonte: A Doutrina do Fascismo, Roma).", "O texto de Mussolini expressa pilares basilares do modelo totalitário fascista caracterizados por:", ["respeito integral aos direitos individuais inalienáveis e à soberania popular manifestada nas urnas democráticas.", "recusa do princípio democrático igualitário e subordinação absoluta do indivíduo aos desígnios autoritários do Estado.", "defesa intransigente do internacionalismo pacifista e da cooperação solidária entre todas as nações.", "apoio à mobilização autônoma de sindicatos comunistas e socialistas nas fábricas industriais.", "combate incisivo às estruturas militares permanentes em favor da autonomia comunal desarmada."], 1, "Passo a passo:\n1. Fonte e contexto: Mussolini rejeita formalmente o sufrágio igualitário ('nega que o número possa governar') e defende o Estado totalitário ('tudo no Estado, nada fora do Estado').\n2. Raciocínio: A ideologia fascista repudiava os valores do Iluminismo e da Revolução Francesa (igualdade, liberdades civis, soberania popular), impondo submissão totalitária e culto à hierarquia (Gabarito B).\n3. Distratores: A, B, D e E apontam valores democráticos, pacifistas ou anarquistas que o fascismo reprimiu com violência sistemática."], "Segunda Guerra Mundial e o Holocausto": ["A Segunda Guerra Mundial (1939-1945) eclodiu quando as tropas nazistas invadiram a Polônia em 1º de setembro de 1939, após a invasão da Tchecoslováquia e a ineficácia da 'Política de Apaziguamento' franco-britânica. O conflito contrapôs o Eixo (Alemanha, Itália e Japão) aos Aliados (Reino Unido, URSS e Estados Unidos, com apoio do Brasil a partir de 1942 com a FEB). Marcado pela guerra de movimento relâmpago ('Blitzkrieg'), o conflito teve como ponto de virada decisivo a Batalha de Stalingrado (1942-1943), em que o Exército Vermelho soviético aniquilou as forças alemãs. O regime nazista perpetrou o Holocausto (Shoah), o extermínio industrializado e metódico de mais de seis milhões de judeus em campos de concentração (como Auschwitz-Birkenau), além de ciganos, homossexuais, deficientes e opositores.", ["1939-1945: O maior conflito bélico da história humana, com mais de 60 milhões de mortos", "Shoah / Holocausto: Extermínio industrial sistemático nos campos de concentração nazistas", "Batalha de Stalingrado: Ponto de inflexão militar onde a União Soviética iniciou a marcha sobre Berlim", "Dia D (6 de junho de 1944): Desembarque aliado na Normandia abrindo a frente ocidental contra Hitler", "Agosto de 1945: Bombardeios atômicos norte-americanos sobre Hiroshima e Nagasaki forçando a rendição japonesa"], "O Brasil participou militarmente da Segunda Guerra: a Força Expedicionária Brasileira (FEB) enviou mais de 25 mil soldados à Itália em 1944, destacando-se na Batalha de Monte Castelo.", "Depoimento de Primo Levi em 'É isto um homem?' (1947), sobre sua experiência em Auschwitz:\n\n'Pela primeira vez nos dávamos conta de que nossa língua carecia de palavras para exprimir essa ofensa: a demolição de um homem. Em um instante, quase por intuição, o passado nos fora roubado, os nomes e as roupas, até mesmo os cabelos. Destruíram-nos a nós próprios, reduzidos a um número tatuado no braço esquerdo.'\n\n(Fonte: Primo Levi, É isto um homem?, Rocco).", "O testemunho de Primo Levi evoca a barbárie do Holocausto durante a Segunda Guerra Mundial, demonstrando que o sistema concentracionário nazista operava por meio da:", ["assimilação voluntária das minorias étnicas aos padrões de cidadania plena da Alemanha nazista.", "integração das populações prisioneiras ao mercado consumidor europeu com salários regulamentados.", "desumanização metódica e extermínio planejado de grupos humanos classificados como racialmente inferiores.", "punição provisória de criminosos comuns condenados por tribunais civis com amplo direito de defesa.", "substituição pacífica dos conflitos armados internacionais por negociações diplomáticas de desarmamento."], 2, "Passo a passo:\n1. Fonte e contexto: Primo Levi narra a perda do nome, da roupa e da própria condição humana no campo de Auschwitz.\n2. Raciocínio: O Holocausto foi um genocídio de Estado singular pela utilização de métodos industriais e ideologia eugênica para apagar a existência dos povos considerados 'indesejáveis' pelo nazismo (Gabarito C).\n3. Distratores: A e B mascaram o genocídio como inclusão ou trabalho regular; C ignora o caráter ideológico e arbitrário do massacre; E não tem qualquer relação com o terror concentracionário."], "Criação da ONU e Declaração dos Direitos Humanos": ["O término da Segunda Guerra Mundial, com a revelação dos horrores dos campos de concentração nazistas e o impacto devastador das bombas atômicas, exigiu uma reconstrução radical da ordem internacional. Em 1945, a Conferência de São Francisco reuniu representantes de 50 países para aprovar a Carta das Nações Unidas, criando a Organização das Nações Unidas (ONU) em substituição à inoperante Liga das Nações. Em 10 de dezembro de 1948, a Assembleia Geral da ONU proclamou a Declaração Universal dos Direitos Humanos (DUDH), estabelecendo pela primeira vez que todas as pessoas nascem livres e iguais em dignidade e direitos, independentemente de raça, cor, sexo, religião ou nacionalidade, consagrando a dignidade humana como norma global.", ["1945: Fundação da ONU na Conferência de São Francisco para garantir a paz e a segurança coletiva", "Conselho de Segurança: Órgão deliberativo executivo com 5 membros permanentes com poder de veto (EUA, URSS/Rússia, China, Reino Unido e França)", "10 de dezembro de 1948: Proclamação da Declaração Universal dos Direitos Humanos em Paris", "Eleanor Roosevelt: Papel de liderança fundamental na redação dos artigos da Declaração", "Universalidade e Inalienabilidade: Direitos inerentes a todo ser humano sem qualquer distinção"], "O poder de veto dos cinco membros permanentes do Conselho de Segurança da ONU reflete a geopolítica das potências vencedoras de 1945 e muitas vezes paralisa a tomada de decisões em crises humanitárias contemporâneas.", "Artigo 1º da Declaração Universal dos Direitos Humanos (1948):\n\n'Todos os seres humanos nascem livres e iguais em dignidade e em direitos. Dotados de razão e de consciência, devem agir uns para com os outros em espírito de fraternidade.'\n\n(Fonte: Organização das Nações Unidas, Paris, 10 dez. 1948).", "A proclamação da Declaração Universal dos Direitos Humanos em 1948 constituiu um marco civilizatório internacional voltado precipuamente a:", ["restringir as liberdades civis para assegurar o poder hegemônico incontestável das grandes potências nucleares.", "impor o modelo político norte-americano como regime obrigatório a todos os países membros da organização.", "subordinar a soberania das nações periféricas à exploração compulsória das corporações transnacionais.", "estabelecer parâmetros éticos globais que impedissem a repetição das atrocidades cometidas durante os regimes totalitários.", "conceder direito a voto exclusivo nas Nações Unidas às nações detentoras de armamentos atômicos."], 3, "Passo a passo:\n1. Fonte e contexto: O artigo 1º consagra a igualdade e a dignidade humana após os horrores da Segunda Guerra.\n2. Raciocínio: A DUDH de 1948 foi a resposta moral e jurídica da comunidade internacional contra a desumanização perpetrada pelo nazismo e pelo totalitarismo bélico (Gabarito D).\n3. Distratores: A e D defendem a opressão que o texto combate; C e E contrariam os princípios de igualdade entre povos e universalidade da Carta da ONU."], "Guerra Fria: Bipolaridade e Corrida Armamentista": ["A Guerra Fria (1947-1991) foi o estado de confronto político, ideológico, militar, econômico e cultural entre duas superpotências nucleares: os Estados Unidos (defensores do capitalismo e da democracia liberal) e a União Soviética (defensora do socialismo de Estado e da economia planificada). O conflito era chamado de 'frio' porque nunca houve choque militar nuclear direto entre as duas superpotências, diante da 'Destruição Mútua Assegurada' (MAD). A disputa desdobrou-se na criação de blocos militares (OTAN versus Pacto de Varsóvia), planos de ajuda econômica (Plano Marshall versus Comecon), corrida espacial (satélite Sputnik, homem no espaço, chegada à Lua) e constante espionagem (CIA versus KGB).", ["Doutrina Truman (1947): Estratégia dos EUA de contenção do comunismo no globo", "Plano Marshall (1947): Ajuda financeira maciça para reconstruir a Europa Ocidental capitalista", "OTAN (1949) e Pacto de Varsóvia (1955): Alianças militares estratégicas de defesa mútua dos dois blocos", "Cortina de Ferro: Expressão de Winston Churchill para a divisão geopolítica e física da Europa", "Corrida Espacial: Disputa por hegemonia tecnológica (Sputnik em 1957; Apollo 11 em 1969)"], "A Guerra Fria não teve confronto direto na Europa, mas provocou guerras 'quentes' devastadoras na periferia do sistema (Coreia, Vietnã, guerras de descolonização na África e golpes militares na América Latina).", "Discurso do Presidente Harry S. Truman perante o Congresso dos EUA (março de 1947):\n\n'Acredito que a política dos Estados Unidos deva ser a de apoiar os povos livres que estão resistindo às tentativas de subjugação por minorias armadas ou por pressões externas. Devemos ajudar os povos livres a forjar seus próprios destinos segundo sua própria vontade.'\n\n(Fonte: Discursos Presidenciais Americanos, Washington).", "O pronunciamento de Harry Truman sintetiza as diretrizes da chamada Doutrina Truman, que visava:", ["promover a cooperação tecnológica e o desarmamento conjunto entre Washington e Moscou.", "financiar partidos comunistas para enfraquecer os antigos impérios coloniais britânico e francês.", "estabelecer o isolacionismo estrito da diplomacia dos Estados Unidos em relação aos assuntos europeus.", "dissolver alianças bélicas permanentes como a Organização do Tratado do Atlântico Norte.", "conter militar e financeiramente a expansão da influência soviética em âmbito global."], 4, "Passo a passo:\n1. Fonte e contexto: O discurso de Truman em 1947 é o marco fundador da Guerra Fria e da política de contenção.\n2. Raciocínio: A Doutrina Truman justificava a intervenção dos EUA em qualquer região do planeta onde o avanço da influência comunista soviética ameaçasse governos capitalistas (Gabarito E).\n3. Distratores: A sugere paz ilusória; B inverte o inimigo dos EUA; D prega o oposto do intervencionismo ativo de Truman; E contraria a formação da OTAN, que foi liderada exatamente pelos EUA em 1949."], "Conflitos da Guerra Fria: Cuba e Vietnã": ["A tensão bipolar da Guerra Fria materializou-se em violentos conflitos periféricos e crises geopolíticas. Em Cuba, a Revolução de 1959 liderada por Fidel Castro e Che Guevara derrubou a ditadura pró-EUA de Fulgencio Batista e aproximou-se da URSS. Em outubro de 1962, a 'Crise dos Mísseis' colocou o mundo à beira de uma guerra nuclear após aviões espiões dos EUA detectarem mísseis soviéticos na ilha caribenha. Na Ásia, a Guerra do Vietnã (1955-1975) opôs o Vietnã do Norte (comunista, apoiado por URSS e China) ao Vietnã do Sul (capitalista, apoiado diretamente por tropas e bombardeios dos EUA). A resistência dos guerrilheiros vietcongues, o uso de armas químicas (napalm) e os protestos pacifistas levaram à humilhante retirada americana e à unificação socialista do país.", ["1959: Vitória da Revolução Cubana e posterior alinhamento com o bloco soviético", "Outubro de 1962: Crise dos Mísseis em Cuba (Kennedy e Kruschev negociam e instalam a linha direta 'telefone vermelho')", "Guerra do Vietnã: Conflito assimétrico de guerrilha na selva com maciço emprego de armas incendiárias pelos EUA", "Teoria do Dominó: Tese americana de que a queda de um país para o comunismo arrastaria os vizinhos", "1975: Queda de Saigon e unificação do Vietnã sob o regime comunista"], "A Guerra do Vietnã foi a primeira guerra televisionada da história: as imagens cruas de civis queimados por napalm chocaram a opinião pública mundial e aceleraram a mobilização pacifista nos EUA.", "Declaração de Nikita Kruschev ao Presidente John F. Kennedy durante a Crise dos Mísseis (1962):\n\n'Nós e vós não deveríamos puxar as pontas da corda na qual atastes o nó da guerra nuclear, porque quanto mais puxarmos, tanto mais apertado o nó ficará, até que chegue um momento em que nem mesmo aquele que o atou terá força para desatá-lo.'\n\n(Fonte: Correspondências Oficiais Kruschev-Kennedy, Arquivo Nacional dos EUA).", "A metáfora de Kruschev sobre a 'corda da guerra nuclear' durante a Crise dos Mísseis em Cuba ilustra a dinâmica da Guerra Fria caracterizada pelo:", ["risco iminente de destruição planetária em virtude da capacidade destrutiva do arsenal nuclear de ambas as potências.", "desinteresse de Estados Unidos e União Soviética em interferir na geopolítica do continente americano.", "desarmamento atômico unilateral imediato acordado entre as duas superpotências rivais.", "consenso de que o uso de armas nucleares constituía uma tática militar simples e desprovida de represálias.", "abandono definitivo das disputas de espionagem e das corridas militares em favor do livre comércio."], 0, "Passo a passo:\n1. Fonte e contexto: A carta de Kruschev expressa a gravidade da Crise dos Mísseis em 1962, quando o mundo esteve a poucas horas do confronto atômico direto.\n2. Raciocínio: A consciência da Destruição Mútua Assegurada (MAD) compeliu os líderes de ambos os blocos a recuar para evitar o aniquilamento da humanidade (Gabarito A).\n3. Distratores: B nega a importância de Cuba; C e E afirmam um desarmamento e pacifismo que não ocorreram na Guerra Fria; D contraria a evidência do perigo cataclísmico das armas nucleares."], "Processo de Independência e Primeiro Reinado": ["A transferência da Corte portuguesa para o Rio de Janeiro em 1808 transformou a colônia em sede do Império luso, com a Abertura dos Portos às Nações Amigas e a elevação do Brasil a Reino Unido (1815). A Revolução Liberal do Porto (1820) exigiu o retorno de D. João VI e tentou recolonizar o Brasil, provocando a reação das elites agrárias aglutinadas em torno do príncipe regente D. Pedro. Após o Dia do Fico e o 7 de setembro de 1822, a Independência foi consolidada mantendo a forma monárquica, a grande propriedade latifundiária e a escravidão africana. O Primeiro Reinado (1822-1831) foi marcado pelo autoritarismo de D. Pedro I, que dissolveu a Constituinte da Mandioca e outorgou a Constituição de 1824 com o Poder Moderador, enfrentando a Confederação do Equador (1824) e abdicando em 1831.", ["1808: Abertura dos Portos às Nações Amigas rompendo formalmente o exclusivo metropolitano", "1822: Independência conservadora que manteve a monarquia e a escravidão intocadas", "Constituição de 1824: Outorgada por D. Pedro I, instituindo quatro poderes e o Poder Moderador exclusivo do Imperador", "Voto Censitário: Voto indireto baseado em renda anual comprovada em alqueires de mandioca ou moeda", "Confederação do Equador (1824): Revolta republicana e separatista em Pernambuco liderada por Frei Caneca"], "A Independência brasileira foi uma 'revolução conservadora': não houve participação popular direta no poder, nem transformação da ordem social; a monarquia preservou a unidade territorial e os privilégios dos grandes senhores de terras e escravos.", "Artigo 98 da Constituição Política do Império do Brasil (1824):\n\n'O Poder Moderador é a chave de toda a organização política, e é delegado privativamente ao Imperador, como Chefe Supremo da Nação, e seu Primeiro Representante, para que incessantemente vele sobre a manutenção da independência, equilíbrio e harmonia dos mais Poderes políticos.'\n\n(Fonte: Constituição do Império do Brasil, 1824).", "A instituição do Poder Moderador na Carta Imperial outorgada em 1824 caracterizou a estrutura do Estado brasileiro por:", ["estabelecer o sufrágio universal masculino e o controle do Legislativo sobre as nomeações ministeriais.", "assegurar a supremacia política do monarca, permitindo-lhe dissolver a Câmara dos Deputados e vetar leis.", "conceder autonomia federativa plena às províncias para aprovarem suas próprias constituições republicanas.", "extinguir os privilégios nobiliárquicos e confiscar os latifúndios improdutivos dos grandes cafeicultores.", "subordinar as Forças Armadas imperiais ao comando de generais eleitos pelo voto direto popular."], 1, "Passo a passo:\n1. Fonte e contexto: O artigo 98 define o Poder Moderador, concebido pelo teórico Benjamin Constant, como privativo do monarca.\n2. Raciocínio: O Poder Moderador sobrepunha-se aos poderes Executivo, Legislativo e Judiciário, outorgando a D. Pedro I a faculdade de dissolver a Câmara, nomear senadores vitalícios e anular decisões judiciais (Gabarito B).\n3. Distratores: A é anacrônica (o voto era censitário e indireto); B descreve federalismo republicano (o Império era centralizador e unitário); D e E contradizem os interesses da aristocracia escravocrata imperial."], "Período Regencial e Revoltas Provinciais": ["Com a abdicação de D. Pedro I em 1831 e a minoridade de seu herdeiro D. Pedro de Alcântara (com apenas cinco anos), o Brasil viveu o Período Regencial (1831-1840). O Ato Adicional de 1834 descentralizou provisoriamente a administração ao criar as Assembleias Legislativas Provinciais e extinguir o Conselho de Estado, mas acirrou disputas locais. O período foi um dos mais conturbados da história nacional, marcado por revoltas populares e separatistas em várias províncias: Cabanagem no Pará (revolta popular pobre), Farroupilha no Rio Grande do Sul (república de estancieiros gaúchos), Revolta dos Malês na Bahia (insurreição de escravizados muçulmanos letrados), Sabinada e Balaiada no Maranhão. Diante da ameaça de fragmentação do país, a elite antecipou a maioridade do príncipe com o Golpe da Maioridade em 1840.", ["Ato Adicional de 1834: Medida de descentralização liberal que concedeu autonomia às províncias", "Cabanagem (1835-1840): Levante no Grão-Pará com maciça participação de ribeirinhos, indígenas e mestiços", "Revolta dos Malês (Salvador, 1835): Insurreição urbana de negros islamizados que sabiam ler e escrever em árabe", "Guerra dos Farrapos (1835-1845): Conflito separatista gaúcho republicano contra a política alfandegária do charque", "1840: Golpe da Maioridade declarando D. Pedro II imperador aos 14 anos para restaurar a ordem central"], "Atenção para as diferentes motivações sociais das revoltas regenciais: Farroupilha era de elite proprietária; Cabanagem e Balaiada eram revoltas com base popular oprimida; Revolta dos Malês foi um levante negro urbano de identidade religiosa muçulmana.", "Trecho de panfleto atribuído aos líderes da Revolta dos Malês em Salvador (1835):\n\n'Em nome de Alá, o Clemente e Misericordioso: chegara o dia marcado para a nossa libertação do cativeiro dos infiéis brancos. Que todo homem de fé empunhe a sua espada e lute pela vitória dos nossos irmãos.'\n\n(Fonte: Documentos da Devassa do Levante de 1835, Arquivo Público do Estado da Bahia).", "A Revolta dos Malês, ocorrida em Salvador em 1835, distinguiu-se de outros levantes do Período Regencial por ter sido articulada por:", ["senhores de engenho contrários à concorrência do açúcar produzido nas Antilhas holandesas.", "oficiais liberais do Exército que exigiam a expulsão imediata de todos os cidadãos estrangeiros.", "africanos escravizados e libertos que mobilizaram sua identidade religiosa islâmica e alfabetização árabe como instrumento de luta.", "comerciantes portugueses reunidos em torno da restauração do trono absolutista de D. Pedro I.", "pequenos fazendeiros paulistas que demandavam subsídios fiscais para a cultura cafeeira emergente."], 2, "Passo a passo:\n1. Fonte e contexto: A insurreição de 1835 em Salvador foi organizada por negros nagôs e hauçás praticantes do Islã.\n2. Raciocínio: Os escravizados malês utilizavam o árabe escrito para transmitir mensagens cifradas e organizar o plano de tomada da cidade e conquista da liberdade religiosa e civil (Gabarito C).\n3. Distratores: A, B, D e E atribuem o levante a classes brancas e proprietárias, desconsiderando a especificidade da rebelião escrava muçulmana urbana."], "Segundo Reinado e Parlamentarismo às Avessas": ["O Segundo Reinado (1840-1889), governado por D. Pedro II, representou o período de maior estabilidade política e expansão econômica do Império. O cenário partidário organizou-se em torno do Partido Liberal e do Partido Conservador ('luzias' e 'saquaremas'), duas frações da mesma aristocracia agrária e escravocrata ('nada mais parecido com um saquarema do que um luzia no poder'). Em 1847, instituiu-se o 'Parlamentarismo às Avessas': ao contrário do modelo britânico, onde o Parlamento escolhe o primeiro-ministro, no Brasil o Imperador usava o Poder Moderador para nomear o Presidente do Conselho de Ministros e, se conveniente, dissolvia a Câmara dos Deputados para forçar uma maioria parlamentar de sua conveniência.", ["D. Pedro II: Mandato de quase meio século combinando imagem de monarca ilustrado com preservação da escravidão", "Praieira (1848): Última revolta liberal do Império em Pernambuco com o Manifesto ao Mundo (voto livre e fim do Poder Moderador)", "Parlamentarismo às Avessas (1847): O imperador escolhe o chefe do ministério e tutela o Legislativo", "Bipartidarismo aristocrático: Liberais e Conservadores revezando-se sob a arbitragem da Coroa", "Pacificação Imperial: Vitória sobre rebeliões provinciais e consolidação da hegemonia da corte do Rio de Janeiro"], "O parlamentarismo brasileiro era chamado 'às avessas' exatamente pela inversão da soberania: na Inglaterra, o rei reina mas não governa; no Brasil imperial, o imperador governava por meio do Poder Moderador subordinando o Parlamento.", "Caricatura de Décio Villares (Revista Ilustrada, 1878) retratando D. Pedro II segurando nos braços dois bonecos vestidos com fraques, identificados como 'Liberal' e 'Conservador', movimentando-os alternadamente sobre o tabuleiro da política nacional.", "A sátira de época ironiza o funcionamento das instituições do Segundo Reinado brasileiro ao evidenciar:", ["a polarização irreconciliável entre ideologias que defendiam, de um lado, o comunismo e, de outro, o absolutismo.", "a fragilidade do imperador frente ao domínio autônomo e soberano exercido pelo Congresso Nacional.", "a ausência de qualquer partido formal durante todo o século XIX na vida política do país.", "a manipulação política exercida pelo Poder Moderador sobre partidos que representavam os mesmos interesses da elite proprietária.", "o protagonismo das massas populares na definição democrática dos ocupantes dos gabinetes ministeriais."], 3, "Passo a passo:\n1. Fonte e contexto: A charge da Revista Ilustrada mostra D. Pedro II manipulando como fantoches os líderes liberais e conservadores.\n2. Raciocínio: A caricatura retrata o rodízio partidário orquestrado pelo monarca através do Poder Moderador, evidenciando que ambos os partidos compartilhavam a mesma base escravista latifundiária (Gabarito D).\n3. Distratores: A é anacrônica e absurda; B inverte o poder real da monarquia; D é falsa (havia partidos bem organizados); E ignora que as massas eram totalmente alijadas pelo voto censitário."], "Economia Cafeeira e Imigração Europeia": ["A partir de meados do século XIX, o café tornou-se o principal motor da balança comercial brasileira, deslocando-se do Vale do Paraíba (onde predominava a técnica predatória e o trabalho escravo tradicional) para o Oeste Paulista (região de 'terra roxa', com ferrovias e visão empresarial moderna). Com a pressão britânica e a Lei Eusébio de Queirós (1850) extinguindo o tráfico transatlântico, capitais antes imobilizados na compra de cativos foram liberados para melhoramentos urbanos, portuários e manufaturas (Era Mauá). Para suprir a carência de braços na lavoura, promoveu-se a imigração europeia, inicialmente no sistema de parceria (que endividava os colonos, como na revolta de Ibicaba liderada por Thomas Davatz) e, posteriormente, no regime de colonato subvencionado pelo Estado paulista.", ["Vale do Paraíba versus Oeste Paulista: Transição da cafeicultura tradicional decadente para a lavoura dinâmica e moderna", "1850: Lei Eusébio de Queirós extinguindo o tráfico e Lei de Terras dificultando o acesso à propriedade", "Lei de Terras (1850): Terras devolutas só podiam ser adquiridas por compra em dinheiro, excluindo imigrantes pobres e negros", "Sistema de Parceria: Fracasso pelo endividamento imposto pelo cafeicultor aos imigrantes em passagens e víveres", "Colonato Subvencionado: O Estado pagava o transporte e garantia salário fixo e porcentagem da colheita"], "Atenção para a Lei de Terras de 1850: promulgada no mesmo ano do fim do tráfico, visava deliberadamente impedir que escravizados recém-alforriados e imigrantes pobres tivessem acesso à terra, transformando-os compulsoriamente em assalariados rurais.", "Artigo 1º da Lei de Terras (Lei nº 601, de 18 de setembro de 1850):\n\n'Ficam proibidas as aquisições de terras devolutas por outro título que não seja o de compra. [...] Os que ocuparem terras devolutas sem título legítimo serão despojados delas e pagarão multa correspondente ao valor das mesmas.'\n\n(Fonte: Coleção de Leis do Império do Brasil de 1850).", "A aprovação da Lei de Terras em 1850, contemporânea à proibição do tráfico negreiro, teve como consequência social:", ["garantir a posse gratuita de glebas produtivas aos ex-escravizados que desejassem constituir roças familiares.", "facilitar a reforma agrária democratizando o acesso ao solo para os colonos europeus recém-chegados.", "declarar a ilegalidade de todas as grandes fazendas cafeeiras estabelecidas na província de São Paulo.", "promover a demarcação compulsória de reservas florestais intocadas em todo o território nacional.", "bloquear o acesso à propriedade fundiária aos trabalhadores livres e libertos, garantindo mão de obra cativa para os latifúndios."], 4, "Passo a passo:\n1. Fonte e contexto: A Lei nº 601/1850 determinou que a terra pública (devoluta) só pudesse ser adquirida mediante compra à vista da Fazenda Nacional.\n2. Raciocínio: Ao barrar o apossamento consuetudinário da terra, a elite cafeeira assegurou que tanto os imigrantes estrangeiros quanto os futuros negros libertos permanecessem como dependentes assalariados nas fazendas de café (Gabarito E).\n3. Distratores: A e B contrariam o sentido restritivo da lei; D e E inventam regras inexistentes no texto legal imperial."], "Guerra do Paraguai e Crise Monárquica": ["A Guerra do Paraguai ou Guerra da Tríplice Aliança (1864-1870) foi o mais sangrento conflito armado da história da América do Sul. Originou-se das disputas geopolíticas pela navegação na bacia do Rio da Prata e das pretensões expansionistas do presidente paraguaio Francisco Solano López, que invadiu o Mato Grosso e Corrientes. Brasil, Argentina e Uruguai firmaram o Tratado da Tríplice Aliança sob apoio financeiro e logístico britânico. O conflito dizimou a população e a economia do Paraguai. Para o Brasil, os custos financeiros foram exorbitantes, gerando dívidas astronômicas com banqueiros ingleses. Politicamente, a guerra fortaleceu o Exército Brasileiro como corporação coesa, profissional e abolicionista, que passou a contestar a tutela da elite civil imperial e a defender o positivismo republicano.", ["1864-1870: O maior conflito interestatal da América do Sul", "Batalha Naval do Riachuelo (1865): Vitória estratégica da esquadra brasileira sob comando do Almirante Barroso", "Voluntários da Pátria: Recrutamento popular com promessa de alforria para escravizados que lutassem na guerra", "Fortalecimento do Exército: Oficiais insatisfeitos com os políticos civis ('casacas') e influenciados pelo positivismo", "Consequências: Destruição quase total do Paraguai e endividamento do Império que acelerou a crise da monarquia"], "A guerra expôs as contradições do Império: negros escravizados lutavam fardados como soldados da nação ('Voluntários da Pátria'), mas ao regressar viam seus parentes ainda aprisionados no cativeiro.", "Relato do Visconde de Taunay sobre os soldados negros na Guerra do Paraguai (1869):\n\n'Cobriram-se de glória nos campos de batalha do Paraguai milhares de bravos de cor que lutaram pela nossa bandeira sob a promessa de liberdade. Como compreender agora que homens que defenderam a Pátria com o próprio sangue voltem a ser tratados como mercadorias pelos tribunais do Império?'\n\n(Fonte: Alfredo d'Escragnolle Taunay, Recordações de Guerra e Viagem).", "A participação de contingentes de escravizados na Guerra do Paraguai contribuiu para desestabilizar a monarquia brasileira porque:", ["tornou insustentável a manutenção da escravidão perante a corporação militar, fortalecendo a causa abolicionista no país.", "consolidou a união inabalável entre os oficiais generais do Exército e os grandes cafeicultores escravocratas do Vale do Paraíba.", "provocou a revolta armada dos soldados paraguaios que invadiram o Rio de Janeiro para libertar os cativos.", "levou o governo imperial a revogar imediatamente a Constituição de 1824 para outorgar uma república de soldados.", "fez com que a Inglaterra rompesse relações comerciais com o Brasil para defender a continuidade do cativeiro."], 0, "Passo a passo:\n1. Fonte e contexto: O depoimento de Taunay expressa a consternação moral e política dos oficiais do Exército diante da escravidão no retorno da guerra.\n2. Raciocínio: Os oficiais militares passaram a enxergar a escravidão como uma vergonha nacional que enfraquecia a honra da pátria, recusando-se a caçar escravos fugidos nos anos 1880 (Gabarito A).\n3. Distratores: A inverte a relação (o Exército rompeu com os barões do café); B é absurda; D erra a cronologia e agentes da proclamação; E inverte a postura britânica, que combatia a escravidão."], "Tráfico Negreiro e Leis Abolicionistas": ["A pressão do Império Britânico contra o tráfico negreiro internacional (Bill Aberdeen, de 1845, autorizando a marinha inglesa a apresados navios negreiros até em águas brasileiras) forçou a aprovação da Lei Eusébio de Queirós em 1850, que extinguiu em definitivo o tráfico transatlântico no Brasil. O fim do influxo externo valorizou os escravizados e gerou o 'tráfico interprovincial', transferindo cativos do Nordeste decadente para os cafezais do Sudeste. Para conter a fúria abolicionista sem desagradar os latifundiários, o Estado imperial implementou leis emancipacionistas graduais: a Lei do Ventre Livre (1871, declarando livres os filhos de mulheres escravizadas nascidos a partir daquela data, mas retendo-os sob tutela senhorial até os 21 anos) e a Lei dos Sexagenários ou Saraiva-Cotegipe (1885, libertando os raros cativos que atingissem 60 anos, sob condição de mais três anos de trabalho forçado).", ["1845: Bill Aberdeen britânico intensificando o bloqueio naval ao tráfico no Atlântico", "1850: Lei Eusébio de Queirós encerrando definitivamente o tráfico de africanos para o Brasil", "Tráfico Interprovincial: Migração compulsória interna do Nordeste para as fazendas de café de SP e RJ", "1871: Lei do Ventre Livre (Lei Rio Branco), conferindo liberdade tutelada aos nascituros", "1885: Lei dos Sexagenários (Lei Saraiva-Cotegipe), medida paliativa para adiar a emancipação total"], "As leis 'gradualistas' (Ventre Livre e Sexagenários) foram pensadas pela bancada escravocrata do Parlamento para protelar a abolição e indenizar os fazendeiros com a exploração contínua do trabalho dos 'libertos'.", "Artigo 1º da Lei nº 2.040, de 28 de setembro de 1871 (Lei do Ventre Livre):\n\n'Os filhos de mulher escrava que nascerem no Império desde a data desta lei serão considerados de condição livre. Os ditos filhos menores ficarão em poder e sob a autoridade dos senhores de suas mães, os quais terão obrigação de criá-los e tratá-los até a idade de oito anos completos, quando poderão optar por receber indenização do Estado ou utilizar seus serviços até a idade de 21 anos.'\n\n(Fonte: Coleção de Leis do Império do Brasil).", "A análise do texto da Lei do Ventre Livre (1871) demonstra que a legislação imperial visava:", ["promover a desapropriação imediata de todos os latifúndios cafeeiros do Sudeste.", "atender às pressões abolicionistas por meio de um processo gradual que preservava a exploração do trabalho pelos senhores.", "conceder aposentadoria precoce e pensões integrais pagas pelo Estado a todas as mães escravizadas.", "estabelecer o fim sumário da servidão de todos os cativos independentemente de sua idade.", "estimular o retorno maciço de todos os africanos libertos para seus países de origem no continente africano."], 1, "Passo a passo:\n1. Fonte e contexto: A lei declarava livres os bebês, mas deixava a criança trabalhando para o senhor até os 21 anos.\n2. Raciocínio: A elite imperial buscou uma via lenta de conciliação para desarmar o movimento abolicionista sem prejuízos imediatos ao fornecimento de mão de obra nas fazendas (Gabarito B).\n3. Distratores: A, D e E afirmam rupturas radicais inexistentes na lei; C inventa benefícios previdenciários impensáveis no regime escravista."], "Movimento Abolicionista e Lei Áurea": ["Na década de 1880, a luta contra a escravidão ganhou as ruas e tornou-se o primeiro grande movimento social de massas do Brasil, articulando intelectuais, parlamentares, jornalistas, artistas, advogados e escravizados rebeldes. Lideranças como o advogado negro Luís Gama (que libertou centenas de cativos nos tribunais), o engenheiro André Rebouças, o orador José do Patrocínio e o escritor Joaquim Nabuco mobilizaram a opinião pública e fundaram a Confederação Abolicionista. Paralelamente, ações diretas multiplicavam-se: fugas coletivas para o Quilombo do Jabaquara em Santos e a greve de jangadeiros liderada pelo 'Dragão do Mar' no Ceará (primeira província a abolir a escravidão, em 1884). Encurralado, o governo imperial capitulou: em 13 de maio de 1888, a Princesa Isabel assinou a Lei Áurea, extinguindo legalmente o cativeiro sem indenização aos senhores de escravos.", ["Abolicionismo de Massas: Articulação entre ação jurídica, imprensa, mobilização urbana e rebelião de escravizados", "Luís Gama: Pioneiro na advocacia de libertação de negros escravizados ilegalmente pós-1831", "Dragão do Mar (Francisco José do Nascimento): Jangadeiro cearense que paralisou o embarque de cativos em Fortaleza (1881)", "Quilombo do Jabaquara (Santos): Refúgio de milhares de negros fugidos sob a proteção de caifazes", "13 de Maio de 1888: Lei Áurea (Lei nº 3.353), com apenas dois artigos, abolindo a escravidão sem políticas reparatórias"], "Atenção para o pós-abolição: A Lei Áurea libertou os corpos, mas não concedeu terra, educação, indenização ou emprego aos negros libertos, perpetuando o racismo estrutural e a marginalização social que perduram até hoje.", "Texto integral da Lei nº 3.353, de 13 de maio de 1888 (Lei Áurea):\n\n'A Princesa Imperial Regente, em Nome de Sua Majestade o Imperador o Senhor D. Pedro II, Faz saber a todos os súditos do Império que a Assembleia Geral Decretou e Ela Sancionou a Lei seguinte:\nArt. 1º: É declarada extinta desde a data desta lei a escravidão no Brasil.\nArt. 2º: Revogam-se as disposições em contrário.'\n\n(Fonte: Imprensa Nacional, Rio de Janeiro, 1888).", "A extinção da escravidão no Brasil pela Lei Áurea caracterizou-se historicamente por:", ["garantir uma reforma agrária ampla que outorgou aos libertos a posse das lavouras onde trabalhavam.", "resultar exclusivamente da benevolência da família real, sem influência de movimentos sociais populares.", "conceder a liberdade jurídica sem assegurar políticas de reparação material ou integração cidadã aos recém-libertos.", "indenizar financeiramente os proprietários rurais com títulos do Tesouro Nacional resgatáveis em ouro.", "estabelecer que todos os ex-cativos deveriam continuar trabalhando compulsoriamente nas mesmas fazendas por mais dez anos."], 2, "Passo a passo:\n1. Fonte e contexto: A Lei Áurea possui apenas duas linhas objetivas que declaram a escravidão extinta e revogam o contrário.\n2. Raciocínio: Ao omitir qualquer mecanismo de assistência, moradia, terra ou educação para os libertos, a lei abandonou milhões de pessoas à própria sorte, perpetuando a exclusão socioeconômica (Gabarito C).\n3. Distratores: A é falsa (não houve reforma agrária); B adota o mito da 'Princesa Redentora' refutado pela historiografia que destaca o protagonismo negro; C é falsa (não houve indenização aos senhores, o que os levou a apoiar a República); E descreve o projeto que foi rejeitado."], "Golpe Republicano e Proclamação da República": ["A Proclamação da República em 15 de novembro de 1889 resultou do isolamento completo da monarquia perante suas três bases tradicionais de apoio: a Igreja Católica (crise após a prisão de bispos maçons pelo Estado imperial), os cafeicultores escravocratas (que se sentiram traídos pela Coroa pela perda de seus cativos sem indenização em 1888, transformando-se nos 'republicanos de última hora') e o Exército Brasileiro (insatisfeito com a censura e a marginalização política imposta pelo gabinete imperial de Ouro Preto). Lideradas pelo Marechal Deodoro da Fonseca e instigadas por Benjamin Constant e civis conspiradores (como Quintino Bocaiuva e Rui Barbosa), as tropas marcharam contra o Ministério da Guerra, baniram a família imperial e instalaram um governo republicano provisório sem qualquer participação das camadas populares.", ["15 de novembro de 1889: Marcha militar na Praça da Aclamação e derrubada do gabinete de Ouro Preto", "Questão Religiosa (1872-1875): Choque entre a Igreja Católica e o Estado Imperial sobre a Maçonaria", "Questão Militar (década de 1880): Recusa dos oficiais do Exército em aceitar a censura civil dos ministros imperiais", "Republicanos de 13 de Maio: Cafeicultores escravocratas que aderiram à República por ressentimento contra a Lei Áurea", "Aristides Lobo: Jornalista testemunha que escreveu que 'o povo assistiu àquilo bestializado, pensando tratar-se de um desfile militar'"], "A República no Brasil não nasceu de uma revolução popular democrática, mas de um golpe de Estado civil-militar orquestrado nos quartéis e salões das elites cafeeiras e militares.", "Artigo do jornalista e político republicano Aristides Lobo publicado no 'Diário Popular' de São Paulo (novembro de 1889):\n\n'O povo assistiu àquilo tudo bestializado, atônito, surpreso, sem conhecer o que significava. Muitos acreditaram seriamente estar vendo uma parada militar ou mais uma exibição das tropas da guarnição da corte.'\n\n(Fonte: Diário Popular, 18 nov. 1889).", "O famoso testemunho de Aristides Lobo sobre o evento de 15 de novembro de 1889 ressalta:", ["a intensa mobilização operária que ocupou os centros urbanos para exigir a instauração da ditadura do proletariado.", "a concordância espontânea de camponeses e sertanejos com o projeto republicano positivista.", "a resistência armada ferrenha travada pelas massas populares em defesa intransigente do retorno do imperador D. Pedro II.", "o caráter elitista do movimento republicano, conduzido pelas Forças Armadas sem a participação ativa da população.", "o fechamento de todos os quartéis militares por determinação direta das lideranças sindicais anarquistas."], 3, "Passo a passo:\n1. Fonte e contexto: Aristides Lobo, republicano histórico, constata com lucidez a ausência de participação popular na deposição da monarquia.\n2. Raciocínio: O termo 'bestializado' consagrou na historiografia a noção de que a proclamação da República foi um conchavo de cúpula entre oficiais do Exército e oligarcas paulistas, mantendo o povo na condição de mero espectador (Gabarito D).\n3. Distratores: A, B, D e E atribuem ao povo ou sindicatos papéis que inexistiram em 15 de novembro de 1889."], "Primeira Revolução Industrial e Mudanças Sociais": ["Iniciada na Inglaterra em meados do século XVIII, a Primeira Revolução Industrial marcou a transição da manufatura para a maquinofatura, impulsionada pela máquina a vapor de James Watt, o tear mecânico e o carvão mineral como fonte de energia. A Inglaterra reuniu pioneirismo por acumulação de capital colonial, jazidas abundantes de ferro e carvão, marinha mercante hegemônica e a Lei de Cercamento dos Campos (Enclosure Acts), que expulsou camponeses da terra e forneceu mão de obra farta e miserável para as cidades industriais (Manchester, Birmingham). A nova ordem estabeleceu a divisão social entre a burguesia industrial (proprietária dos meios de produção) e o proletariado (possuidor apenas de sua força de trabalho), submetido a jornadas extenuantes de até 16 horas diárias, ambientes insalubres e exploração sistemática do trabalho de mulheres e crianças.", ["Pioneirismo Inglês: Cercamento dos campos (Enclosures), carvão mineral, capital comercial acumulado e estabilidade política liberal", "Máquina a Vapor e Tear Mecânico: Salto exponencial na produtividade têxtil e surgimento das fábricas modernas", "Divisão Social do Trabalho: Alienação do trabalhador, que deixa de dominar o processo produtivo completo", "Exploração do Trabalho Infantil e Feminino: Salários inferiores e disciplina fabril severa com castigos físicos", "Urbanização Desordenada: Proliferação de cortiços insalubres e epidemias (cólera e tifo) nos bairros operários"], "Atenção para o conceito de tempo na fábrica: o ritmo biológico e solar da vida camponesa foi substituído pela tirania do relógio, da sirene e da cadência das engrenagens mecânicas.", "Depoimento de uma trabalhadora perante a Comissão Parlamentar Britânica (Relatório Sadler, 1832):\n\n'Comecei a trabalhar na tecelagem de algodão aos oito anos. O horário habitual era das cinco da manhã às oito da noite, com apenas trinta minutos para o almoço. Se nos atrasássemos cinco minutos, éramos açoitadas com tiras de couro pelo feitor para não diminuir a velocidade dos teares.'\n\n(Fonte: Sadler Committee Report, British Parliamentary Papers, 1832).", "O documento parlamentar britânico da década de 1830 testemunha as consequências sociais da Primeira Revolução Industrial caracterizadas por:", ["ampla proteção jurídica com concessão voluntária de previdência social e férias remuneradas pelos industriais.", "eliminação da divisão social do trabalho em favor do controle cooperativo das fábricas pelos artesãos manuais.", "redução das desigualdades econômicas entre os proprietários do capital e os trabalhadores manufatureiros.", "proibição estrita do trabalho infantil e instituição da jornada compulsória de seis horas diárias para as mulheres.", "jornadas de trabalho abusivas, ausência de direitos trabalhistas e violência disciplinar contra crianças e operários."], 4, "Passo a passo:\n1. Fonte e contexto: O Relatório Sadler coletou depoimentos estarrecedores da classe trabalhadora inglesa para instruir as primeiras leis de fábricas.\n2. Raciocínio: O relato documenta a exploração brutal do proletariado nas primeiras décadas do capitalismo industrial, sem qualquer intervenção protetiva do Estado liberal (Gabarito E).\n3. Distratores: A, D e E descrevem direitos e proteções sociais que só seriam conquistados após décadas de lutas sindicais árduas; C contraria a especialização e alienação capitalista da maquinofatura."], "Segunda Revolução Industrial e Capital Financeiro": ["A partir da segunda metade do século XIX (por volta de 1870), consolidou-se a Segunda Revolução Industrial, espalhando-se da Inglaterra para a Alemanha, Estados Unidos, França e Japão. Suas marcas tecnológicas fundamentais foram a substituição do ferro pelo aço (método Bessemer), o aproveitamento do petróleo e da energia elétrica como matrizes energéticas, os motores a combustão interna e a química pesada. Nesse período, o capitalismo de livre concorrência transformou-se no capitalismo monopolista e financeiro, marcado pela fusão do capital bancário com o capital industrial. Surgiram os oligopólios: trustes (fusão de empresas do mesmo ramo), cartéis (acordos secretos de preços e divisão de mercados) e holdings (empresas financeiras que controlam ações de outras). No chão da fábrica, os métodos de Taylor (taylorismo) e Ford (fordismo) racionalizaram o tempo e a linha de montagem em série.", ["Novas tecnologias: Aço, eletricidade, derivados do petróleo, motor a combustão e telégrafo/telefone", "Capitalismo Monopolista: Fusão do capital industrial com o bancário gerando o capital financeiro", "Concentração de capitais: Trustes, cartéis, holdings e monopólios globais eliminando pequenos produtores", "Fordismo e Linha de Montagem: Produção padronizada em massa de mercadorias barateadas com trabalhadores executando tarefas repetitivas", "Taylorismo: Administração científica com controle cronometrado milimétrico de cada movimento operário"], "O fordismo introduziu a esteira rolante mecânica: o operário não precisava mais se deslocar, o produto vinha até ele na esteira. O filme 'Tempos Modernos', de Charlie Chaplin, é a representação clássica dessa alienação fabril.", "Análise do historiador Eric Hobsbawm em 'A Era dos Impérios' (1875-1914):\n\n'O mundo entrou na era das corporações gigantescas, em que a livre concorrência dos pequenos produtores foi suplantada pela concentração monopolista de capitais e pela simbiose entre as indústrias pesadas e os grandes bancos transnacionais de investimento.'\n\n(Fonte: Eric Hobsbawm, A Era dos Impérios, Paz e Terra).", "A dinâmica econômica da Segunda Revolução Industrial descrita por Hobsbawm caracterizou-se pela:", ["formação de grandes monopólios corporativos e predomínio do capital financeiro sobre os mercados globais.", "descentralização da atividade fabril em pequenas oficinas familiares com total autonomia do artesão.", "recusa do emprego de novas tecnologias como a eletricidade para preservar a queima exclusiva de carvão mineral.", "proibição internacional da formação de trustes e cartéis para assegurar o comércio estritamente comunitário.", "erradicação da produção em larga escala em virtude do encarecimento das matérias-primas petrolíferas."], 0, "Passo a passo:\n1. Fonte e contexto: O excerto de Hobsbawm diagnostica o nascimento do capitalismo monopolista e a formação do capital financeiro.\n2. Raciocínio: A escala titânica dos investimentos exigidos pelas ferrovias, petroquímica e siderurgia impôs a fusão dos bancos com as indústrias, gerando cartéis e trustes mundiais (Gabarito A).\n3. Distratores: A e E contrariam a produção em massa e a concentração monopolista; C e D negam os avanços da eletricidade e a formação comprovada dos trustes que dominaram o período."], "Movimento Operário: Ludismo e Cartismo": ["A degradação das condições de vida nas cidades industriais forçou o operariado britânico a organizar formas pioneiras de resistência. No início do século XIX (1811-1816), o Ludismo, liderado simbolicamente pelo fictício 'General Ned Ludd', promoveu o ataque e a quebra de teares mecânicos, enxergando na máquina a responsável pelo desemprego e pela redução dos salários. A repressão estatal foi impiedosa, punindo os 'quebradores de máquinas' com a forca ou o degredo para a Austrália. Mais tarde, na década de 1830, surgiu o Cartismo, considerado o primeiro movimento operário de massas politicamente articulado. Por meio da redação da 'Carta do Povo' (1838) enviada ao Parlamento, os cartistas exigiam reformas democráticas estruturais: sufrágio universal masculino, voto secreto, renovação parlamentar anual e remuneração aos deputados, para que trabalhadores também pudessem ser eleitos.", ["Ludismo (1811): Quebra das máquinas como protesto contra o desemprego tecnológico e a desvalorização do trabalho artesanal", "Trade Unions: Embrião dos sindicatos ingleses que lutavam por melhores salários e redução da jornada", "Cartismo (década de 1830-1840): Movimento político operário que defendia a conquista de direitos políticos por via parlamentar", "Carta do Povo (1838): Reivindicação do sufrágio universal masculino e do voto secreto", "Leis Fabris (Factory Acts): Conquistas graduais operárias limitando o trabalho infantil e fixando a jornada de dez horas (1847)"], "Não confunda: Ludismo é resistência direta e desesperada voltada contra as máquinas no início do século XIX; Cartismo é resistência política organizada que usa a petição cidadã para disputar o poder do Estado via sufrágio universal.", "Trecho da 'Carta do Povo' (People's Charter), apresentada ao Parlamento britânico em 1838:\n\n'Exigimos o sufrágio universal, para que cada homem possa exercer seu direito de voto sem distinção de fortuna; exigimos o voto por escrutínio secreto, para proteger o trabalhador da coerção do patrão; e exigimos parlamentos anuais e o pagamento de salários aos deputados, a fim de que os trabalhadores possam representar sua própria classe nas câmaras legislativas.'\n\n(Fonte: The People's Charter, Londres, 1838).", "As reivindicações expressas na 'Carta do Povo' pelos cartistas britânicos evidenciam uma estratégia do movimento operário focada em:", ["destruir os maquinários têxteis modernos para retornar ao regime de corporações de ofício medievais.", "conquistar direitos de cidadania e representação política institucional para aprovar leis de proteção social aos trabalhadores.", "promover a restauração do absolutismo monárquico para fechar definitivamente o Parlamento britânico.", "recusar a via eleitoral pacífica para fundar comunas anarquistas autônomas no interior rural do país.", "exigir a obrigatoriedade da escravidão nas colônias ultramarinas para baratear o custo do algodão cru."], 1, "Passo a passo:\n1. Fonte e contexto: A Carta de 1838 exigia sufrágio universal masculino, voto secreto e pagamento de parlamentares.\n2. Raciocínio: Os trabalhadores perceberam que só conquistariam direitos sociais (jornada de trabalho justa, salários dignos, fim do abuso infantil) se pudessem votar e eleger deputados de sua própria classe (Gabarito B).\n3. Distratores: A descreve o Ludismo; B, D e E propõem retrocessos ou estratégias incompatíveis com a petição parlamentar do cartismo."], "Doutrinas Sociais: Socialismo e Anarquismo": ["A pauperização operária estimulou a formulação de teorias críticas ao capitalismo no século XIX. O Socialismo Utópico (Saint-Simon, Charles Fourier e Robert Owen) propunha a criação de sociedades cooperativas ideais (falanstérios) pela persuasão moral das classes abastadas, sem explicar a superação estrutural do capital. Em contraposição, Karl Marx e Friedrich Engels criaram o Socialismo Científico (Marxismo), publicado no 'Manifesto Comunista' (1848) e em 'O Capital'. Fundamentado no materialismo histórico e dialético, o marxismo sustenta que a história humana é a história da luta de classes (burguesia versus proletariado), desmascara a extração da mais-valia (lucro apropriado pelo burguês sobre o trabalho não pago) e defende que o proletariado deve fazer a revolução armada, instalar a ditadura do proletariado e caminhar para a sociedade sem classes nem Estado: o Comunismo. Por sua vez, o Anarquismo (Bakunin e Kropotkin) pregava a abolição imediata e simultânea do capitalismo e do próprio Estado.", ["Socialismo Utópico: Propostas cooperativas e éticas sem análise das leis materiais de reprodução do capital", "Socialismo Científico (Marx e Engels): Materialismo histórico, luta de classes e crítica da mais-valia", "Mais-valia: Fração do valor gerado pelo trabalho do operário que é apropriada gratuitamente pelo dono da fábrica", "Ditadura do Proletariado: Fase transitória de Estado operário antes do comunismo pleno", "Anarquismo (Bakunin): Rejeição radical de toda hierarquia, autoridade e do próprio Estado, propondo autogestão direta"], "Diferença crucial para o ENEM: O marxismo defende uma fase transitória com o Estado controlado pelos trabalhadores (socialismo) antes da extinção do Estado; o anarquismo recusa qualquer tipo de Estado e defende sua destruição imediata na revolução.", "Trecho do Manifesto do Partido Comunista, de Karl Marx e Friedrich Engels (1848):\n\n'A história de todas as sociedades que existiram até nossos dias tem sido a história das lutas de classes. Homem livre e escravo, patrício e plebeu, barão e servo, mestre de corporação e companheiro, numa palavra, opressores e oprimidos, em constante oposição, têm vivido numa guerra ininterrupta, ora franca, ora disfarçada.'\n\n(Fonte: Marx e Engels, Manifesto Comunista, 1848).", "O fundamento teórico exposto no Manifesto Comunista para interpretar as transformações históricas e a evolução da humanidade denomina-se:", ["idealismo metafísico pautado na vontade providencial dos deuses sobre os acontecimentos humanos.", "darwinismo social calcado na sobrevivência biológica dos povos mais aptos e inteligentes.", "materialismo histórico, que concebe as relações de produção e os conflitos de classe como motor da história.", "positivismo comtiano centrado na evolução hierárquica e harmônica rumo à ordem e ao progresso moral.", "liberalismo econômico defensor da auto-regulação perfeita das forças do livre mercado capitalista."], 2, "Passo a passo:\n1. Fonte e contexto: Marx e Engels iniciam o Manifesto de 1848 postulando que a história é a sucessão de lutas entre opressores e oprimidos.\n2. Raciocínio: O materialismo histórico explica que a base material e as relações socioeconômicas de produção definem a estrutura da sociedade e que suas contradições geram a transformação histórica (Gabarito C).\n3. Distratores: A é o oposto do materialismo; B é uma teoria racista imperialista; D é o positivismo de Comte; E é a teoria liberal de Adam Smith combatida por Marx."], "Imperialismo e Conferência de Berlim": ["No final do século XIX, a Segunda Revolução Industrial desencadeou o Imperialismo (Neocolonialismo). As grandes potências capitalistas europeias necessitavam com urgência de fontes abundantes de matérias-primas (petróleo, borracha, cobre, carvão), mercados consumidores protegidos para suas manufaturas e áreas lucrativas para exportar o excedente de capital financeiro. Para legitimar a invasão e a partilha da África e da Ásia, os colonizadores forjaram ideologias racistas pseudocientíficas: o Darwinismo Social (que transpunha a teoria biológica da evolução para as sociedades, alegando a superioridade da 'raça branca') e o 'Fardo do Homem Branco' (a suposta missão de civilizar os povos não europeus). A Conferência de Berlim (1884-1885), convocada por Bismarck, consagrou a partilha do continente africano, desenhando fronteiras artificiais que uniram etnias rivais e separaram povos irmãos, gerando conflitos que perduram no século XXI.", ["Causas econômicas: Busca por matérias-primas, novos mercados consumidores e vazão de capitais excedentes", "Conferência de Berlim (1884-1885): Partilha diplomática da África pelas potências europeias sob o princípio da ocupação efetiva", "Fronteiras Artificiais: Divisão geométrica que desrespeitou as tradições étnicas e culturais dos povos africanos", "Darwinismo Social e Eugenia: Pseudociências que justificavam a dominação imperialista sob a máscara de 'missão civilizadora'", "Congo Belga: Brutal exploração da borracha pelo rei Leopoldo II da Bélgica, marcada por mutilações e genocídio de milhões"], "Cuidado com a retórica da 'missão civilizadora' e do 'fardo do homem branco': tratava-se de uma máscara ideológica racista destinada a ocultar a espoliação violenta e o assassinato de milhões de africanos e asiáticos.", "Poema 'O Fardo do Homem Branco' (The White Man's Burden), de Rudyard Kipling (1899):\n\n'Tomai o fardo do Homem Branco, / Enviai os melhores de vossos filhos / Condenai vossos filhos ao exílio / Para servirem aos vossos cativos; / Para vigiarem, com arreios pesados, / Povos selvagens e rebeldes / Metade demônios, metade crianças.'\n\n(Fonte: McClure's Magazine, 1899).", "Os versos de Kipling expressavam a ideologia imperialista do século XIX fundamentada na premissa de que:", ["os povos africanos e asiáticos deveriam usufruir de autodeterminação política soberana e igualdade plena.", "o continente europeu precisava se isolar economicamente para evitar a contaminação cultural de povos externos.", "as potências imperialistas deveriam abolir seus exércitos coloniais em nome da fraternidade universal pacifista.", "cabia aos europeus, autoproclamados civilizados e superiores, a missão moral de tutelar e colonizar povos considerados inferiores.", "a dominação territorial decorria da vontade pacífica e voluntária manifestada pelos próprios governantes africanos."], 3, "Passo a passo:\n1. Fonte e contexto: O poema de Kipling em 1899 sintetizou a justificação moral do neocolonialismo anglo-saxão.\n2. Raciocínio: Ao desumanizar os colonizados como 'selvagens, metade demônios e metade crianças', o imperialismo justificava o massacre e o saque econômico como um ato benevolente de 'civilização' (Gabarito D).\n3. Distratores: A e D defendem valores emancipatórios diametralmente opostos ao imperialismo; B erra, pois a Europa se expandiu militarmente; E mascara o domínio que foi imposto à força de canhões e metralhadoras Maxim."], "Resistências Anticoloniais: Cipaios e Boxers": ["A imposição colonial europeia não ocorreu de forma pacífica; os povos colonizados protagonizaram intensas insurreições armadas contra o saque imperialista. Na Índia, controlada pela Companhia Britânica das Índias Orientais, eclodiu em 1857 a Revolta dos Cipaios (soldados indianos que serviam ao exército colonial). O estopim foi o uso de cartuchos untados com gordura de vaca e de porco (ofensivos a hindus e muçulmanos), somado à desestruturação da tecelagem tradicional indiana pela concorrência industrial britânica; após a sangrenta vitória britânica, a rainha Vitória assumiu o controle direto da colônia como 'Imperatriz da Índia'. Na China, após as Guerras do Ópio (1839-1860) e a imposição dos 'Tratados Desiguais' (como o Tratado de Nanquim cedendo Hong Kong), estourou em 1900 a Revolta dos Boxers ('Punhos da Justiça e da Concórdia'), sociedade secreta nacionalista que pegou em armas para expulsar missionários cristãos e comerciantes ocidentais.", ["1857: Revolta dos Cipaios na Índia contra a dominação britânica e a imposição cultural religiosa", "Desindustrialização Indiana: Ruína dos artesãos tradicionais de tecidos de algodão face às fábricas de Manchester", "Guerras do Ópio (1839-1860): Forçamento militar britânico para impor o comércio de narcóticos na China imperial", "Tratado de Nanquim (1842): Abertura forçada de portos chineses e cessão territorial de Hong Kong à Grã-Bretanha", "Revolta dos Boxers (China, 1900): Insurreição popular xenófoba esmagada por uma coalizão militar de oito potências imperialistas"], "O tráfico de ópio na China foi promovido pelo governo britânico para forçar a abertura de mercado e equilibrar a balança comercial do chá, revelando a faceta mais predatória e imoral do imperialismo ocidental.", "Proclamação dos líderes da Sociedade dos Boxers (China, 1900):\n\n'Os estrangeiros trazem suas seitas para nos corromper, constroem estradas de ferro que violam os túmulos sagrados dos nossos antepassados e vendem ópio que destrói a mente da nossa mocidade. Expulsemos os demônios estrangeiros para que a Dinastia e o povo do Grande Império possam respirar em paz!'\n\n(Fonte: Documentos da Rebelião Boxer, Pequim).", "A Revolta dos Cipaios (1857) e a Revolta dos Boxers (1900) revelam que o processo de expansão imperialista do século XIX enfrentou:", ["a submissão passiva e complacente das lideranças asiáticas à ocidentalização de suas culturas milenares.", "o apoio maciço das populações colonizadas às missões de evangelização e à destruição de templos pagãos.", "a aliança de camponeses indianos e chineses com as tropas coloniais para derrubar os imperadores locais.", "a celebração irrestrita da introdução de manufaturas industriais que substituíram o trabalho manual tradicional.", "a mobilização armada de povos dominados que resistiram violentamente à espoliação econômica e ao desrespeito a suas tradições culturais."], 4, "Passo a passo:\n1. Fonte e contexto: O panfleto dos Boxers denuncia a agressão ferroviária, as drogas e os missionários estrangeiros na China.\n2. Raciocínio: Ambos os levantes exemplificam a resistência armada contra o colonialismo, contestando a desestruturação socioeconômica e a humilhação cultural imposta pelo Ocidente (Gabarito E).\n3. Distratores: A e C defendem o mito da aceitação pacífica refutado pelos fatos históricos; D e E contrariam a luta declarada contra as tropas invasoras e a concorrência industrial."], "Belle Époque e Paz Armada": ["O período compreendido entre 1871 e 1914 ficou conhecido como 'Belle Époque' ('Bela Época'), marcado pelo otimismo burguês, pelo progresso científico, pela eletricidade iluminando as cidades, pelo cinema, pelo automóvel e pela confiança cega na razão positivista. Contudo, essa aparente euforia cultural e mundana ocultava nos bastidores da geopolítica a chamada 'Paz Armada'. As rivalidades coloniais da Segunda Revolução Industrial e os nacionalismos exacerbados levaram as potências europeias a promover uma frenética corrida armamentista secreta e a estruturar um intrincado sistema de alianças defensivas bilaterais: a Tríplice Entente (França, Reino Unido e Rússia) e a Tríplice Aliança (Alemanha, Áustria-Hungria e Itália). Bastou uma faísca regional nos Bálcãs ('o barril de pólvora da Europa') para que essa paz frágil explodisse na conflagração generalizada da Primeira Guerra Mundial.", ["Belle Époque (1871-1914): Prosperidade cultural burguesa com exposições universais e invenções deslumbrantes", "Paz Armada: Ausência de conflitos diretos na Europa acompanhada de rearmamento maciço e serviço militar compulsório", "Bálcãs: 'Barril de pólvora da Europa' devido ao choque entre o pan-eslavismo sérvio (apoiado pela Rússia) e o Império Austro-Húngaro", "Pangermanismo versus Revanchismo Francês: Disputa pelo controle das províncias industriais de Alsácia e Lorena", "Militarização industrial: As fábricas converteram a ciência e a metalurgia na produção de armas de destruição em massa"], "Alsácia e Lorena: A perda dessas duas regiões ricas em ferro e carvão para a Alemanha na Guerra Franco-Prussiana de 1871 alimentou o revanchismo francês que foi um dos combustíveis mais inflamáveis para a eclosão da Primeira Guerra.", "Crônica de época sobre Paris na Exposição Universal de 1900:\n\n'A Cidade Luz resplandece com a fada da Eletricidade. Os palácios de ferro e vidro anunciam uma nova era de harmonia infinita, onde a máquina libertará o homem de toda fadiga. No entanto, do outro lado do rio Sena, os canhões de longo alcance Krupp e Schneider expostos no pavilhão de artilharia lembram que os governos estão armados até os dentes para o próximo banho de sangue.'\n\n(Fonte: Gazeta de Paris, crônica de agosto de 1900).", "A contradição destacada no texto entre o progresso técnico da 'Belle Époque' e a tensão militar da 'Paz Armada' residia no fato de que:", ["o avanço industrial e científico foi colocado a serviço do aprimoramento bélico e da corrida armamentista entre nações imperialistas.", "os operários das fábricas europeias recusavam a utilização de qualquer maquinário elétrico por convicções religiosas pacifistas.", "as potências imperialistas abandonaram suas ambições territoriais nas colônias africanas para preservar a paz eterna.", "o sistema financeiro europeu faliu completamente devido aos gastos sociais com os sistemas públicos de saúde e educação.", "as nações europeias firmaram acordos de desmilitarização total supervisionados pela Organização das Nações Unidas."], 0, "Passo a passo:\n1. Fonte e contexto: O cronista parisiense confronta a festa das luzes com os canhões de artilharia expostos na mesma feira de 1900.\n2. Raciocínio: A mesma capacidade siderúrgica, química e científica que gerava ferrovias e eletricidade foi mobilizada pelas burguesias imperialistas para produzir canhões, pólvora sem fumaça e preparar exércitos para o massacre de 1914 (Gabarito A).\n3. Distratores: B é anedótica e incorreta; C contradiz a partilha neocolonial brutal; D erra a situação financeira opulenta da burguesia; E é anacrônica (a ONU só surgiu em 1945)."], "República da Espada e Constituição de 1891": ["Os primeiros anos da República brasileira (1889-1894) ficaram conhecidos como 'República da Espada', governados pelos marechais Deodoro da Fonseca e Floriano Peixoto. No campo econômico, o ministro da Fazenda Rui Barbosa lançou a política do 'Encilhamento': estimulou a emissão desenfreada de papel-moeda e facilitou o crédito para a criação de empresas, resultando em especulação bolsista descontrolada, falências e inflação galopante. Em 1891, foi promulgada a primeira Constituição republicana, de forte inspiração norte-americana: instituiu a República Federativa presidencialista com três poderes (Executivo, Legislativo e Judiciário), consagrou o Estado Laico (separação entre Igreja e Estado, registro civil e cemitérios públicos) e extinguiu o voto censitário, estabelecendo o voto universal masculino aberto para maiores de 21 anos (excluindo formalmente analfabetos, mulheres, soldados e mendigos).", ["1889-1894: República da Espada (governos militares de Deodoro da Fonseca e Floriano Peixoto)", "Encilhamento: Política monetária inflacionária e especulativa de Rui Barbosa que causou profunda crise financeira", "Constituição de 1891: Federalismo descentralizado com grande autonomia política e tributária aos estados federados", "Estado Laico: Fim do padroado imperial, criação da certidão de casamento e nascimento civil e laicização das escolas públicas", "Restrições ao voto: Voto universal masculino aberto (não secreto), mantendo os analfabetos e as mulheres de fora"], "O voto na Carta de 1891 não era censitário (não exigia renda em dinheiro), mas era ABERTO (declarado em voz alta). Isso permitiu aos coronéis fiscalizarem os votos e controlarem os eleitores, institucionalizando o 'voto de cabresto'.", "Artigo 70 da Constituição da República dos Estados Unidos do Brasil (1891):\n\n'São eleitores os cidadãos maiores de 21 anos que se alistarem na forma da lei. [...] Não podem alistar-se eleitores para as eleições federais ou para as dos Estados: 1º) os mendigos; 2º) os analfabetos; 3º) os praças de pré, excetuados os alunos das escolas militares de ensino superior; 4º) os religiosos de ordens monásticas sujeitos a voto de obediência.'\n\n(Fonte: Presidência da República, Legislação Histórica).", "A legislação eleitoral consagrada na Constituição brasileira de 1891 produziu como efeito prático no sistema político:", ["a extensão do direito de voto a todas as mulheres adultas e o sigilo obrigatório do voto na cabine eleitoral.", "a exclusão da maioria esmagadora da população pobre do processo eleitoral devido à proibição do voto dos analfabetos.", "a garantia de que qualquer cidadão independente de alfabetização pudesse ser eleito para cargos do Executivo e Legislativo.", "o restabelecimento da cobrança de renda anual mínima exigida para eleitores e candidatos a deputados federais.", "a obrigatoriedade de filiação a partidos operários legalizados sob tutela do Supremo Tribunal Federal."], 1, "Passo a passo:\n1. Fonte e contexto: O artigo 70 veta mendigos, analfabetos e soldados rasos no sufrágio da Primeira República.\n2. Raciocínio: Em um país predominantemente agrário onde mais de 70% da população não sabia ler nem escrever, o veto aos analfabetos assegurou que o poder político continuasse monopólio das elites proprietárias (Gabarito B).\n3. Distratores: A é incorreta (mulheres não votavam e o voto era aberto); C contradiz o texto legal; D descreve o voto censitário do Império (1824); E é uma fantasia política anacrônica."], "Coronelismo, Voto de Cabresto e Clientelismo": ["O 'coronelismo' foi a base de sustentação sociopolítica da Primeira República no interior do país, sustentado pelo poder dos grandes proprietários de terras (denominados 'coronéis', herança dos postos honoríficos da extinta Guarda Nacional). Valendo-se da posse da terra e da ausência do Estado nas regiões rurais, o coronel exercia autoridade privada absoluta sobre os trabalhadores e agregados. O 'voto de cabresto' era viabilizado pelo voto aberto (descoberto): os eleitores eram coagidos por jagunços ou aliciados pela troca de pequenos favores (par de sapatos, remédios, atestado médico, emprego público ou sepultura) — mecanismo conhecido como clientelismo. As fraudes eleitorais eram endêmicas nas seções de votação: incluíam a 'degola' de atas pelas Comissões Verificadoras de Poderes, inclusão de 'eleitores-fantasmas' (cadáveres) e furto de urnas.", ["Coronelismo: Poder oligárquico local de base agrária fundado na violência privada e na rede de lealdades clientelistas", "Voto de Cabresto: Voto vigiado e manipulado diretamente pelo senhor da terra em virtude do sufrágio aberto", "Clientelismo: Troca de bens e favores pessoais imediatos pelo compromisso de fidelidade eleitoral", "Degola Política: Anulação sistemática dos diplomas dos deputados de oposição pela Comissão Verificadora de Poderes", "Currais Eleitorais: Zonas geográficas rurais rigidamente controladas por clãs oligárquicos familiares"], "O coronelismo não era um poder isolado no sertão: ele compunha a engrenagem nacional da 'Política dos Governadores'. O coronel garantia os votos no município para eleger os deputados estaduais e federais do governador, e o governador lhe dava verbas e impunidade policial.", "Trecho clássico da obra 'Coronelismo, Enxada e Voto', do jurista e historiador Victor Nunes Leal (1948):\n\n'O coronelismo é, antes de tudo, um compromisso, uma troca de proveitos entre o poder público, progressivamente fortalecido, e a decadente influência social dos chefes locais. Não é mera sobrevivência do poder privado patriarcal, mas um sistema político complexo onde o coronel fornece votos de cabresto em troca de verbas, nomeações e proteção policial para seu grupo.'\n\n(Fonte: Victor Nunes Leal, Coronelismo, Enxada e Voto, Forense).", "Conforme a análise de Victor Nunes Leal, a eficácia do coronelismo na Primeira República decorria fundamentalmente da:", ["completa ausência de laços políticos entre os coronéis sertanejos e as autoridades do governo estadual.", "utilização de urnas eletrônicas invioláveis que impediam qualquer alteração nas atas de votação eleitoral.", "relação simbiótica de troca mútua de favores entre a liderança agrária local e as esferas estaduais do poder público.", "recusa dos chefes do interior em interferir nas opções ideológicas livres tomadas pelos trabalhadores rurais.", "mobilização exclusiva de ideologias socialistas para conscientizar o operariado dos canaviais nordestinos."], 2, "Passo a passo:\n1. Fonte e contexto: Victor Nunes Leal demonstrou que o coronelismo não era atraso feudal isolado, mas uma engrenagem de poder recíproco moderno.\n2. Raciocínio: O coronel garantia a vitória da chapa situacionista nos 'currais eleitorais' em troca do controle dos cargos públicos locais (delegado, juiz de paz) e de obras orçamentárias (Gabarito C).\n3. Distratores: A diz o oposto (eram intrinsecamente articulados); C é um anacronismo grosseiro (urnas eletrônicas surgiram em 1996); D nega a coerção do voto de cabresto; E confunde com doutrinas sindicais opostas ao coronel."], "Política dos Governadores e Café com Leite": ["Articulada pelo presidente Campos Sales (1898-1902), a 'Política dos Governadores' estruturou a estabilidade oligárquica da Primeira República. O pacto estabelecia um acordo de apoio recíproco: o presidente da República apoiava as oligarquias estaduais dominantes sem intervir nos estados, e os governadores garantiam a eleição de uma bancada parlamentar fiel no Congresso Nacional, utilizando as Comissões de Verificação para 'degolar' (impugnar) deputados de oposição. No ápice federal dessa pirâmide vigorava a 'Política do Café com Leite', a aliança hegemônica entre as duas maiores e mais ricas oligarquias do país: São Paulo (maior polo cafeeiro) e Minas Gerais (grande produtor de leite e detentor do maior colégio eleitoral), que se alternavam ou acordavam a indicação dos candidatos à Presidência da República.", ["Campos Sales: Presidente que institucionalizou a 'Política dos Governadores'", "Comissão Verificadora de Poderes: Órgão parlamentar que diplomava apenas deputados governistas ('degola')", "Política do Café com Leite: Aliança hegemônica entre os Partidos Republicanos Paulista (PRP) e Mineiro (PRM)", "Convênio de Taubaté (1906): Política estatal de valorização do café financiada por empréstimos externos", "Ruptura de 1930: Washington Luís (paulista) indica outro paulista (Júlio Prestes), rompendo com Minas e gerando a Revolução de 1930"], "A alternância do Café com Leite não era matemática perfeita: houve presidentes de outros estados (Rio de Janeiro, Rio Grande do Sul e Paraíba), mas o eixo PRP-PRM mantinha a tutela e o veto da política econômica e da sucessão presidencial.", "Carta do Presidente Campos Sales ao político mineiro Silviano Brandão (1900):\n\n'Neste regime, a verdadeira fo
