de conquistas históricas: o Tribunato da Plebe (com direito de veto às leis patrícias), a Lei das Doze Tábuas (450 a.C., primeira lei escrita romana que coibiu arbitrariedades dos juízes patrícios), a Lei Canuleia (autorizando o casamento misto entre patrícios e plebeus) e a Lei Licínia-Sextia (367 a.C., abolindo a escravidão por dívidas).", ["Patrícios versus Plebeus: O conflito social fundante que moldou o direito e a evolução institucional da Roma republicana", "Senado Romano: Órgão central supremo composto por senadores vitalícios que controlava as finanças e a política externa", "Tribunos da Plebe: Magistrados eleitos pelos plebeus com imunidade sacrossanta e poder de veto (Veto!) sobre os atos consulares", "Lei das Doze Tábuas (450 a.C.): Primeira compilação escrita do direito romano que garantiu publicidade às leis", "Lei Licínia-Sextia (367 a.C.): Extinção da escravidão por dívidas (nexum) e obrigatoriedade de um cônsul de origem plebeia"], "Atenção para o estopim da escravidão romana posterior: Ao abolir a escravidão por dívidas (que recaía sobre cidadãos romanos plebeus), Roma teve que intensificar as guerras externas de conquista territorial para capturar escravizados de guerra estrangeiros.", "Trecho do jurista romano Cícero em 'Das Leis' (século I a.C.) sobre o poder dos Tribunos:\n\n'O Tribunato da Plebe nasceu da rebelião popular e para conter o poder consular e a soberania dos patrícios. A sua sacrossantidade é um freio contra a violência e uma garantia de que a voz do povo não será asfixiada pelo Senado.'\n\n(Fonte: Cícero, De Legibus, Livro III).", "As lutas dos plebeus ao longo da República Romana (509-27 a.C.) tiveram como resultado institucional fundamental:", ["a extinção permanente do Senado e a partilha coletiva imediata de todas as propriedades dos patrícios.", "a conquista de leis escritas públicas e a criação de magistraturas próprias de representação e defesa dos plebeus.", "a restauração imediata da monarquia tirânica com a entrega da coroa imperial aos generais cartagineses.", "o cancelamento definitivo de todas as conquistas territoriais no Mar Mediterrâneo.", "a proibição de que os plebeus pudessem se alistar nas legiões romanas ou contrair matrimônio legal."], 1, "Passo a passo:\n1. Fonte e contexto: O excerto de Cícero reflete sobre o papel dos Tribunos da Plebe como salvaguarda jurídica dos desvalidos contra os abusos do patriciado.\n2. Raciocínio: As greves e secessões plebeias conquistaram leis escritas (Doze Tábuas) e o Tribunato da Plebe, equilibrando a correlação de forças na República e garantindo maior isonomia legal (Gabarito B).\n3. Distratores: A e C são distorções anacrônicas; D e E contrariam a expansão militar de Roma e o avanço gradual da igualdade jurídica plebeia."], "Império Romano e a Pax Romana": ["A expansão territorial romana pelo Mar Mediterrâneo ('Mare Nostrum') após as Guerras Púnicas contra Cartago provocou uma profunda crise social e política na República: os generais enriqueceram, os latifúndios multiplicaram-se sustentados por milhões de escravizados prisioneiros de guerra, e os camponeses plebeus faliram e migraram em massa para Roma, engrossando a plebe faminta. As tentativas de reforma agrária dos irmãos Tibério e Caio Graco foram reprimidas com o assassinato de ambos pelos patrícios. Seguiram-se guerras civis, revoltas de escravizados (como a de Espártaco em 73 a.C.) e a ascensão dos generais dos Triunviratos. Após derrotar Marco Antônio e Cleópatra, Otávio recebeu do Senado o título de 'Augusto' em 27 a.C., inaugurando o Império Romano. O governo de Augusto deu início à 'Pax Romana' (paz interna, segurança nas fronteiras fortificadas e intensa romanização jurídica e cultural das províncias) e consolidou a política do 'Pão e Circo' (Panem et Circenses), distribuindo trigo gratuito e promovendo sangrentos espetáculos de gladiadores no Coliseu para apaziguar a plebe urbana.", ["27 a.C.: Otávio Augusto torna-se o primeiro imperador, concentrando poderes civis, militares e religiosos", "Pax Romana: Período de apogeu econômico, estabilidade imperial e monumentais obras de infraestrutura (aquedutos, estradas)", "Política do Pão e Circo: Distribuição de alimentos e diversão pública violenta (gladiadores e corridas de bigas) para despolitizar as massas", "Modo de Produção Escravista Clássico: O cativeiro de estrangeiros tornou-se a engrenagem motora de toda a economia romana", "Direito Romano: O mais duradouro legado da civilização romana, base dos códigos jurídicos contemporâneos do Ocidente"], "A expressão 'Pão e Circo' (Panem et Circenses) foi cunhada pelo poeta satírico romano Juvenal para denunciar a alienação e a manipulação dos cidadãos romanos, que haviam abandonado o interesse pelos destinos da república em troca de comida de graça e sangue na arena.", "Sátira do poeta romano Juvenal (Século I d.C.):\n\n'Aquele povo que outrora conferia o comando das legiões, os consulados e tudo o mais, agora desinteressou-se de tudo e anseia ansiosamente apenas por duas coisas: pão e jogos de circo.'\n\n(Fonte: Juvenal, Sátiras, X, v. 77-81).", "A prática política do 'Pão e Circo' durante o Império Romano descrita por Juvenal constituía um mecanismo voltado a:", ["capacitar politicamente os cidadãos humildes para que exercessem a crítica aos abusos do imperador nas eleições do Senado.", "promover a libertação em massa dos escravizados e a redistribuição equitativa dos latifúndios da Itália.", "conter revoltas e amortecer as tensões sociais urbanas por meio do assistencialismo alimentar e do entretenimento de massas.", "incentivar a conversão obrigatória dos plebeus romanos ao monoteísmo cristão primitivo.", "arrecadar fundos tributários voluntários entre a plebe miserável para financiar a construção de aquedutos."], 2, "Passo a passo:\n1. Fonte e contexto: Juvenal lamenta a decadência moral da cidadania romana durante o Principado sob o efeito das doações imperiais.\n2. Raciocínio: A concessão de trigo do Estado e espetáculos gratuitos no Circo Máximo e Coliseu serviam para desarmar a revolta popular da plebe empobrecida e evitar contestações à tirania imperial (Gabarito C).\n3. Distratores: A é o exato oposto da alienação denunciada; B, D e E apontam ações inexistentes que não faziam parte da estratégia de poder de Augusto e seus sucessores."], "Crise do Império Romano e Cristianismo": ["A partir do século III d.C., o gigantesco Império Romano entrou em um longo e inexorável processo de decadência. A interrupção das guerras de conquista estancou o fluxo de prisioneiros de guerra, deflagrando a 'crise do escravismo': a escassez de mão de obra desestruturou a produção agrícola, gerando inflação, colapso comercial e desvalorização da moeda. Para contornar a crise, os grandes proprietários rurais introduziram o 'Colonado': camponeses pobres e ex-escravizados foram fixados à terra como 'colonos', entregando parte substancial de sua colheita ao senhor da 'villa' em troca de proteção militar e uso do solo (embrião da servidão feudal). Ocorreu o êxodo urbano e a ruralização da Europa. No plano religioso, o Cristianismo, inicialmente perseguido pelo Estado imperial por recusar o culto divino ao imperador e pregar a igualdade espiritual, difundiu-se entre escravizados e mulheres. O imperador Constantino concedeu a liberdade de culto pelo Edito de Milão (313 d.C.), e Teodósio tornou o Cristianismo a religião oficial do Império pelo Edito de Tessalônica (380 d.C.). Em 395 d.C., o império foi cindido em Ocidente (Roma) e Oriente (Bizâncio). Em 476 d.C., os povos germânicos ('bárbaros') depuseram Rômulo Augústulo, marcando o fim do Império Romano do Ocidente e o início da Idade Média.", ["Crise do Século III: Fim das conquistas militares, escassez de cativos, inflação desenfreada e anarquia militar", "Sistema de Colonado: Transição para o campo onde o trabalhador torna-se colono preso à terra pela dívida de proteção", "Ruralização Econômica: Esvaziamento das cidades romanas e fortalecimento das vilas agrárias autossuficientes", "Edito de Milão (313) e Edito de Tessalônica (380): De religião ilegal e martirizada a religião oficial exclusiva do Império", "476 d.C.: Queda de Roma diante dos hérulos de Odoacro, marco tradicional da passagem para a Idade Média"], "O colonado romano é a ponte de transição entre a escravidão clássica e a servidão feudal da Idade Média: com a moeda e o Estado falidos, a segurança e o sustento transferiram-se para as grandes fazendas muradas dos senhores locais.", "Trecho do Edito de Milão, promulgado conjuntamente pelos imperadores Constantino e Licínio (313 d.C.):\n\n'Havendo nós nos reunido alegremente em Milão, julgamos nosso dever resolver primeiramente aquilo que diz respeito ao respeito devido à Divindade: que concedêssemos tanto aos cristãos como a todos os outros a faculdade livre de professarem a religião que quisessem, a fim de que tudo quanto existe de Divino nos seja propício a nós e aos nossos governados.'\n\n(Fonte: Lactâncio, De Mortibus Persecutorum, Século IV).", "O Edito de Milão de 313 d.C. representou uma transformação fundamental na política imperial romana em relação ao cristianismo ao:", ["ordenar o encarceramento compulsório de todos os bispos católicos nas prisões subterrâneas do Coliseu.", "proibir a circulação de cópias dos textos sagrados dos evangelhos em todo o território imperial.", "obrigar os cidadãos romanos a adorarem a imagem de Constantino como divindade celestial suprema.", "conceder tolerância e liberdade irrestrita de culto aos cristãos, cessando as perseguições oficiais do Estado.", "determinar a destruição de todas as basílicas e a confiscação dos bens das igrejas pelo fisco imperial."], 3, "Passo a passo:\n1. Fonte e contexto: O Edito de 313 d.C. marca o fim da era das catacumbas e do martírio dos cristãos no Império Romano.\n2. Raciocínio: Diante da perda de coesão interna do Império, Constantino percebeu que a Igreja cristã havia se tornado a força moral mais coesa da sociedade e concedeu liberdade religiosa para estabilizar a governabilidade (Gabarito D).\n3. Distratores: A, B, D e E descrevem medidas de perseguição anteriores promovidas por imperadores como Nero e Diocleciano, superadas pelo Edito de Milão."], "Renascimento Cultural e Humanismo": ["O Renascimento Cultural (séculos XIV a XVI), originado nas cidades mercantis da Península Itálica (Florença, Veneza e Roma), marcou uma profunda renovação artística, filosófica e científica no início da Idade Moderna. O movimento apoiou-se no Mecenato: o patrocínio financeiro concedido por ricos mercadores burgueses, nobres e papas a artistas como Leonardo da Vinci, Michelangelo e Rafael. Seus princípios basilares foram o Humanismo (resgate do pensamento clássico greco-romano), o Antropocentrismo (o homem e sua razão no centro das reflexões, superando o teocentrismo medieval), o Racionalismo, o Individualismo e o Naturalismo (busca da perfeição na representação anatômica com o domínio da perspectiva linear e da luz e sombra). Na literatura, destacaram-se Maquiavel, Dante, Camões e Shakespeare. Na ciência, a Revolução Científica de Copérnico e Galileu desafiou o geocentrismo com a teoria heliocêntrica.", ["Antropocentrismo e Humanismo: Valorização da dignidade, razão e capacidades do ser humano", "Mecenato: Proteção e financiamento das artes e ciências por burgueses (ex.: Médici) e pela Igreja", "Perspectiva Linear e Anatomia: Inovações técnicas que conferiram tridimensionalidade e realismo às telas e esculturas", "Península Itálica como Berço: Localização geográfica privilegiada no comércio marítimo do Mediterrâneo e herança clássica romana", "Heliocentrismo: Ruptura com o geocentrismo ptolomaico da Igreja medieval defendida por Copérnico e Galileu"], "O Renascimento não foi ateu: a esmagadora maioria dos artistas e pensadores era profundamente cristã, e as obras mais famosas retratavam cenas bíblicas (como a Capela Sistina e a Última Ceia), porém representadas com traços humanos realistas e emoções terrenas.", "Trecho da oração 'Sobre a Dignidade do Homem', do filósofo humanista Pico della Mirandola (1486):\n\n'Coloquei-te no meio do mundo — disse o Criador a Adão — para que daí possas olhar melhor ao teu redor e ver tudo o que existe. Não te fizemos celeste nem terreno, nem mortal nem imortal, para que, como livre e soberano escultor de ti mesmo, possas moldar a tua própria forma segundo a tua vontade.'\n\n(Fonte: Giovanni Pico della Mirandola, De Hominis Dignitate, 1486).", "O texto de Pico della Mirandola sintetiza o espírito do Humanismo renascentista ao defender que:", ["a vida terrena do ser humano deve ser inteiramente determinada pelo destino inflexível e pelo fatalismo astrológico.", "as obras clássicas da Antiguidade greco-romana devem ser queimadas por constituírem heresias pagãs.", "a razão e a ciência são instrumentos perigosos que devem ser subordinados aos dogmas do clero medieval.", "a salvação individual depende unicamente da doação de todas as riquezas materiais para a cúria romana.", "o ser humano é um agente livre, dotado de razão e capacidade para transformar a si mesmo e moldar o mundo."], 4, "Passo a passo:\n1. Fonte e contexto: O manifesto de Pico della Mirandola em 1486 é considerado a certidão filosófica do Humanismo renascentista.\n2. Raciocínio: O autor rompe com a ideia medieval de passividade humana perante Deus, celebrando o livre-arbítrio, a autonomia racional e a dignidade criadora do homem (Gabarito E).\n3. Distratores: A e D expressam o determinismo teocêntrico medieval; C e E atacam a Antiguidade e a erudição que os humanistas justamente resgataram."], "Grandes Navegações e Expansão Marítima": ["A Expansão Marítimo-Comercial dos séculos XV e XVI rompeu com o confinamento europeu e integrou os oceanos à economia-mundo. A tomada de Constantinopla pelos turco-otomanos em 1453 bloqueou as tradicionais rotas terrestres das especiarias asiáticas (cravo, canela, noz-moscada, pimenta) monopolizadas pelos comerciantes de Gênova e Veneza, impondo a necessidade de achar uma rota marítima para as Índias. Portugal foi o pioneiro absoluto pelas seguintes razões: precoce centralização monárquica (Revolução de Avis em 1385), aliança entre Coroa e burguesia comercial, posição geográfica privilegiada voltada para o Atlântico, paz interna e desenvolvimento de tecnologias náuticas (astrolábio, bússola, caravelas e a Escola de Sagres). O périplo africano português culminou no contorno do Cabo da Boa Esperança por Bartolomeu Dias (1488) e na chegada de Vasco da Gama a Calicute (1498). A Espanha financiou Cristóvão Colombo, que chegou à América em 1492. Em 1494, o Tratado de Tordesilhas dividiu o Novo Mundo entre Portugal e Espanha.", ["Pioneirismo Lusitano: Precoce unificação política (Avis), burguesia ativa, posição costeira e estudos náuticos", "Périplo Africano: Rota portuguesa contornando o litoral da África para atingir as Índias orientais", "1492: Cristóvão Colombo atinge as Antilhas a serviço da Coroa espanhola de Castela e Aragão", "Tratado de Tordesilhas (1494): Partilha do Atlântico a 370 léguas a oeste de Cabo Verde, mediada pelo Papa", "Mundialização do Comércio: Deslocamento do eixo econômico do Mar Mediterrâneo para o Oceano Atlântico"], "O pioneirismo português não foi fruto de milagre ou da bravura isolada de navegantes: decorreu da precoce centralização do Estado moderno com a Revolução de Avis (1385), que permitiu mobilizar recursos fiscais e apoio burguês para grandes frotas oceânicas.", "Trecho da Carta de Pero Vaz de Caminha ao Rei D. Manuel I de Portugal (1º de maio de 1500):\n\n'Eles não lavram, nem criam. Nem há aqui boi ou vaca, nem cabra, nem ovelha, nem galinha, nem outra qualquer alimária, que acostumada seja ao viver dos homens. E não comem senão deste inhame, que aqui há muito, e daquelas sementes e frutos, que a terra e as árvores de si deitam. E com isto andam tais e tão rijos e tão nédios, que o não somos nós tanto, com quanto trigo e legumes comemos.'\n\n(Fonte: Carta de Pero Vaz de Caminha, Arquivo Nacional da Torre do Tombo).", "A observação de Caminha sobre os povos indígenas encontrados no litoral brasileiro em 1500 expressa:", ["o olhar etnocêntrico europeu que avaliava os modos de vida dos povos originários a partir de seus próprios parâmetros culturais.", "o reconhecimento da superioridade das técnicas industriais europeias de cultivo de trigo e criação de gado.", "a certeza inabalável de que a terra continha jazidas infinitas de prata refinada prontas para embarque imediato.", "o desinteresse completo da Coroa portuguesa em estabelecer feitorias comerciais ou posse territorial no continente.", "a recomendação expressa de que os marinheiros portugueses deveriam adotar imediatamente a religião e a língua dos tupis."], 0, "Passo a passo:\n1. Fonte e contexto: A Carta de Caminha é o documento inaugural do olhar do colonizador português sobre a terra de Santa Cruz.\n2. Raciocínio: Ao comparar o vigor físico dos nativos com os hábitos alimentares europeus ('não criam boi, mas são rijos'), o escrivão revela o etnocentrismo característico da época, comparando o outro sempre a partir do espelho da Europa (Gabarito A).\n3. Distratores: A e C são contrariadas pelo texto (Caminha elogia o vigor físico indígena e não achou ouro de início); D e E contrariam os propósitos da colonização mercantil e da catequese cristã."], "Reforma Protestante e Ruptura Cristã": ["No século XVI, a Igreja Católica monopolizava a fé na Europa ocidental, mas sofria com desvios morais e corrupção: a simonia (venda de cargos eclesiásticos e falsas relíquias sagradas) e a venda de indulgências (perdão papal dos pecados em troca de pagamento em dinheiro para financiar a Basílica de São Pedro). Em 31 de outubro de 1517, o monge agostiniano Martinho Lutero afixou as 95 Teses na porta da igreja de Wittenberg, na Alemanha, dando início à Reforma Protestante. Apoiado pela nobreza feudal alemã (que cobiçava as vastas terras da Igreja), Lutero formulou os pilares luteranos: justificação unicamente pela fé ('Sola Fide'), livre interpretação da Bíblia traduzida para os idiomas nacionais ('Sola Scriptura') e a abolição da autoridade papal e do celibato clerical. Na Suíça, João Calvino expandiu a Reforma com a Teoria da Predestinação Absoluta (Deus já escolheu quem será salvo) e a valorização do trabalho e do lucro honesto como sinais divinos de bênção (o que atraiu a burguesia, tese analisada por Max Weber). Na Inglaterra, o rei Henrique VIII rompeu com o Papa pelo Ato de Supremacia (1534), fundando a Igreja Anglicana para consolidar o poder da monarquia absoluta.", ["1517: Martinho Lutero e as 95 Teses condenando o comércio imoral de indulgências", "Doutrina Luterana: Salvação unicamente pela fé, sacerdócio universal dos fiéis e dois sacramentos (Batismo e Eucaristia)", "Calvinismo e Predestinação: O trabalho árduo, a disciplina e a prosperidade material vistos como sinais da graça divina", "Anglicanismo (1534): Criação de uma igreja nacional inglesa chefiada pelo próprio rei Henrique VIII", "Max Weber: Obra 'A Ética Protestante e o Espírito do Capitalismo' relacionando a moral calvinista ao dinamismo burguês"], "Calvino e Lutero não eram a mesma coisa: Lutero pregava que a salvação vem pela fé e apoiava a nobreza agrária; Calvino pregava a predestinação e legitimava os lucros comerciais e financeiros, tornando-se a religião favorita da burguesia europeia.", "Tese 27 das 95 Teses de Martinho Lutero (1517):\n\n'Pregam doutrina puramente humana aqueles que dizem que, logo que a moeda tilinta na caixa do vendedor de bulas, a alma sai voando do purgatório. [...] O verdadeiro tesouro da Igreja é o santíssimo Evangelho da glória e da graça de Deus.'\n\n(Fonte: Martinho Lutero, 95 Teses, Wittenberg, 1517).", "A crítica expressa por Martinho Lutero na Tese 27 confrontava diretamente uma prática da Igreja Católica da época caracterizada pela:", ["distribuição gratuita de terras papais aos camponeses empobrecidos da Alemanha.", "comercialização indiscriminada de indulgências com a promessa de remissão das penas espirituais no além.", "obrigatoriedade de que todos os sacerdotes católicos renunciassem à autoridade do bispo de Roma.", "proibição do uso do latim nas celebrações litúrgicas e nas leituras das sagradas escrituras.", "defesa intransigente do dogma de que o trabalho manual fabril constituía uma ofensa aos mandamentos de Deus."], 1, "Passo a passo:\n1. Fonte e contexto: A tese 27 ataca frontalmente os pregadores dominicanos que vendiam indulgências papais nas praças da Alemanha.\n2. Raciocínio: Lutero denunciou a mercantilização da fé (onde a salvação da alma era trocada pelo som da moeda na caixa de esmolas), sustentando que somente a fé sincera e a graça divina salvam (Gabarito B).\n3. Distratores: A, C e D descrevem atos que a Igreja medieval condenava ou não praticava; E contraria a ética cristã tradicional do trabalho."], "Contrarreforma e Tribunal do Santo Ofício": ["A rápida difusão do protestantismo ameaçou a hegemonia espiritual e financeira de Roma, forçando a Igreja Católica a reagir com a Reforma Católica ou Contrarreforma. O Papa Paulo III convocou o Concílio de Trento (1545-1563), que reafirmou os dogmas tradicionais católicos: autoridade suprema do Papa, os sete sacramentos, a transubstanciação, o culto à Virgem Maria e aos santos, a validade das boas obras e a Vulgata em latim como única versão oficial da Bíblia. Para conter a heresia, foram reativados instrumentos de repressão e vigilância: o Tribunal do Santo Ofício da Inquisição (para julgar, torturar e queimar heréticos nos 'autos de fé') e o 'Index Librorum Prohibitorum' (lista de livros proibidos aos católicos, que censurou obras de Maquiavel, Copérnico e Descartes). Paralelamente, a fundação da Companhia de Jesus (1534) por Inácio de Loyola forneceu o braço militarizado da fé: os jesuítas ('soldados de Cristo') atuaram na catequese das populações indígenas na América e na Ásia, compensando os fiéis perdidos na Europa.", ["Concílio de Trento (1545-1563): Reafirmação doutrinária intransigente contra as teses protestantes", "Inquisição / Santo Ofício: Tribunal religioso encarregado de investigar heresias, judaizantes e bruxarias", "Index: Relação oficial de livros censurados e proibidos pela Igreja por conterem ensinamentos perigosos", "Companhia de Jesus (Jesuítas): Ordem missionária com estrutura militar e votos de obediência estrita ao Papa", "Missões e Reduções Indígenas: Aldeamentos jesuíticos voltados à catequização e ocidentalização dos povos nativos"], "O Barroco foi a estética oficial da Contrarreforma: as igrejas católicas encheram-se de ouro, esculturas dramáticas, contrastes de luz e sombra e santos em sofrimento para emocionar os fiéis e trazê-los de volta pela comoção dos sentidos, em oposição à austeridade dos templos protestantes despidos.", "Decreto do Concílio de Trento sobre a Invocação dos Santos e as Imagens Sagradas (1563):\n\n'Devem ter-se e conservar-se, principalmente nas igrejas, as imagens de Cristo, da Virgem Mãe de Deus e de outros santos, prestando-lhes a devida honra e veneração. Por meio das histórias dos mistérios da nossa redenção, expressas em pinturas e outras imitações, o povo é instruído e confirmado na recordação dos artigos de fé e comove-se a adorar a Deus e amar a piedade.'\n\n(Fonte: Cânones e Decretos do Concílio de Trento, Sessão XXV, 1563).", "A determinação emitida pelo Concílio de Trento em 1563 sobre a veneração das imagens sagradas tinha como propósito no contexto da Contrarreforma:", ["concordar com a iconoclastia protestante e proibir qualquer representação pictórica nos templos católicos.", "decretar a dissolução imediata da Companhia de Jesus e o fim de todas as missões evangelizadoras no Novo Mundo.", "reafirmar a liturgia tradicional e utilizar a arte visual barroca como instrumento pedagógico e emocional de conversão dos fiéis.", "permitir a livre interpretação individual dos textos sagrados sem qualquer mediação da hierarquia sacerdotal.", "extinguir o Tribunal do Santo Ofício da Inquisição para promover a tolerância com os hereges luteranos."], 2, "Passo a passo:\n1. Fonte e contexto: O Concílio de Trento respondeu à destruição de estátuas e imagens promovida por calvinistas (iconoclastia).\n2. Raciocínio: A Igreja Católica defendeu com vigor o uso didático e emocional das imagens e da arte como canal para ensinar a doutrina à massa analfabeta e despertar a devoção e fidelidade a Roma (Gabarito C).\n3. Distratores: A diz o exato oposto; C e E contrariam o fortalecimento dos jesuítas e da Inquisição; D é o princípio protestante da 'Sola Scriptura' rejeitado por Trento."], "Absolutismo Monárquico e Teóricos do Poder": ["O Absolutismo Monárquico foi a forma de organização política predominante na Europa ocidental entre os séculos XVI e XVIII, marcada pela máxima concentração de poderes nas mãos do rei (que controlava o exército permanente, as leis, a tributação e a justiça). O modelo clássico consolidou-se na França dos Bourbons, atingindo o apogeu com Luís XIV, o 'Rei Sol', a quem se atribui a célebre frase 'O Estado sou eu' (L'État, c'est moi) e que manteve a nobreza domesticada e submissa no Palácio de Versalhes. O absolutismo foi legitimado por importantes teóricos políticos: Nicolau Maquiavel ('O Príncipe', separando a política da moral religiosa e afirmando que os fins justificam os meios); Thomas Hobbes ('Leviatã', sustentando que, no estado de natureza sem leis, o homem é o lobo do homem e necessita de um Estado forte para evitar a guerra de todos contra todos); Jacques Bossuet ('A Política tirada da Sagrada Escritura', formulando a Teoria do Direito Divino dos Reis); e Jean Bodin (conceito de soberania absoluta e perpétua).", ["Luís XIV: O 'Rei Sol', símbolo máximo do absolutismo com o luxo faustoso do Palácio de Versalhes", "Thomas Hobbes (Leviatã): Contratualismo absolutista para conter o caos do estado de natureza ('guerra de todos contra todos')", "Jacques Bossuet: Teoria do Direito Divino dos Reis (rebelar-se contra o monarca é cometer sacrilégio contra Deus)", "Nicolau Maquiavel: Autonomia da política ('O Príncipe') e a dialética entre a 'Virtù' (habilidade) e a 'Fortuna' (sorte/ocasião)", "Equilíbrio de Classes: O rei apoiava-se na burguesia (para recursos financeiros) e sustentava a nobreza parasitária (com isenções e cargos)"], "O poder absolutista não era infinito ou sem limites legais: o soberano respeitava os costumes tradicionais, as leis fundamentais do reino e as leis divinas; 'absoluto' significava que ele não estava sujeito a prestação de contas aos súditos nem a controle parlamentar.", "Trecho da obra 'A Política Segundo a Sagrada Escritura', do bispo Jacques Bossuet (século XVII):\n\n'O trono real não é o trono de um homem, mas o trono do próprio Deus. Os reis são como deuses e participam de algum modo da independência divina. Aquele que desobedece a seu rei desobedece a Deus e comete um sacrilégio imperdoável perante os homens e os céus.'\n\n(Fonte: Jacques Bossuet, Politique tirée des propres paroles de l'Écriture Sainte).", "A teoria política formulada por Jacques Bossuet no século XVII legitimava o Absolutismo Monárquico com base:", ["na soberania popular manifestada em eleições regulares por escrutínio universal secreto.", "na teoria da tripartição dos poderes concebida para evitar abusos por meio de freios e contrapesos.", "na defesa irrestrita da laicidade estatal e na expulsão de todos os sacerdotes das cortes régias.", "no princípio do Direito Divino dos Reis, considerando a autoridade do monarca sagrada e inquestionável.", "no anarquismo comunal que pregava a extinção imediata de toda forma de autoridade governamental."], 3, "Passo a passo:\n1. Fonte e contexto: Bossuet foi o preceptor do delfim da França e o maior formulador do absolutismo teológico no reinado de Luís XIV.\n2. Raciocínio: Para Bossuet, o poder do rei vem diretamente de Deus; portanto, qualquer oposição ou revolta dos súditos contra o monarca constitui pecado mortal e sacrilégio contra a própria divindade (Gabarito D).\n3. Distratores: A e B pertencem ao pensamento iluminista e republicano; D e E contrariam a aliança íntima entre trono absolutista e Igreja católica."], "Mercantilismo e Práticas Coloniais": ["O Mercantilismo foi o conjunto de práticas e ideias econômicas adotadas pelas monarquias absolutistas europeias entre os séculos XV e XVIII, voltadas ao fortalecimento financeiro do Estado e à acumulação de riquezas pela Coroa. Seus pilares centrais eram: o Metalismo ou Bulionismo (a riqueza de uma nação era medida pelo volume de metais preciosos — ouro e prata — estocados no tesouro); a Balança Comercial Favorável (exportar sempre mais mercadorias do que importar); o Protecionismo Alfandegário (cobrança de altos impostos sobre produtos estrangeiros concorrentes); o Incentivo às Manufaturas Nacionais e frotas navais; e o Colonialismo fundamentado no 'Pacto Colonial' (Exclusivo Metropolitano). No sistema do Pacto Colonial, as colônias existiam exclusivamente para enriquecer a metrópole: eram fornecedoras obrigatórias de matérias-primas e produtos tropicais a preços vis e compradoras forçadas de produtos manufaturados metropolitanos a preços inflacionados.", ["Metalismo / Bulionismo: Crença de que o estoque de ouro e prata determinava o poderio de um Estado (muito forte na Espanha)", "Balança Comercial Favorável: Superávit comercial indispensável para reter moedas dentro do reino", "Protecionismo Alfandegário: Barreiras tarifárias contra artigos manufaturados de países rivais", "Colbertismo: Vertente francesa do mercantilismo focada na produção de artigos de luxo para a nobreza europeia", "Pacto Colonial (Exclusivo Metropolitano): Monopólio régio que proibia a colônia de comerciar com outras nações ou abrir fábricas"], "O Pacto Colonial funcionava como uma camisa de força para o desenvolvimento da colônia: o Alvará de D. Maria I de 1785, por exemplo, proibiu expressamente a existência de qualquer tecelagem ou fábrica no Brasil colonial para evitar a concorrência com as manufaturas portuguesas.", "Alvará de D. Maria I de Portugal (5 de janeiro de 1785):\n\n'Eu, a Rainha, faço saber aos que este meu alvará virem: que sendo-me presente o grande número de fábricas e manufaturas que nestes últimos anos se têm estabelecido em diferentes capitanias do Brasil, com grave prejuízo da cultura da terra e dos meus interesses fiscais: Hei por bem ordenar que todas as fábricas, teares ou manufaturas de tecidos de algodão, lã ou seda existentes no Brasil sejam extintas e demolidas.'\n\n(Fonte: Coleção de Leis Portuguesas, 1785).", "A determinação régia outorgada pelo Alvará de 1785 expressava o funcionamento clássico do Mercantilismo e do Pacto Colonial ao:", ["incentivar a industrialização precoce e a autonomia econômica das províncias da América portuguesa.", "conceder empréstimos bancários da Coroa para financiar o maquinário têxtil dos pequenos agricultores brasileiros.", "declarar o livre comércio irrestrito entre os portos brasileiros e as marinhas mercantes de França e Holanda.", "substituir a exploração agrícola de exportação pelo cultivo de subsistência comunitária indígena.", "bloquear a concorrência produtiva local e preservar o mercado consumidor colonial cativo para as manufaturas metropolitanas."], 4, "Passo a passo:\n1. Fonte e contexto: D. Maria I manda destruir todos os teares e fábricas estabelecidas na colônia brasileira em 1785.\n2. Raciocínio: O Pacto Colonial ditava que a colônia não podia ter manufaturas próprias, devendo permanecer como mera exportadora primária e consumidora forçada dos produtos acabados vendidos pela metrópole portuguesa (Gabarito E).\n3. Distratores: A e C dizem o oposto da demolição de teares; D ignora o exclusivo metropolitano; E contraria a primazia da plantation de exportação."], "Campanha das Diretas Já e Transição Política": ["Entre 1983 e 1984, o Brasil foi varrido pela maior mobilização popular de massas de sua história: a Campanha das 'Diretas Já'. Diante da inflação descontrolada, do endividamento da ditadura militar e do desejo de liberdade cívica, milhões de pessoas vestiram verde e amarelo e ocuparam as ruas em comícios gigantescos (como no Vale do Anhangabaú e na Candelária), liderados por Ulysses Guimarães, Tancredo Neves, Leonel Brizola, Lula e artistas populares. A campanha apoiava a aprovação da Emenda Constitucional Dante de Oliveira, que restabelecia as eleições diretas para a Presidência da República. Contudo, em 25 de abril de 1984, manobras governistas impediram que a emenda alcançasse os dois terços dos votos necessários na Câmara dos Deputados. A oposição foi forçada a disputar a transição pela via indireta no Colégio Eleitoral em janeiro de 1985: a chapa da Aliança Democrática (Tancredo Neves e José Sarney) derrotou Paulo Maluf, encerrando 21 anos de ditadura militar. Porém, na véspera da posse, Tancredo adoeceu gravemente e faleceu, assumindo o vice José Sarney.", ["Emenda Dante de Oliveira: Proposta legislativa de restabelecimento imediato de eleições diretas para presidente", "Comícios das Diretas Já (1984): Milhões nas ruas em praça pública exigindo o voto direto democrático", "Derrota da Emenda no Congresso: Faltaram 22 votos pela ausência de parlamentares ligados ao regime militar", "Colégio Eleitoral (1985): Vitória indireta de Tancredo Neves contra Paulo Maluf marcando o fim do ciclo militar", "Posse de José Sarney: Transição civil pactuada e com forte presença de quadros conservadores egressos do PDS"], "A Nova República não nasceu de uma ruptura revolucionária, mas de uma transição negociada e tutelada: Tancredo compôs com a dissidência civil da ditadura (Frente Liberal / PFL) e teve como vice José Sarney, antigo presidente do partido de sustentação militar (ARENA/PDS).", "Discurso de Ulysses Guimarães no Comício da Candelária (Rio de Janeiro, abril de 1984):\n\n'Só o povo é soberano. Não admitimos que um punhado de delegados reunidos em um Colégio Eleitoral espúrio escolha o Presidente da República em nome de 130 milhões de brasileiros. Queremos votar! Diretas Já é o grito de liberdade de uma Nação que não aceita mais a tutela das baionetas!'\n\n(Fonte: Discursos Parlamentares de Ulysses Guimarães, Câmara dos Deputados).", "A despeito de sua imensa mobilização cívica popular, a Campanha das Diretas Já em 1984 teve como desfecho institucional imediato:", ["a rejeição da emenda no Parlamento e a realização da sucessão presidencial por meio do voto indireto no Colégio Eleitoral.", "a aprovação unânime da Emenda Dante de Oliveira e a convocação de eleições presidenciais diretas no mesmo ano.", "a restauração imediata do regime de Atos Institucionais com a prorrogação da ditadura por mais vinte anos.", "a tomada armada do poder federal pelos sindicatos operários do ABC paulista.", "o cancelamento definitivo da transição democrática e a dissolução de todos os partidos de oposição."], 0, "Passo a passo:\n1. Fonte e contexto: O discurso de Ulysses Guimarães exprime a indignação cívica perante a tutela militar das eleições indiretas.\n2. Raciocínio: A emenda não alcançou o quórum de dois terços na votação da Câmara em abril de 1984; assim, a eleição de 1985 deu-se indiretamente no Colégio Eleitoral, consagrando Tancredo Neves (Gabarito A).\n3. Distratores: A é falsa (a emenda foi rejeitada); B e E são incorretas, pois os militares aceitaram a derrota no Colégio Eleitoral; D inventa uma insurreição armada que nunca ocorreu."], "Constituição Cidadã de 1988": ["Instalada em 1987 e promulgada solenemente em 5 de outubro de 1988 sob a presidência do deputado Ulysses Guimarães ('o Senhor Diretas'), a atual Constituição da República Federativa do Brasil ficou consagrada na história como a 'Constituição Cidadã'. Foi o texto mais democrático e participativo da história nacional, recebendo milhões de assinaturas e centenas de emendas populares de movimentos sociais, indígenas, mulheres e trabalhadores. A Carta de 1988 redefiniu o Estado brasileiro: instituiu o Estado Democrático de Direito fundamentado na dignidade da pessoa humana; expandiu os direitos civis e políticos (eleições diretas em dois turnos, voto facultativo para jovens de 16 e 17 anos e analfabetos); criminalizou o racismo e a tortura como crimes inafiançáveis; garantiu a liberdade de expressão proibindo a censura; e consagrou os direitos sociais no artigo 6º (saúde universal com a criação do SUS, educação pública, previdência e seguridade social). Além disso, reconheceu no artigo 231 os direitos originários dos povos indígenas sobre suas terras ancestrais.", ["5 de outubro de 1988: Promulgação solene da Constituição Cidadã por Ulysses Guimarães", "Artigo 5º: Rol amplo de direitos e garantias individuais inalienáveis e remédios constitucionais (habeas corpus, mandado de segurança)", "Criação do SUS (Sistema Único de Saúde): Princípios de universalidade, integralidade e gratuidade no atendimento", "Voto do Jovem e do Analfabeto: Ampliação democrática do colégio eleitoral com o voto aos 16 anos e aos analfabetos", "Direitos Indígenas e Ambientais: Capítulos específicos dedicados à proteção ecológica e à demarcação de terras ancestrais"], "A Carta de 1988 é chamada de 'Constituição Cidadã' porque colocou os direitos humanos e a cidadania social no centro do ordenamento jurídico, rompendo em definitivo com o entulho autoritário e corporativo da ditadura militar.", "Discurso de Ulysses Guimarães na sessão solene de promulgação da Constituição (5 de outubro de 1988):\n\n'Traidor da pátria é o traidor da Constituição. Conhecemos o caminho do calvário. Caminhamos cerca de um quarto de século para chegar a este dia. A Nação mudou. A Constituição mudou. A sociedade foi Rubens Paiva, não os que o mataram. Tenho ódio e nojo à ditadura. Amaldiçoamos a tirania onde quer que ela desgrace homens e nações. Viva a Constituição de 1988! Viva a democracia!'\n\n(Fonte: Anais da Assembleia Nacional Constituinte, Brasília, 1988).", "A promulgação da Constituição de 1988 representou uma conquista histórica para a sociedade brasileira ao:", ["restringir o acesso aos serviços de saúde pública exclusivamente aos cidadãos detentores de carteira de trabalho assinada.", "consolidar o Estado Democrático de Direito, universalizar o sufrágio eleitoral e assegurar garantias sociais e direitos fundamentais.", "restabelecer a censura prévia sobre produções jornalísticas e espetáculos teatrais com temática política.", "conceder poder de veto absoluto aos comandantes militares sobre as decisões do Supremo Tribunal Federal.", "eliminar o direito de greve e proibir a atuação de entidades sindicais independentes no país."], 1, "Passo a passo:\n1. Fonte e contexto: O discurso de Ulysses Guimarães imortalizou a repulsa à ditadura e a exaltação da liberdade na promulgação da Carta de 1988.\n2. Raciocínio: A Constituição de 1988 fundou a moderna democracia brasileira, ampliando os direitos fundamentais, criando a seguridade social universal (SUS) e protegendo a dignidade cidadã (Gabarito B).\n3. Distratores: A descreve o modelo anterior (INAMPS); B, D e E apontam práticas autoritárias da ditadura que a Constituição de 1988 baniu formalmente."], "Governo Collor e o Impeachment de 1992": ["A eleição presidencial de 1989 foi a primeira eleição direta para presidente após quase trinta anos. Fernando Collor de Mello venceu Luiz Inácio Lula da Silva no segundo turno apresentando-se como o jovem e modernizador 'Caçador de Marajás', paladino da moralidade pública contra a corrupção. Ao assumir em março de 1990 com a hiperinflação batendo 80% ao mês, Collor lançou o dramático 'Plano Brasil Novo' (Plano Collor I): confiscou por 18 meses cerca de 80% da liquidez financeira nacional (contas-correntes e poupanças da população), congelou preços e iniciou a agenda neoliberal no país (abertura comercial para importações e privatizações de estatais como a Usiminas). O choque gerou recessão e revolta pública. Em 1992, seu irmão Pedro Collor denunciou em entrevista à revista Veja um colossal esquema de corrupção e propinas comandado pelo tesoureiro de campanha Paulo César Farias (esquema PC Farias). A sociedade mobilizou-se: a juventude dos 'Caras-Pintadas' foi às ruas e o Congresso aprovou o impeachment de Collor em 29 de setembro de 1992, assumindo o vice Itamar Franco.", ["1989: Primeira eleição direta pós-ditadura consagrando Fernando Collor de Mello", "Plano Collor (1990): Confisco drástico das cadernetas de poupança e choque neoliberal de abertura aos importados", "Início do Neoliberalismo: Privatizações de empresas públicas e enxugamento da máquina administrativa estatal", "Caras-Pintadas: Estudantes secundaristas e universitários que marcharam de luto e com rostos pintados exigindo a saída do presidente", "29 de setembro de 1992: Votação histórica na Câmara dos Deputados autorizando a abertura do processo de impeachment"], "O impeachment de Collor demonstrou a maturidade das instituições democráticas recém-criadas pela Constituição de 1988: o presidente foi afastado respeitando rigorosamente os trâmites do devido processo legal e sob pressão popular pacífica.", "Editorial do jornal 'O Globo' sobre o protesto dos Caras-Pintadas (agosto de 1992):\n\n'Milhares de estudantes com os rostos pintados de verde e amarelo ocuparam a Avenida Rio Branco em silêncio e ordem. A convocação do presidente para que o povo saísse de verde e amarelo para apoiá-lo surtiu o efeito oposto: as cores nacionais foram empunhadas como símbolo da repulsa moral à corrupção e do clamor pelo impeachment de Collor.'\n\n(Fonte: O Globo, edição de 17 de agosto de 1992).", "O processo de impeachment do presidente Fernando Collor de Mello em 1992 destacou-se politicamente por:", ["decorrer de uma intervenção militar que dissolveu o Congresso Nacional e anulou a Constituição de 1988.", "impedir a posse do vice-presidente Itamar Franco por meio de uma revolução socialista armada.", "resultar de uma intensa mobilização da sociedade civil e dos jovens Caras-Pintadas aliada ao funcionamento regular das instituições democráticas.", "revelar a incapacidade do Poder Judiciário e do Poder Legislativo em fiscalizar atos de corrupção no Executivo.", "ter sido provocado pela exigência internacional do FMI para restabelecer a monarquia no território brasileiro."], 2, "Passo a passo:\n1. Fonte e contexto: O editorial registra a reação patriótica e pacífica dos jovens estudantes contra as denúncias de corrupção do governo Collor.\n2. Raciocínio: O impeachment de 1992 foi um marco de consolidação democrática: sem intervenção dos quartéis e mediante o rito constitucional, o clamor das ruas culminou no afastamento do chefe de Estado (Gabarito C).\n3. Distratores: A é falsa (não houve golpe militar); C e E inventam absurdos históricos; D contraria a atuação exemplar das CPIs parlamentares."], "Plano Real e Estabilização Econômica": ["A hiperinflação crônica corroeu o poder de compra da classe trabalhadora brasileira por mais de uma década, chegando a superar 2.400% ao ano em 1993 e frustrando planos sucessivos (Cruzado, Bresser, Verão e Collor). Sob a presidência de Itamar Franco, o ministro da Fazenda Fernando Henrique Cardoso (FHC) reuniu uma equipe de economistas da PUC-Rio (como Pérsio Arida, André Lara Resende, Gustavo Franco e Pedro Malan) para arquitetar o 'Plano Real' em 1994. O plano operou em três fases estratégicas: (1) ajuste fiscal prévio com o Fundo Social de Emergência; (2) introdução da Unidade Real de Valor (URV), uma moeda virtual de transição que desindexou a economia alinhando todos os preços; e (3) o lançamento do Real (R$) em 1º de julho de 1994, com paridade cambial com o dólar e juros astronômicos. O sucesso estrondoso no controle inflacionário alçou FHC à vitória presidencial em 1994 e 1998, aprofundando as reformas de abertura econômica, privatizações (Vale, Telebrás) e a aprovação da Emenda da Reeleição (1997).", ["Hiperinflação: O 'dragão da inflação' que corroía o salário e impedia o planejamento econômico das famílias", "URV (Unidade Real de Valor): Moeda de transição genial que quebrou a memória inflacionária sem congelamento de preços", "1º de Julho de 1994: Entrada em circulação da nova moeda nacional: o Real (R$)", "Governo FHC (1995-2002): Privatizações em massa, desregulamentação, Lei de Responsabilidade Fiscal e estabilidade monetária", "Custo social: Desemprego elevado, juros estratosféricos e vulnerabilidade externa diante das crises asiática e russa"], "Atenção para o diferencial do Plano Real: Ele não recorreu a congelamento artificial de preços ou confisco autoritário de contas (como os planos anteriores); utilizou a URV como indexador transitório para sincronizar a economia de forma voluntária e transparente.", "Gráfico didático sobre a inflação anual no Brasil (IPCA, 1993-1996):\n\n• 1993: 2.477% ao ano\n• 1994: 916% ao ano (queda vertiginosa após julho)\n• 1995: 22% ao ano\n• 1996: 9,5% ao ano\n\n(Fonte: Séries Históricas do IBGE / Banco Central do Brasil).", "A implementação bem-sucedida do Plano Real a partir de julho de 1994 representou uma mudança profunda na vida cotidiana da população brasileira ao:", ["promover a desregulamentação total do comércio exterior com inflação acelerada acima de 5.000% ao ano.", "eliminar o uso de papel-moeda em todo o território nacional para instituir o escambo direto de mercadorias.", "determinar o confisco permanente de todas as cadernetas de poupança privadas mantidas em agências bancárias.", "estabilizar os preços das mercadorias, debelar a hiperinflação crônica e recuperar o poder de compra imediato da renda familiar.", "impor o controle estatal de preços nas prateleiras dos supermercados com auxílio de fiscais voluntários armados."], 3, "Passo a passo:\n1. Fonte e contexto: Os dados estatísticos do IBGE mostram o desmoronamento espetacular da inflação de milhares de porcentos para menos de 10% anuais.\n2. Raciocínio: Ao acabar com a hiperinflação, o Plano Real deu segurança monetária ao povo brasileiro, especialmente aos mais pobres que não tinham como se proteger financeiramente da corrosão diária dos preços (Gabarito D).\n3. Distratores: A e D descrevem a hiperinflação e o confisco do Plano Collor; B e E descrevem o Plano Cruzado de 1986 ('fiscais do Sarney')."], "Governos dos Anos 2000 e Políticas Sociais": ["A eleição de Luiz Inácio Lula da Silva em 2002 marcou a chegada de um líder operário à Presidência da República. Seus mandatos (2003-2010) beneficiaram-se do superciclo internacional das commodities (soja, minério de ferro e petróleo impulsionados pela urbanização da China), combinando disciplina macroeconômica com políticas de inclusão e transferência de renda. Criou-se o programa Bolsa Família (unificando programas anteriores sob condicionalidades escolares e de saúde) e instituiu-se a política de valorização real contínua do salário mínimo acima da inflação. Essa estratégia ampliou o mercado consumidor interno, retirando mais de trinta milhões de brasileiros da extrema pobreza e fomentando a ascensão da chamada 'nova classe média' (classe C). No ensino superior, expandiram-se o Prouni, o Fies e a criação de novas universidades federais e institutos técnicos federais (IFs). O país conquistou o grau de investimento e a autossuficiência temporária com a descoberta da camada do pré-sal em 2006. Em 2010, Dilma Rousseff foi eleita a primeira mulher presidente do Brasil.", ["Superciclo das Commodities: Demanda chinesa aquecida impulsionando o superávit das exportações agrícolas e minerais", "Bolsa Família: Programa de transferência condicionada de renda reconhecido globalmente pela redução da fome", "Valorização do Salário Mínimo: Crescimento real contínuo impulsionando o consumo e a previdência social", "Democratização do Ensino Superior: Criação do Prouni, expansão do Fies e ampliação das universidades federais", "Camada do Pré-Sal (2006): Grandes reservas petrolíferas submarinas e novo marco regulatório de partilha"], "O modelo dos governos do PT nos anos 2000 caracterizou-se pelo 'reformismo neodesenvolvimentista': promoveu expressiva redução da miséria e inclusão social pelo consumo e pelo crédito sem promover rupturas estruturais com o sistema financeiro ou realizar a reforma agrária clássica.", "Dados sobre o Índice de Gini de desigualdade de renda no Brasil (2002-2012):\n\n• 2002: 0,593 (alto índice de desigualdade)\n• 2006: 0,562\n• 2010: 0,538\n• 2012: 0,526 (queda contínua no índice)\n\n(Fonte: IPEA / Síntese de Indicadores Sociais do IBGE).", "A redução contínua do Índice de Gini verificada no Brasil na primeira década dos anos 2000 esteve diretamente associada a:", ["extinção das universidades públicas federais para financiar o agronegócio de exportação monocultor.", "congelamento dos salários da classe trabalhadora e corte integral de benefícios da previdência social.", "rompimento absoluto de todas as relações comerciais e financeiras entre o Brasil e os países emergentes.", "proibição legal de qualquer intervenção estatal na concessão de subsídios habitacionais ou educacionais.", "políticas estatais de transferência direta de renda, elevação real do salário mínimo e ampliação do crédito popular."], 4, "Passo a passo:\n1. Fonte e contexto: A redução no coeficiente de Gini (onde 0 é igualdade perfeita e 1 é concentração máxima) comprova a desconcentração progressiva de renda.\n2. Raciocínio: A conjugação entre expansão do Bolsa Família, aumentos reais do salário mínimo acima da inflação e geração de milhões de empregos formais gerou o maior ciclo de mobilidade social da história brasileira recente (Gabarito E).\n3. Distratores: B, C, D e E apontam retrocessos e medidas de austeridade contrárias às políticas públicas sociais implementadas no período."], "Movimentos Sociais e Desafios da Cidadania Atual": ["A sociedade brasileira contemporânea enfrenta desafios estruturais complexos que mobilizam múltiplos movimentos sociais. As 'Jornadas de Junho de 2013', iniciadas pelo Movimento Passe Livre (MPL) contra o aumento de R$ 0,20 nas passagens de ônibus, transbordaram em manifestações massivas e difusas em todo o país, canalizando insatisfações com os gastos da Copa do Mundo, a má qualidade do transporte e da saúde e a corrupção política. A crise política subsequente culminou no impeachment controverso de Dilma Rousseff em 2016, no teto de gastos públicos e em reformas trabalhista e previdenciária. No século XXI, os movimentos sociais diversificaram suas pautas: a luta pela terra do MST (Movimento dos Trabalhadores Rurais Sem Terra); a luta pela moradia urbana do MTST; o feminismo combatendo o feminicídio; a juventude negra denunciando o genocídio nas favelas e a violência policial; a defesa ambiental e dos direitos dos povos indígenas contra o marco temporal e o desmatamento ilegal na Amazônia; e a defesa da diversidade pela comunidade LGBTQIA+.", ["Jornadas de Junho de 2013: Onda de protestos de rua descentralizados que alterou a correlação política brasileira", "Luta pela Terra e Moradia: Atuação do MST e MTST cobrando a função social da propriedade privada (CF/1988)", "Violência e Desigualdade Racial: O assassinato de jovens negros como tema urgente dos direitos humanos no país", "Questão Ambiental e Marco Temporal: Conflitos fundiários em terras indígenas e emergência climática global", "Polarização Política e Redes Sociais: Desinformação, fake news e a defesa da estabilidade democrática contra ataques golpistas"], "O direito à manifestação pacífica e a liberdade de associação são garantias pétreas da Constituição de 1988: os movimentos sociais não são 'casos de polícia', mas motores indispensáveis para a ampliação contínua dos direitos de cidadania.", "Artigo 5º, inciso XVI da Constituição da República Federativa do Brasil (1988):\n\n'Todos podem reunir-se pacificamente, sem armas, em locais abertos ao público, independentemente de autorização, desde que não frustrem outra reunião anteriormente convocada para o mesmo local, sendo apenas exigido prévio aviso à autoridade competente.'\n\n(Fonte: Constituição Federal de 1988).", "A garantia constitucional do direito de reunião e protesto no Brasil contemporâneo assegura:", ["o livre exercício da manifestação pública e o protagonismo dos movimentos sociais na reivindicação e ampliação de direitos de cidadania.", "a legitimidade da intervenção das Forças Armadas para dissolver reuniões cívicas de partidos de oposição.", "a necessidade de aprovação censitária prévia pelo Ministério da Justiça para a realização de marchas sindicais.", "a proibição de que jovens estudantes ou minorias étnicas participem de debates nas ruas e universidades.", "a obrigatoriedade de que todos os protestos tenham finalidade estritamente comercial ou publicitária corporativa."], 0, "Passo a passo:\n1. Fonte e contexto: O inciso XVI do artigo 5º da CF/88 protege o direito democrático de reunião pacífica sem censura prévia.\n2. Raciocínio: A livre manifestação popular é o pulmão da democracia participativa, permitindo que a sociedade civil organizada pressione o Parlamento e o Executivo por justiça social, moradia, terra e direitos humanos (Gabarito A).\n3. Distratores: A, B, D e E trazem exigências autoritárias e restritivas que vigoravam na ditadura militar e que a Constituição de 1988 baniu terminantemente."], "Descolonização da Ásia e da África": ["O pós-Segunda Guerra Mundial assistiu ao esgotamento e desmantelamento dos impérios coloniais europeus na Ásia e na África. As potências colonizadoras (Reino Unido, França, Holanda, Bélgica e Portugal) estavam falidas econômica e militarmente pela guerra, enquanto milhares de soldados africanos e asiáticos haviam combatido em solo europeu e assimilado os discursos de liberdade e autodeterminação. A Conferência de Bandung (Indonésia, 1955) reuniu 29 líderes de nações do 'Terceiro Mundo', condenando o colonialismo, o racismo e afirmando o princípio da coexistência pacífica e do Não-Alinhamento automático a EUA ou URSS na Guerra Fria. Na Índia, Mahatma Gandhi liderou a independência (1947) por meio da desobediência civil e da não violência ('Satyagraha'). Em outras nações, a libertação deu-se por sangrentas guerras anticoloniais: na Argélia contra a França (1954-1962); e na África de colonização portuguesa (Angola, Moçambique e Guiné-Bissau), cujas lutas de libertação derrubaram a ditadura salazarista em Lisboa na Revolução dos Cravos (1974). Na África do Sul, a luta contra o regime racista do Apartheid culminou na eleição de Nelson Mandela em 1994.", ["Autodeterminação dos Povos: Princípio consagrado na Carta da ONU que respaldou as independências afro-asiáticas", "Conferência de Bandung (1955): Criação do Movimento dos Países Não Alinhados e condenação do neocolonialismo", "Mahatma Gandhi: Independência da Índia e da partição com o Paquistão usando resistência pacífica e boicotes", "Guerra de Libertação da Argélia: Violenta guerra de descolonização retratada no clássico 'A Batalha de Argel'", "Fim do Apartheid (1994): Libertação de Nelson Mandela e consolidação de uma África do Sul multirracial democrática"], "Atenção para as fronteiras artificiais da África: A saída dos colonizadores não apagou os traçados da Conferência de Berlim, resultando em guerras civis sangrentas fomentadas pela herança colonial de privilegiar uma etnia sobre a outra (como o terrível genocídio de Ruanda em 1994 entre tutsis e hutus).", "Comunicado Final da Conferência de Bandung (Indonésia, 1955):\n\n'O colonialismo, em todas as suas manifestações, é um mal ao qual se deve pôr fim rapidamente. A submissão dos povos ao jugo estrangeiro constitui uma negação dos direitos humanos fundamentais e é contrária à Carta das Nações Unidas e um obstáculo à paz e à cooperação internacionais.'\n\n(Fonte: Declaração Oficial da Conferência Afro-Asiática de Bandung, 1955).", "A Conferência de Bandung, realizada em 1955, representou um marco geopolítico fundamental do século XX ao:", ["reafirmar a legalidade do Tratado de Berlim e apoiar a continuidade da tutela militar europeia na África.", "articular a voz coletiva das nações recém-independentes em defesa da autodeterminação dos povos e da soberania anti-imperialista.", "exigir a adesão militar imediata e incondicional de todos os países periféricos ao Pacto de Varsóvia soviético.", "declarar a obrigatoriedade da segregação racial do Apartheid como modelo político em todos os continentes.", "rejeitar qualquer tipo de cooperação econômica e diplomática entre as nações do chamado Terceiro Mundo."], 1, "Passo a passo:\n1. Fonte e contexto: A reunião de Bandung em 1955 foi a certidão de nascimento do Terceiro Mundo e do Não-Alinhamento.\n2. Raciocínio: Os povos libertos da Ásia e da África uniram-se para repudiar a dominação colonial e a corrida armamentista das superpotências, exigindo respeito à soberania nacional e desenvolvimento autônomo (Gabarito B).\n3. Distratores: A, C, D e E contradizem os princípios expressos no texto de Bandung (que combateu a tutela colonial, o Apartheid e o alinhamento cego na Guerra Fria)."], "Conflitos Árabe-Israelenses e o Oriente Médio": ["A geopolítica do Oriente Médio no século XX foi conflagrada pela criação do Estado de Israel e a disputa territorial com o povo palestino. Em 1947, a Assembleia Geral da ONU, presidida pelo diplomata brasileiro Osvaldo Aranha, aprovou o Plano de Partilha da Palestina em dois Estados: um judeu e outro árabe, com Jerusalém sob custódia internacional. Os líderes judeus aceitaram e proclamaram o Estado de Israel em 1948; os países árabes e os palestinos rejeitaram a divisão. Seguiram-se guerras sucessivas: a Guerra de 1948 (que gerou a 'Nakba', a catástrofe do êxodo forçado de mais de 700 mil palestinos de suas aldeias); a Crise de Suez (1956); a Guerra dos Seis Dias (1967), na qual Israel ocupou a Faixa de Gaza, a Cisjordânia, Jerusalém Oriental, as Colinas de Golã e a Península do Sinai; e a Guerra do Yom Kippur (1973), que desencadeou o Primeiro Choque do Petróleo pela OPEP. A Organização para a Libertação da Palestina (OLP), liderada por Yasser Arafat, protagonizou negociações históricas como os Acordos de Oslo (1993), mas a expansão de assentamentos judaicos na Cisjordânia, os atentados e a ascensão do Hamas na Faixa de Gaza mantiveram a região em permanente convulsão sangrenta.", ["1947: Resolução 181 da ONU presidida por Osvaldo Aranha partilhando a Palestina", "1948: Fundação de Israel e início da Guerra de Independência / Nakba palestina", "Guerra dos Seis Dias (1967): Ocupação militar israelense da Cisjordânia, Gaza e Jerusalém Oriental", "Choque do Petróleo (1973): OPEP eleva os preços do barril em retaliação ao apoio ocidental a Israel", "Acordos de Oslo (1993): Reconhecimento mútuo entre Yasser Arafat (OLP) e Yitzhak Rabin intermediado por Bill Clinton"], "O conflito no Oriente Médio não é uma 'guerra milenar puramente religiosa': trata-se de uma disputa geopolítica moderna por soberania territorial, posse da terra, controle de fontes de água escassas e rotas de petróleo, forjada após a dissolução do Império Otomano e o mandato britânico.", "Resolução 242 do Conselho de Segurança da ONU (novembro de 1967):\n\n'Afirma que o cumprimento dos princípios da Carta exige a instauração de uma paz justa e duradoura no Médio Oriente, o que deve implicar a aplicação dos dois princípios seguintes: 1) Retirada das forças armadas israelenses dos territórios ocupados no recente conflito; 2) Cessação de qualquer estado de beligerância e respeito à soberania, integridade territorial e independência política de cada Estado da região.'\n\n(Fonte: Organização das Nações Unidas, Resolução 242/1967).", "A Resolução 242 da ONU, editada após a Guerra dos Seis Dias de 1967, estabeleceu como parâmetro para a pacificação do Oriente Médio o princípio de:", ["anexação compulsória de todos os territórios palestinos pela Coroa imperial britânica.", "expulsão de todos os cidadãos judeus do Oriente Médio com apoio militar de tropas internacionais.", "paz em troca de territórios, condicionando o fim das hostilidades à devolução das terras ocupadas durante o conflito.", "proibição da circulação de petroleiros no Canal de Suez para impedir a navegação comercial pacífica.", "imposição da soberania dos Estados Unidos sobre todas as fontes de água doce da bacia do Rio Jordão."], 2, "Passo a passo:\n1. Fonte e contexto: A Resolução 242 é a base de todas as negociações internacionais de paz subsequentes no Oriente Médio.\n2. Raciocínio: A fórmula consagrada 'Terra por Paz' estabelece que Israel deve desocupar as áreas conquistadas na guerra de 1967 em troca do reconhecimento diplomático de suas fronteiras soberanas pelos vizinhos árabes (Gabarito C).\n3. Distratores: A, C, D e E apresentam teses falsas ou absurdas que desrespeitam o texto diplomático do Conselho de Segurança da ONU."], "Queda do Muro de Berlim e Fim da URSS": ["Na década de 1980, a União Soviética entrou em colapso decorrente da burocratização asfixiante, escassez crônica de bens de consumo, corrupção da 'nomenklatura' e gastos militares gigantescos na corrida armamentista contra o projeto 'Guerra nas Estrelas' de Ronald Reagan e na Guerra do Afeganistão (1979-1989). Ao assumir o comando do Partido Comunista em 1985, Mikhail Gorbachev tentou reformar o socialismo lançando a 'Glasnost' (abertura política e liberdade de imprensa) e a 'Perestroika' (reestruturação econômica com introdução gradual de mecanismos de mercado). A abertura estimulou manifestações cívicas e o nacionalismo nas repúblicas soviéticas e nos países satélites do Leste Europeu. Em 9 de novembro de 1989, a população derrubou o Muro de Berlim, símbolo supremo da divisão da Guerra Fria, viabilizando a reunificação da Alemanha em 1990. Em 25 de dezembro de 1991, após um fracassado golpe da linha-dura e a renúncia de Gorbachev, a bandeira vermelha da URSS foi arriada do Kremlin, pondo fim formal ao bloco soviético e à Guerra Fria.", ["Glasnost e Perestroika: Reformas de Gorbachev para dar transparência política e eficiência econômica ao socialismo soviético", "9 de Novembro de 1989: Queda do Muro de Berlim e colapso dos regimes satélites da Cortina de Ferro", "Sindicato Solidariedade (Polônia): Mobilização operária liderada por Lech Walesa pioneira no desafio a Moscou", "Acidente de Chernobyl (1986): Desastre nuclear que escancarou a negligência e a decadência do sistema burocrático soviético", "Dezembro de 1991: Dissolução formal da União Soviética e criação da Comunidade dos Estados Independentes (CEI)"], "O fim da Guerra Fria não representou o 'fim da história' como sonharam teóricos liberais ingênuos como Francis Fukuyama; pelo contrário, abriu caminho para violentos conflitos étnicos e nacionalistas reprimidos na era soviética (como as Guerras da Iugoslávia e a invasão da Ucrânia).", "Discurso de Renúncia de Mikhail Gorbachev transmitido pela televisão soviética (25 de dezembro de 1991):\n\n'O destino quis que, no momento em que passei a chefiar este Estado, já estivesse claro que o país estava doente. A sociedade estava asfixiada sob a bota da burocracia do comando estéril. [...] O processo de renovação da sociedade e de mudanças radicais na comunidade mundial revelou-se muito mais complexo do que se previa. Deixo este cargo com preocupação, mas também com esperança e fé nos cidadãos de nossa grande Pátria.'\n\n(Fonte: Arquivo da Televisão Estatal Soviética, Moscou, 1991).", "A dissolução da União das Repúblicas Socialistas Soviéticas (URSS) em dezembro de 1991 marcou no cenário geopolítico global:", ["o fortalecimento definitivo do modelo de economia planificada estatal em toda a Europa Ocidental.", "o início imediato de um confronto nuclear total entre Washington e Moscou na fronteira do rio Danúbio.", "a unificação dos países do Leste Europeu sob a chefia vitalícia dos antigos generais do Pacto de Varsóvia.", "o encerramento da ordem bipolar da Guerra Fria e a consolidação temporária da hegemonia norte-americana em uma ordem multipolar emergente.", "a extinção permanente da Organização do Tratado do Atlântico Norte (OTAN) em âmbito internacional."], 3, "Passo a passo:\n1. Fonte e contexto: O pronunciamento de Gorbachev em 25 de dezembro de 1991 formaliza a extinção do primeiro Estado socialista da história.\n2. Raciocínio: A queda da URSS sepultou a bipolaridade EUA-URSS, inaugurando a globalização capitalista neoliberal sob liderança dos EUA e, posteriormente, a fragmentação em um mundo multipolar (Gabarito D).\n3. Distratores: A e D contrariam a transição dos países do leste para o capitalismo; C nunca ocorreu; E é falsa, pois a OTAN se expandiu para o leste europeu."], "Globalização e Blocos Econômicos": ["A Globalização é a fase atual de integração planetária das economias, das culturas, das comunicações e das finanças, acelerada desde o fim da Guerra Fria pela Terceira Revolução Industrial (Revolução Técnico-Científico-Informacional com internet, satélites, robótica, microeletrônica e transportes ultrarrápidos). As grandes empresas transnacionais dispersaram suas linhas de produção pelo mundo, buscando mão de obra barata e incentivos fiscais em países periféricos. Para aumentar a competitividade no mercado global, os países organizaram-se em blocos econômicos regionais em diferentes níveis de integração: Zona de Livre Comércio (eliminação de tarifas internas, como o antigo NAFTA / USMCA); União Aduaneira (adoção de Tarifa Externa Comum - TEC, caso do Mercosul); Mercado Comum (livre circulação de pessoas, serviços e capitais); e União Econômica e Monetária (caso único da União Europeia com a moeda única, o Euro). Apesar dos fluxos astronômicos de informações e capitais, a globalização aprofundou a exclusão digital, a precarização do trabalho e as crises migratórias nas fronteiras fortificadas das nações ricas.", ["Revolução Técnico-Científica-Informacional: Matriz tecnológica da globalização concebida pelo geógrafo Milton Santos", "Empresas Transnacionais: Fragmentação da produção em escala global com centros decisórios nos países centrais", "Blocos Econômicos: Estratégia regional para ampliar mercados (União Europeia, Mercosul, USMCA, APEC)", "Mercosul (1991): Tratado de Assunção unindo Brasil, Argentina, Uruguai e Paraguai em uma União Aduaneira", "Crítica de Milton Santos: Distinção entre 'o mundo como fábula' (o discurso midiático idealizado) e 'o mundo como perversidade' (a exclusão real)"], "O geógrafo brasileiro Milton Santos formulou uma das mais brilhantes análises da globalização: ela se apresenta como uma fábula harmoniosa, funciona como uma perversidade desigual para a maioria dos povos, mas contém a semente de 'uma outra globalização' solidária e popular.", "Reflexão do geógrafo Milton Santos na obra 'Por uma Outra Globalização' (2000):\n\n'O mundo é hoje apresentado como uma grande aldeia global, onde o mercado unificado e as tecnologias prometem aproximar todos os seres humanos. Essa é a globalização como fábula. Na realidade concreta, vivemos a globalização como perversidade: para a grande maioria da humanidade, o desemprego cresce, a fome alastra-se, a exclusão social aprofunda-se e as fronteiras continuam rigidamente fechadas para os homens e mulheres do Sul que tentam migrar para o Norte.'\n\n(Fonte: Milton Santos, Por uma Outra Globalização, Record, 2000).", "A crítica de Milton Santos ao processo de globalização contemporâneo destaca a contradição entre:", ["a recusa das grandes corporações transnacionais em utilizar a internet e as redes de comunicação digital.", "a extinção definitiva de todas as fronteiras alfandegárias e das polícias de imigração nos países da Europa.", "a adoção universal de salários idênticos e elevados para os operários fabris de todos os continentes do planeta.", "o isolamento comercial estrito entre os membros dos blocos econômicos regionais da América Latina.", "a livre circulação instantânea de capitais financeiros e mercadorias e as barreiras que bloqueiam os direitos e a mobilidade de populações vulneráveis."], 4, "Passo a passo:\n1. Fonte e contexto: Milton Santos desconstrói o discurso publicitário eufórico da 'aldeia global' demonstrando a perversidade da exclusão contemporânea.\n2. Raciocínio: A globalização permite que bilhões de dólares atravessem oceanos com um clique de computador, mas constrói muros armados e arames farpados para impedir a entrada de refugiados e migrantes pobres (Gabarito E).\n3. Distratores: B nega o uso de tecnologia pelas multinacionais; C, D e E apontam uma igualdade ou facilidade que a realidade concreta desmente categoricamente."], "Crises Geopolíticas e Atentados de 11 de Setembro": ["O início do século XXI foi tragicamente marcado pelos atentados terroristas de 11 de setembro de 2001 nos Estados Unidos, perpetrados pela rede fundamentalista islâmica Al-Qaeda liderada por Osama bin Laden. Quatro aviões comerciais foram sequestrados: dois destruíram as Torres Gêmeas do World Trade Center em Nova York, um atingiu o Pentágono em Washington e o quarto caiu na Pensilvânia, vitimando quase três mil pessoas. Em resposta, o governo republicano de George W. Bush lançou a 'Guerra ao Terror', fundamentada na Doutrina Bush (ações militares preventivas unilaterais sem necessidade de autorização da ONU e a teoria do 'Eixo do Mal'). As tropas da OTAN invadiram o Afeganistão em 2001 para derrubar o regime do Talibã que abrigava a Al-Qaeda. Em 2003, sob a falsa alegação de que o ditador Saddam Hussein possuía armas de destruição em massa, os EUA lideraram a invasão do Iraque. A destruição das estruturas estatais no Oriente Médio abriu caminho para insurgências brutais e a emergência do Estado Islâmico (ISIS).", ["11 de Setembro de 2001: Atentados contra o World Trade Center e o Pentágono alterando a segurança internacional", "Doutrina Bush: Ataques militares preventivos unilaterais contra países rotulados de ameaça terrorista", "Invasão do Afeganistão (2001): Derrubada temporária do Talibã que reconquistou o poder em 2021 após vinte anos de guerra", "Invasão do Iraque (2003): Guerra iniciada sem autorização do Conselho de Segurança da ONU e baseada em pretextos falsos", "Patriot Act: Lei antiterrorismo nos EUA que reduziu liberdades civis autorizando vigilância e espionagem de cidadãos"], "Não confunda islamismo (religião pacífica abraçada por quase dois bilhões de pessoas no mundo) com fundamentalismo terrorista: a grande maioria das vítimas de grupos terroristas como Al-Qaeda e Estado Islâmico são os próprios civis muçulmanos no Oriente Médio e na África.", "Pronunciamento do Presidente George W. Bush perante o Congresso dos EUA (20 de setembro de 2001):\n\n'Nossa guerra contra o terrorismo começa com a Al-Qaeda, mas não termina aí. Ela não terminará até que todo grupo terrorista de alcance global tenha sido encontrado, detido e derrotado. Toda nação, em qualquer região, tem agora uma decisão a tomar: ou vocês estão conosco, ou estão com os terroristas.'\n\n(Fonte: White House Press Office, Washington, 2001).", "A diretriz de segurança internacional conhecida como 'Doutrina Bush', formulada após os atentados de 2001, caracterizou-se por:", ["adotar uma postura unilateralista de ataques preventivos contra Estados acusados de abrigar redes terroristas globais.", "subordinar todas as operações militares das Forças Armadas dos EUA às deliberações unânimes do Conselho de Segurança da ONU.", "renunciar ao uso da força armada em favor de missões diplomáticas pacíficas de cooperação humanitária.", "proibir a concessão de recursos orçamentários federais para o complexo industrial-militar norte-americano.", "firmar alianças políticas incondicionais com lideranças fundamentalistas do regime teocrático do Talibã."], 0, "Passo a passo:\n1. Fonte e contexto: O ultimato de George W. Bush ('ou estão conosco, ou com os terroristas') inaugurou a era da Guerra ao Terror.\n2. Raciocínio: A Doutrina Bush consagrou a estratégia do ataque preventivo unilateral: os EUA atribuíram a si o direito soberano de atacar qualquer país mesmo sem prova de agressão consumada e sem respaldo do direito internacional (Gabarito A).\n3. Distratores: A diz o oposto (os EUA invadiram o Iraque sem a ONU); B e D contrariam a escalada armamentista bélica; E inverte o inimigo declarado das tropas ocidentais."], "Multipolaridade e a Ascensão da China": ["O cenário geopolítico do século XXI é caracterizado pela transição da ordem unipolar do pós-Guerra Fria para uma complexa ordem multipolar, com múltiplos polos globais de poder econômico, militar e tecnológico. O acontecimento mais transformador dessa nova era é a vertiginosa ascensão da República Popular da China. A partir das reformas de 'abertura econômica' iniciadas por Deng Xiaoping em 1978 sob a bandeira do 'socialismo de mercado' (Zonas Econômicas Especiais com atração maciça de capital estrangeiro), a China tornou-se a 'fábrica do mundo' e a segunda maior economia do planeta. Na década de 2010, sob liderança de Xi Jinping, o país lançou a iniciativa 'Cinturão e Rota' (a Nova Rota da Seda), investindo centenas de bilhões de dólares em portos, ferrovias e telecomunicações (5G) na Ásia, África e América Latina. Paralelamente, o bloco dos BRICS (Brasil, Rússia, Índia, China e África do Sul) e o Novo Banco de Desenvolvimento (Banco dos BRICS) articulam a desdolarização do comércio e desafiam a hegemonia tradicional das potências ocidentais do G7.", ["Deng Xiaoping (1978): Abertura econômica pragmática ('Não importa a cor do gato, desde que cace ratos')", "Socialismo de Mercado: Modelo híbrido de rígido controle político unipartidário estatal com dinamismo capitalista nas empresas", "Nova Rota da Seda (Belt and Road Initiative): Megaprojeto chinês de infraestrutura conectando mercados em três continentes", "Guerra Comercial e Tecnológica: Disputa hegemônica entre Estados Unidos e China pelo controle de semicondutores, inteligência artificial e 5G", "BRICS: Articulação geopolítica de potências emergentes do Sul Global que defendem uma governança mundial reformada e multipolar"], "O papel da China no Brasil contemporâneo: Desde 2009, a China superou os Estados Unidos e consolidou-se como o maior parceiro comercial do Brasil, absorvendo fatias colossais das exportações nacionais de soja, minério de ferro e petróleo.", "Dados sobre o comércio bilateral entre Brasil e China (2000-2023):\n\n• Ano 2000: Volume comercial de aproximadamente US$ 2 bilhões.\n• Ano 2010: Volume comercial superou US$ 56 bilhões (China ultrapassa os EUA).\n• Ano 2023: Corrente de comércio ultrapassou a marca histórica de US$ 150 bilhões, gerando superávit de dezenas de bilhões para o Brasil.\n\n(Fonte: Ministério do Desenvolvimento, Indústria, Comércio e Serviços - MDIC / Secex).", "A evolução dos fluxos comerciais entre o Brasil e a China nas últimas duas décadas reflete uma reconfiguração da geopolítica mundial caracterizada pela:", ["perda de importância da economia chinesa na compra de commodities minerais e agropecuárias sul-americanas.", "ascensão da China como potência geoeconômica global e polo central das relações comerciais e financeiras com os países emergentes.", "manutenção do monopólio comercial absoluto dos países da União Europeia sobre todas as exportações brasileiras.", "interrupção imediata de todos os investimentos chineses na infraestrutura portuária e energética do território nacional.", "adesão compulsória da economia brasileira às diretrizes socialistas de planificação estatal centralizada de Pequim."], 1, "Passo a passo:\n1. Fonte e contexto: As estatísticas do MDIC documentam a impressionante explosão comercial de US$ 2 bilhões para mais de US$ 150 bilhões anuais entre Brasil e China.\n2. Raciocínio: A China tornou-se a locomotiva econômica das commodities mundiais, consolidando a multipolaridade e reorientando o eixo das trocas do Sul Global (Gabarito B).\n3. Distratores: A e D contrariam frontalmente os dados numéricos de crescimento; B erra ao desconhecer que a China superou a Europa e os EUA como parceira do Brasil; E fantasia uma conversão ideológica que inexiste nas relações mercantis soberanas."], "Povos Originários do Brasil Antes de 1500": ["Antes da invasão portuguesa em 1500, o território que hoje constitui o Brasil era habitado por uma imensa diversidade de povos indígenas, estimada entre 3 e 5 milhões de pessoas organizadas em mais de mil etnias distintas, pertencentes a grandes troncos linguísticos como o Tupi-Guarani (predominante na faixa litorânea), Macro-Jê, Aruak e Karib. Ao contrário do mito racista de 'selvagens preguiçosos', os povos originários possuíam sofisticados sistemas de manejo agroflorestal (como a coivara ou agricultura itinerante sustentável com pousio da terra, cultivo da mandioca, milho e abóbora), divisão do trabalho por sexo e idade, medicina botânica milenar e rica cosmologia espiritual baseada na oralidade e na relação sagrada com a natureza. Não existia Estado centralizado, propriedade privada da terra nem classes sociais; a posse da terra era comunal e os excedentes eram compartilhados conforme laços de parentesco e reciprocidade.", ["Diversidade Étnica e Linguística: Troncos Tupi-Guarani, Macro-Jê, Karib e Aruak com cosmologias particulares", "Manejo Agroflorestal: Roça de coivara sustentável, terra preta de índio na Amazônia e cultivo milenar da mandioca", "Divisão Social do Trabalho: Homens na caça, guerra e preparo do solo; mulheres no plantio, colheita e cerâmica", "Inexistência de Propriedade Privada: Terra e recursos comunais orientados pela reciprocidade e parentesco", "Antropofagia Ritualística: Ritual sagrado guerreiro tupi de vingança e absorção simbólica da coragem do inimigo vencido"], "Atenção: A antropofagia praticada por tupinambás não era canibalismo por fome; tratava-se de um complexo ritual sagrado guerreiro destinado a honrar e vingar antepassados, absorvendo simbolicamente as virtudes do guerreiro inimigo capturado em combate.", "Relato do náufrago alemão Hans Staden em 'Duas Viagens ao Brasil' (1557), sobre seu convívio entre os Tupinambás:\n\n'Perguntei aos selvagens por que matavam e comiam os seus inimigos. Responderam-me que não o faziam por fome, pois tinham fartura de caça, peixes e raízes de mandioca, mas por grande ódio e vingança antiga, para que a carne do inimigo honrasse a memória dos bravos antepassados que tombaram em batalha.'\n\n(Fonte: Hans Staden, Duas Viagens ao Brasil, 1557).", "O relato de Hans Staden demonstra que o ritual antropofágico praticado por grupos indígenas tupis no litoral brasileiro possuía um significado:", ["estritamente nutricional provocado pela escassez permanente de alimentos no litoral tropical.", "exclusivamente comercial para a venda de prisioneiros aos marinheiros mercantes portugueses.", "sociocultural e religioso vinculado à honra bélica, à ancestralidade e à vingança contra os adversários tribais.", "subordinado às diretrizes pastorais emanadas pelos padres jesuítas no processo de catequese.", "decorrente da ausência de qualquer estrutura familiar ou espiritual entre os povos originários."], 2, "Passo a passo:\n1. Fonte e contexto: Hans Staden viveu como prisioneiro dos tupinambás no século XVI e registrou seus costumes sem a censura inquisitorial.\n2. Raciocínio: A antropofagia tupi era um ato cósmico e ritual de vingança e memória, e não barbárie alimentar por carência calórica (Gabarito C).\n3. Distratores: A é expressamente desmentida pelo relato ('não o faziam por fome'); B, D e E trazem equívocos e preconceitos desprovidos de base etnográfica."], "Civilizações Pré-Colombianas: Maias e Astecas": ["Na Mesoamérica, floresceram civilizações urbanas monumentais muito antes do contato europeu. Os Maias (na península de Yucatán e América Central) organizavam-se em cidades-estados autônomas teocráticas (Tikal, Palenque, Chichén Itzá) e destacaram-se por uma escrita hieroglífica complexa, astronomia apurada, o uso matemático pioneiro do zero e grandiosas pirâmides em degraus. Os Astecas (Mexicas) fundaram no século XIV seu império militarista no vale do México, tendo como capital Tenochtitlán — uma metrópole insular e
