rguida no lago Texcoco com mais de 200 mil habitantes, canais navegáveis, aquedutos e calçadas fortificadas. A agricultura asteca era altamente produtiva graças às 'chinampas' (ilhas artificiais de cultivo construídas com juncos e lodo fértil sobre o lago). A sociedade asteca era estamental e teocrática, submetendo povos vizinhos ao pagamento de pesados tributos e realizando sacrifícios humanos sagrados ao deus solar Huitzilopochtli.", ["Maias: Cidades-estados autônomas, escrita pictoglífica, conceito matemático do zero e calendário solar preciso", "Astecas (Mexicas): Império tributário militar centralizado com capital na esplendorosa Tenochtitlán", "Chinampas: Ilhas artificiais flutuantes sobre lagos que sustentavam a densa população asteca", "Teocracia e Tributos: Dominação dos povos subjugados mediante envio compulsório de grãos, ouro e cativos", "Códices Pré-Colombianos: Manuscritos pictóricos em casca de árvore que documentavam a história, impostos e deuses"], "Tenochtitlán impressionou os conquistadores espanhóis: Hernán Cortés relatou que os mercados astecas (como Tlatelolco) eram maiores, mais limpos e mais organizados do que qualquer praça de comércio de Sevilha, Roma ou Constantinopla na época.", "Relato do soldado espanhol Bernal Díaz del Castillo ao avistar Tenochtitlán em 1519:\n\n'E desde que vimos tantas cidades e vilas construídas na água, e outras grandes povoações em terra firme, e aquela calçada tão reta que ia para Tenochtitlán, ficamos admirados e dizíamos que parecia coisa de encantamento, por causa das grandes torres e templos que se erguiam da água, todos caiados e reluzentes.'\n\n(Fonte: Bernal Díaz del Castillo, História Verdadeira da Conquista da Nova Espanha).", "A descrição de Tenochtitlán feita pelos conquistadores espanhóis evidencia que a sociedade asteca alcançou um elevado estágio civilizatório marcado por:", ["uma arquitetura rudimentar e incapacidade de desenvolver obras de drenagem ou aproveitamento das águas.", "um isolamento completo sem trocas comerciais com outras regiões da América Central.", "uma estrutura política pacífica que desconhecia a atividade bélica ou a cobrança de tributos estatais.", "um notável planejamento urbano, domínio da engenharia hidráulica e arquitetura monumental integrada ao meio lacustre.", "uma dependência absoluta de manufaturas importadas das cidades mercantis da Europa ocidental."], 3, "Passo a passo:\n1. Fonte e contexto: Bernal Díaz del Castillo acompanhou Cortés e testemunhou o assombro dos espanhóis diante da metrópole asteca no lago Texcoco.\n2. Raciocínio: Tenochtitlán possuía obras de engenharia monumental (chinampas, aquedutos de água potável, calçadas diques) superiores a cidades europeitas coetâneas (Gabarito D).\n3. Distratores: A nega a grandiosidade técnica descrita no texto; B, D e E contradizem a pujança comercial, o militarismo imperial e o isolamento em relação à Europa."], "O Império Inca e a Organização Andina": ["Na cordilheira dos Andes (abrangendo atuais Peru, Bolívia, Equador, Chile e Argentina), os Incas estruturaram o maior império da América pré-colombiana: o 'Tawantinsuyu' ('as quatro regiões unidas'), com capital em Cusco. O Sapa Inca era reverenciado como o filho do Sol (Inti). A economia baseava-se em uma admirável engenharia agrícola nas encostas íngremes das montanhas por meio de terraços escalonados ('andenes') e sistemas de irrigação que desafiavam o relevo andino, cultivando batata, milho e criando lhamas e alpacas. A base social era o 'Ayllu', comunidade aldeã unida por laços de parentesco coletivo sob o comando do curaca. O trabalho era regulado por costumes ancestrais: a 'Mita' (trabalho coletivo obrigatório e rotativo nas terras do Inca e nas obras públicas de pontes suspensas e estradas reais) e o 'Ayni' (ajuda mútua entre famílias). Não desenvolveram escrita alfabética, mas criaram os 'Quipos', sofisticado sistema de cordões e nós coloridos para registro estatístico e contábil rigoroso.", ["Tawantinsuyu: Império centralizado interligado por mais de 30 mil km de estradas reais nos Andes (Qhapaq Ñan)", "Andenes: Terraços agrícolas em degraus nas encostas que impediam a erosão e aproveitavam a água do degelo", "Ayllu: Célula social comunitária camponesa liderada pelo curaca fundamentada na reciprocidade", "Mita Incaica: Prestação de trabalho comunitário periódico e rotativo pelo ayllu para obras do Império", "Quipos: Instrumento mnemônico e contábil de nós e cordas para registro demográfico, militar e fiscal"], "A mita incaica original era rotativa e baseada na reciprocidade (o Inca redistribuía estoques de comida em épocas de escassez); os espanhóis desvirtuaram totalmente a mita, transformando-a em escravidão mortal nas minas de prata de Potosí.", "Descrição do cronista Inca Garcilaso de la Vega sobre os terraços agrícolas andinos (1609):\n\n'Nos montes e ladeiras empinadas abriam terraços largos, sustentando as terras com muros de pedra para que a chuva não as levasse, e por canais de pedra traziam a água das serras nevadas para regar as semeaduras de milho e batata. Assim aproveitavam todo o solo das montanhas, sem desperdiçar um palmo de terra.'\n\n(Fonte: Inca Garcilaso de la Vega, Comentários Reais dos Incas, 1609).", "A tecnologia agrícola dos terraços ('andenes') desenvolvida pela civilização inca permitiu:", ["a destruição das florestas tropicais litorâneas para o plantio de cana-de-açúcar monocultora.", "a domesticação de grandes manadas de bovinos e equinos importados do continente asiático.", "o abandono definitivo das comunidades aldeãs dos ayllus em favor da migração em massa para as ilhas caribenhas.", "a recusa de qualquer forma de intervenção humana sobre a paisagem natural das cordilheiras.", "a superação das adversidades do relevo montanhoso, garantindo alta produtividade alimentar e controle da erosão do solo."], 4, "Passo a passo:\n1. Fonte e contexto: O cronista mestiço Garcilaso de la Vega descreveu com erudição o sistema de terraços e aquedutos incas.\n2. Raciocínio: A engenharia dos andenes transformou encostas íngremes em celeiros férteis, aproveitando a microclimatologia andina e a água do degelo glacial (Gabarito E).\n3. Distratores: A confunde produtos e geografia; B cita animais exóticos trazidos depois pelos europeus; D e E contrariam a sedentarização e a magistral intervenção paisagística inca."], "Conquista Espanhola e a Catástrofe Demográfica": ["A conquista espanhola das Américas no século XVI foi rápida, implacável e devastadora. Hernán Cortés derrubou o Império Asteca em 1521, e Francisco Pizarro capturou e executou o imperador Atahualpa, conquistando o Império Inca em 1533. Como poucos milhares de conquistadores ('conquistadores') subjugaram impérios de milhões de súditos? Os fatores fundamentais foram: (1) Superioridade bélica (cavalos, armaduras de aço, arcabuzes e canhões que causavam pânico psicológico); (2) Exploração astuta das divisões internas (aliança com povos subjugados que odiavam os astecas, como os tlaxcaltecas); (3) Choque bacteriológico: a introdução involuntária de vírus e bactérias desconhecidos na América (varíola, sarampo, gripe, tifo), para os quais os nativos não possuíam imunidade biológica. A 'guerra biológica' aliada aos massacres, fome e escravização provocou uma catástrofe demográfica sem precedentes na história: entre 70% e 90% da população originária das Américas foi dizimada no primeiro século da conquista.", ["1521: Queda de Tenochtitlán sob comando de Hernán Cortés auxiliado por aliados indígenas tlaxcaltecas", "1533: Queda de Cusco e execução do Sapa Inca Atahualpa por Francisco Pizarro", "Guerra Bacteriológica: Epidemias devastadoras de varíola e gripe que mataram muito mais que a espada", "Alianças Estratégicas: Exploração inteligente do ódio dos povos tributários subjugados contra os impérios dominantes", "Catástrofe Demográfica: Morte de dezenas de milhões de indígenas em menos de um século de dominação"], "Cuidado com visões simplistas: Os indígenas não foram derrotados porque acreditavam ingenuamente que os espanhóis eram deuses; foram dizimados principalmente pelas epidemias mortais de varíola e pela habilidade europeia de atiçar guerras civis locais.", "Relato indígena em náuatle no 'Códice Florentino' (século XVI), compilado por Bernardino de Sahagún:\n\n'Antes que os espanhóis nos atacassem com suas armas de fogo, alastrou-se entre nós uma grande praga de feridas e bexigas de pus. Uma grande mortandade abateu-se sobre o povo: muitos morriam de sede e fome porque ninguém conseguia se levantar para cuidar do outro ou cozinhar; os corpos jaziam amontoados nos aposentos e as ruas cheiravam a morte.'\n\n(Fonte: Códice Florentino, Livro XII, Século XVI).", "O testemunho preservado no Códice Florentino revela que a conquista espanhola do Império Asteca foi viabilizada de modo decisivo pelo:", ["impacto epidemiológico devastador das doenças infecciosas trazidas pelos invasores, desestruturando a defesa e a sociedade nativa.", "uso exclusivo da diplomacia pacífica sem qualquer violência militar ou biológica.", "apoio incondicional e espontâneo prestado por todos os sacerdotes astecas ao batismo católico.", "suicídio coletivo voluntário de toda a população da cidade em honra aos conquistadores espanhóis.", "desarmamento prévio das tropas indígenas determinado pelo imperador Montezuma antes do desembarque europeu."], 0, "Passo a passo:\n1. Fonte e contexto: O Códice Florentino registra a memória dos próprios sobreviventes astecas sobre o impacto fulminante da varíola.\n2. Raciocínio: A epidemia de varíola quebrou a resistência de Tenochtitlán, matando generais, governantes e paralisando o abastecimento de comida antes mesmo do cerco militar final (Gabarito A).\n3. Distratores: A é historicamente mentirosa; C, D e E inventam submissões, suicídios ou desarmamentos voluntários que negam a encarniçada resistência mexica."], "Sistemas de Trabalho Compulsório: Mita e Encomienda": ["Para explorar as riquezas minerais e agrícolas da América espanhola, a Coroa organizou sistemas implacáveis de trabalho compulsório sobre os povos indígenas. A 'Encomienda' consistia na concessão régia de um grupo de indígenas a um colonizador espanhol ('encomendero'): este tinha o direito de cobrar tributos e explorar o trabalho forçado dos nativos, em troca da obrigação teórica de catequizá-los e instruí-los na fé católica (na prática, uma brutal escravidão disfarçada). A 'Mita' (chamada de 'Repartimiento' no México) foi a apropriação e desfiguração espanhola da tradicional instituição incaica: sorteavam-se parcelas de homens das aldeias para trabalhar compulsoriamente nas minas de prata (especialmente em Potosí, na Bolívia, e Zacatecas, no México) e no mercúrio durante meses, recebendo salários simbólicos irrisórios e enfrentando asfixia, desabamentos e envenenamento nas galerias subterrâneas. O dominicano Bartolomeu de Las Casas denunciou veementemente esses horrores na 'Brevíssima Relação da Destruição das Índias' (1552).", ["Encomienda: Exploração do trabalho forçado de comunidades indígenas sob o pretexto paternalista da catequese", "Mita colonial / Repartimiento: Trabalho forçado nas minas de prata de Potosí com salários irrisórios e altíssima mortalidade", "Bartolomeu de Las Casas: Bispo dominicano que combateu a encomienda e denunciou as atrocidades coloniais espanholas", "Leis Novas (1542): Tentativas da Coroa de limitar a hereditariedade da encomienda, resistidas com rebeliões de colonos", "Minas de Potosí: O maior veio de prata do planeta, transformado no 'túmulo de milhões de indígenas' andinos"], "Bartolomeu de Las Casas é uma figura central do ENEM: defensor intransigente da humanidade dos povos indígenas perante o imperador Carlos V, travou célebre debate em Valladolid (1550) contra Juan Ginés de Sepúlveda (que defendia a tese aristotélica da escravidão natural dos nativos).", "Trecho da 'Brevíssima Relação da Destruição das Índias', de Frei Bartolomeu de Las Casas (1552):\n\n'Os espanhóis entraram nestas terras como lobos bravos e leões cruéis. E outra coisa não têm feito nestes quarenta anos senão despedaçar, matar, atormentar e destruir essas gentes com crueldades estranhas e nunca dantes vistas, a ponto de que, dos milhões de almas que povoavam a ilha de São Domingos, não restam hoje duzentas pessoas vivas.'\n\n(Fonte: Bartolomeu de Las Casas, Brevísima Relación de la Destrucción de las Indias, 1552).", "A denúncia formulada por Bartolomeu de Las Casas em 1552 criticava com veemência:", ["o pacifismo excessivo das tropas reais que recusavam ocupar as cidades do interior da América.", "a violência desmedida e a crueldade da exploração colonial que estavam exterminando as populações indígenas americanas.", "a cobrança de dízimos da Igreja Católica que empobrecia os grandes mineradores e encomenderos espanhóis.", "a introdução de leis trabalhistas benéficas que garantiam férias e repouso remunerado aos nativos.", "o abandono da fé católica pelos missionários para aderirem aos cultos politeístas incaicos."], 1, "Passo a passo:\n1. Fonte e contexto: Las Casas escreveu sua famosa denúncia para chocar o rei da Espanha e forçar o cancelamento das encomiendas assassinas.\n2. Raciocínio: O texto aponta sem eufemismos a barbárie, a pilhagem e o genocídio cometidos pelos colonizadores sob o manto da fé, exigindo o fim do morticínio dos povos originários (Gabarito B).\n3. Distratores: A e C invertem a queixa de Las Casas; D e E fantasiam benefícios trabalhistas ou apostasias que não existiram no regime colonial."], "Resistência Indígena e Direitos Territoriais Contemporâneos": ["A resistência dos povos originários do Brasil atravessou os séculos e permanece como uma das mais vivas frentes de luta democrática contemporânea. No período colonial, manifestou-se na Confederação dos Tamoios (aliança tupi contra a escravidão paulista), na Guerra Guaranítica (quando os índios missioneiros liderados por Sepé Tiaraju lutaram contra o Tratado de Madri) e na fundação de quilombos indígenas no interior. A Constituição de 1988 representou uma revolução jurídica ao romper com a secular tutela e o projeto de 'integração/assimilação' forçada, reconhecendo no artigo 231 'sua organização social, costumes, línguas, crenças e tradições, e os direitos originários sobre as terras que tradicionalmente ocupam', cabendo à União demarcá-las e protegê-las. No século XXI, o movimento indígena, articulado na APIB (Articulação dos Povos Indígenas do Brasil) e no 'Acampamento Terra Livre', enfrenta a invasão de terras por garimpeiros ilegais, grileiros e madeireiros (como na tragédia humanitária Yanomami), além da tese jurídica do 'Marco Temporal' (derrubada pelo STF em 2023).", ["Guerra Guaranítica (1753-1756): Resistência armada missioneira de Sepé Tiaraju ('Esta terra tem dono!')", "Artigo 231 da CF/1988: Direitos originários inalienáveis dos povos indígenas sobre as terras tradicionalmente ocupadas", "Fim da Tutela Integracionista: Reconhecimento da cidadania plena e da manutenção perpétua das identidades indígenas", "Marco Temporal: Tese ruralista que limitava a demarcação apenas a terras ocupadas em 5 de outubro de 1988 (declarada inconstitucional pelo STF)", "Lideranças Indígenas Globais: Ailton Krenak, Davi Kopenawa e Sônia Guajajara como intelectuais e vozes ecológicas planetárias"], "O conceito de 'indigenato' ou 'direito originário' (reconhecido na CF/1988) significa que o direito dos povos indígenas sobre suas terras ancestrais é anterior à própria criação do Estado brasileiro e à chegada dos portugueses em 1500; a demarcação pela Funai não 'cria' a terra indígena, apenas a reconhece e homologa.", "Artigo 231, caput da Constituição da República Federativa do Brasil (1988):\n\n'São reconhecidos aos índios sua organização social, costumes, línguas, crenças e tradições, e os direitos originários sobre as terras que tradicionalmente ocupam, competindo à União demarcá-las, proteger e fazer respeitar todos os seus bens.'\n\n(Fonte: Constituição Federal do Brasil de 1988).", "O Artigo 231 da Constituição de 1988 representou uma virada histórica fundamental nas relações entre o Estado brasileiro e os povos originários ao:", ["determinar a assimilação compulsória de todas as etnias aos costumes urbanos e a proibição das línguas maternas.", "autorizar a compra e venda de reservas demarcadas no mercado imobiliário para empreendimentos de mineração privada.", "reconhecer a legitimidade originária de suas tradições culturais e o direito inalienável à demarcação e posse de suas terras tradicionais.", "revogar todas as demarcações anteriores para transferir as florestas públicas à administração dos governadores militares.", "obrigar os povos indígenas a abandonarem suas práticas agrícolas tradicionais para adotarem monoculturas de exportação."], 2, "Passo a passo:\n1. Fonte e contexto: O artigo 231 consagrou o novo paradigma indigenista de reconhecimento da pluralidade étnica e dos direitos ancestrais originários.\n2. Raciocínio: A Constituição de 1988 abandonou a meta civilizatória de forçar o indígena a 'deixar de ser índio', garantindo-lhe o direito perpétuo de viver segundo seus costumes e assegurando a posse inalienável de suas terras (Gabarito C).\n3. Distratores: A, C, D e E propõem violências assimilacionistas e mercantilistas que contrariam os preceitos garantistas da Carta Cidadã."], "Feudalismo: Relações de Suserania e Servidão": ["O Feudalismo foi o sistema socioeconômico, político e cultural predominante na Europa Ocidental durante a Alta Idade Média (séculos V a X), resultante da fusão entre elementos romanos (o colonado, o esvaziamento das cidades e a villa agrária) e germânicos (o 'comitatus' — honra e lealdade militar recíproca entre guerreiros — e o direito consuetudinário). A economia feudal era essencialmente agrária, autossuficiente e desmonetizada, estruturada no Feudo (dividido em Manso Senhorial, Manso Servil e Manso Comunal). A sociedade era estamental, polarizada e sem mobilidade social, justificada ideologicamente pela Igreja em três ordens: 'os que oram' (clero), 'os que guerreiam' (nobreza feudal) e 'os que trabalham' (servos e vilões). As relações nobres eram pautadas pela Suserania e Vassalagem (pacto político-militar de fidelidade e auxílio selado na homenagem e na investidura do feudo). Na base, os servos estavam presos à terra e sustentavam os senhores por meio de pesadas obrigações feudais: a Corveia (trabalho compulsório nas terras senhoriais), a Talha (entrega de parte da colheita do manso servil) e as Banalidades (tributo pelo uso do moinho, forno e lagar).", ["Sociedade Tripartida: Bellatores (cavaleiros que lutam), Oratores (padres que rezam) e Laboratores (servos que trabalham)", "Suserania e Vassalagem: Relação horizontal recíproca exclusiva entre membros nobres com juramento de fidelidade e ajuda bélica", "Servidão versus Escravidão: O servo não era propriedade do senhor nem podia ser vendido, mas estava preso à gleba feudal", "Tributos Feudais: Corveia (dias de trabalho forçado), Talha (metade da produção) e Banalidades (taxas de uso de maquinário senhorial)", "Descentralização Política: Fragmentação do poder soberano nas mãos de centenas de senhores feudais em seus castelos fortificados"], "Não confunda: Suserania e vassalagem é uma relação entre nobres (iguais no sangue); servidão é uma relação vertical de exploração econômica entre o senhor da terra e o camponês servo.", "Poema didático do bispo Adalberão de Laon sobre as três ordens medievais (século XI):\n\n'A casa de Deus, que se crê una, está dividida em três: uns oram, outros combatem, e outros, enfim, trabalham. Essas três ordens vivem juntas e não suportariam a separação; o serviço de uma permite o trabalho das outras duas, e cada uma, por sua vez, presta apoio a todas.'\n\n(Fonte: Adalberão de Laon, Poème au Roi Robert, Século XI).", "A concepção social formulada por Adalberão de Laon no século XI expressava a visão teológica da Igreja Católica medieval voltada a:", ["estimular rebeliões camponesas armadas contra a autoridade e os privilégios nobiliárquicos.", "defender a igualdade jurídica plena e o sufrágio universal secreto em eleições comunais abertas.", "proibir os nobres feudais de portarem espadas ou participarem de torneios e guerras entre si.", "legitimar a hierarquia estamental e a submissão dos trabalhadores como uma ordem natural sagrada querida por Deus.", "promover a desapropriação dos latifúndios rurais e sua entrega definitiva às corporações de ofício urbanas."], 3, "Passo a passo:\n1. Fonte e contexto: O texto de Adalberão de Laon sintetiza a doutrina oficial da Igreja sobre as três ordens do feudalismo.\n2. Raciocínio: Ao afirmar que a divisão entre os que rezam, os que guerreiam e os que trabalham é querida por Deus e necessária à salvação, a Igreja sacralizava e eternizava a servidão dos camponeses pobres (Gabarito D).\n3. Distratores: A, C, D e E propõem ideais revolucionários, democráticos ou igualitários incompatíveis com a mentalidade feudal teocêntrica."], "O Papel da Igreja Católica na Cristandade Medieval": ["Durante a Idade Média, a Igreja Católica Apostólica Romana foi a instituição mais poderosa, influente e coesa da Europa Ocidental, funcionando como o verdadeiro cimento ideológico e político da 'Cristandade'. Herdeira da estrutura burocrática e territorial do Império Romano, a Igreja era a maior proprietária de terras do continente (detentora de cerca de um terço de todo o solo feudal), arrecadando riquezas imensas por meio do dízimo compulsório e doações testamentárias. A Igreja monopolizava o saber letrado: as bibliotecas estavam nos mosteiros beneditinos, onde os monges copistas transcreviam manuscritos bíblicos e clássicos. O Teocentrismo (Deus no centro de todas as coisas) dominava a cultura e a filosofia (como a Escolástica de São Tomás de Aquino, que harmonizou fé e razão aristotélica). A Igreja exercia imenso poder coercitivo sobre reis e imperadores através da Excomunhão (expulsão da comunidade de fiéis, o que desobrigava os súditos de obedecerem ao governante excomungado) e da Interdição (suspensão de missas e sacramentos em todo um reino).", ["Maior Senhora Feudal: Vasto patrimônio territorial e cobrança compulsória do dízimo eclesiástico", "Teocentrismo e Filosofia Escolástica: O saber subordinado à teologia ('a filosofia é a serva da teologia')", "Armas Espirituais de Poder: Excomunhão e Interdição usadas como instrumentos políticos contra reis rebeldes", "Mosteiros e Monges Copistas: Preservação de manuscritos antigos e ensino superior nas primeiras universidades medievais (Bolonha, Paris)", "Querela das Investiduras (século XI): Disputa acirrada de poder entre o Papa Gregório VII e o imperador do Sacro Império pelo direito de nomear bispos"], "A Idade Média não foi a 'Idade das Trevas' como diziam os renascentistas iluministas: nos mosteiros e nas catedrais góticas desenvolveram-se as primeiras universidades, a arquitetura monumental de vitrais e a preservação de grande parte do pensamento filosófico clássico.", "Trecho dos 'Dictatus Papae', redigidos pelo Papa Gregório VII (1075):\n\n'1. Que a Igreja romana foi fundada somente por Deus.\n9. Que somente os pés do Papa devem ser beijados por todos os príncipes.\n12. Que lhe é lícito depor os imperadores.\n19. Que ninguém pode julgar o Papa.'\n\n(Fonte: Dictatus Papae, Arquivo Secreto do Vaticano, 1075).", "O documento 'Dictatus Papae' do Papa Gregório VII evidenciava a pretensão da Igreja Católica na Idade Média de:", ["subordinar a autoridade papal ao comando civil e militar dos imperadores germânicos.", "renunciar à posse de terras e palácios para instituir o voto perpétuo de mendicância para todos os bispos.", "reconhecer a legitimidade das religiões politeístas pagãs dentro dos limites territoriais da Europa.", "abolir a cobrança do dízimo eclesiástico em benefício do comércio ambulante dos burgueses.", "afirmar a supremacia universal do poder espiritual da Igreja sobre o poder temporal dos governantes seculares."], 4, "Passo a passo:\n1. Fonte e contexto: Os Dictatus Papae de 1075 foram a declaração máxima da teocracia papal no auge da Querela das Investiduras.\n2. Raciocínio: Ao proclamar que o Papa pode depor reis e que nenhum soberano terrestre pode julgá-lo, Gregório VII consagrou a primazia do poder espiritual da Igreja sobre as monarquias feudais (Gabarito E).\n3. Distratores: A diz o exato oposto; C descreve a proposta franciscana de pobreza evangélica, rejeitada pela cúria como regra geral; D e E contrariam os dogmas e a arrecadação da Igreja."], "O Islã Medieval e a Expansão Árabe": ["No século VII d.C., na Península Arábica, o profeta Maomé (Muhammad) fundou o Islã, religião monoteísta baseada na revelação divina contida no livro sagrado do Alcorão. A Hégira (622 d.C., a fuga de Maomé de Meca para Medina fugindo de perseguições de mercadores politeístas) marca o início do calendário muçulmano. A nova fé unificou as tribos árabes nômades e impulsionou uma fulgurante expansão militar e territorial pelos séculos VII e VIII, conquistando o Oriente Médio, o norte da África e a Península Ibérica (Al-Andalus, a partir de 711 d.C.), onde o avanço muçulmano na Europa só foi detido pelos francos de Carlos Martel na Batalha de Poitiers (732 d.C.). Ao contrário da visão preconceituosa que o associa apenas à guerra santa ('Jihad'), o mundo islâmico medieval viveu uma 'Idade de Ouro' científica e cultural: preservou e traduziu obras de Platão e Aristóteles, aperfeiçoou o astrolábio, inventou a álgebra, introduziu os algarismos indo-arábicos na Europa e revolucionou a medicina e a cirurgia com tratados de filósofos como Avicena (Ibn Sina) e Averróis (Ibn Rushd).", ["Pilares do Islã: Fé em Alá e Maomé, cinco orações diárias, esmola ritual (Zakat), jejum no Ramadã e peregrinação a Meca (Hajj)", "622 d.C.: Hégira de Meca para Medina, início da contagem dos anos no calendário islâmico", "Al-Andalus (Península Ibérica): Convivência fecunda e tolerância religiosa entre muçulmanos, cristãos e judeus em Córdoba e Granada", "Avanços Científicos Notáveis: Álgebra de Al-Khwarizmi, óptica, medicina de Avicena e invenções agronômicas de irrigação", "Batalha de Poitiers (732): Carlos Martel impede o avanço militar islâmico ao norte dos Pirineus na Europa franca"], "O legado árabe é onipresente na língua portuguesa e na cultura brasileira: palavras iniciadas por 'al' (álcool, algarismo, algodão, alface, alfinete, alqueire, alfaiate) foram incorporadas durante os quase oito séculos de presença muçulmana na Península Ibérica.", "Reflexão do historiador libanês Amin Maalouf em 'As Cruzadas Vistas pelos Árabes':\n\n'No século XI, o mundo árabe e islâmico desfrutava de uma civilização brilhante, refinada e culta. Cidades como Bagdá, Cairo e Córdoba possuíam hospitais públicos, grandes bibliotecas com centenas de milhares de volumes, banhos termais e academias científicas, enquanto as cidades da Europa ocidental eram ainda pequenas vilas enlameadas e iletradas.'\n\n(Fonte: Amin Maalouf, As Cruzadas Vistas pelos Árabes, Brasiliense).", "A passagem de Amin Maalouf destaca a relevância histórica do mundo islâmico medieval ao ressaltar:", ["a opulência cultural, científica e urbana das metrópoles islâmicas frente ao mundo feudal europeu medieval.", "o atraso técnico e a aversão dos sábios muçulmanos a qualquer forma de pesquisa astronômica e médica.", "o isolamento comercial estrito das caravanas árabes no interior das dunas do deserto arábico.", "a destruição sumária de todos os manuscritos dos filósofos gregos pelos exércitos califais.", "a recusa dos navegadores árabes em utilizar instrumentos náuticos como a bússola e o astrolábio."], 0, "Passo a passo:\n1. Fonte e contexto: Amin Maalouf inverte a perspectiva eurocêntrica ao analisar o esplendor do mundo islâmico no período medieval.\n2. Raciocínio: As capitais muçulmanas (Córdoba, Bagdá) eram centros de vanguarda mundial em medicina, tradução e urbanismo, iluminando a Idade Média enquanto a Europa feudal vivia ruralizada e iletrada (Gabarito A).\n3. Distratores: A, B, D e E atribuem ao Islã ignorância, isolamento ou destruição cultural que contradizem frontalmente as históricas realizações científicas e filosóficas árabes."], "As Cruzadas e o Renascimento Comercial dos Burgos": ["A partir do século XI, a Baixa Idade Média vivenciou transformações estruturais profundas: a expansão de terras cultiváveis, inovações técnicas agrícolas (arado de ferro / charrua, rotação trienal de culturas e atrelamento peitoral) provocaram o crescimento demográfico e o excedente populacional. Para canalizar a violência da nobreza sem terras, o Papa Urbano II convocou em 1095 a Primeira Cruzada: expedições militares e religiosas para reconquistar a 'Terra Santa' (Jerusalém) do domínio muçulmano. Embora tenham fracassado militarmente a longo prazo (Jerusalém permaneceu muçulmana sob Saladino), as Cruzadas provocaram um impacto econômico colossal: reabriram o Mar Mediterrâneo ao comércio europeu, romperam o isolamento feudal e colocaram a Europa em contato com as luxuosas mercadorias orientais (especiarias, sedas e perfumes). Surgiu o 'Renascimento Comercial e Urbano': feiras itinerantes de comércio (como as de Champagne), rotas comerciais no Mar do Norte (Liga Hanseática) e o crescimento dos 'Burgos' (cidades fortificadas). Habitantes dos burgos — os 'burgueses' — organizaram corporações de ofício e guildas, comprando Cartas de Franquia dos nobres para conquistar autonomia urbana e cunhar moedas.", ["1095: Papa Urbano II no Concílio de Clermont convoca a Primeira Cruzada sob o lema 'Deus o quer!'", "Renascimento Comercial: Reabertura do Mediterrâneo liderada por navegadores e mercadores de Veneza e Gênova", "Burgos e Burguesia: Surgimento das cidades medievais autônomas e de um novo grupo social dedicado ao comércio e ao dinheiro", "Corporações de Ofício: Associações de mestres artesãos que regulavam os preços, a qualidade e os salários das profissões urbanas", "Crise da Nobreza Feudal: O renascimento da moeda e das cidades enfraqueceu as relações servis e fortaleceu o poder dos reis"], "O termo 'burguês' nasceu aqui: originalmente, significava apenas o habitante do burgo (cidade murada); com o passar dos séculos, passou a designar o comerciante e financista que acumulava capital monetário e que viria a desafiar a nobreza feudal.", "Trecho da Carta de Franquia outorgada aos habitantes da cidade de Saint-Omer (França, 1127):\n\n'Eu, Guilherme, pela graça de Deus conde de Flandres, concedo aos burgueses de Saint-Omer a isenção de todas as corveias servis e taxas feudais sobre seus comércios, bem como o direito de elegerem seus próprios magistrados para julgarem seus litígios segundo o costume mercantil da cidade.'\n\n(Fonte: Cartulaire de Saint-Omer, Século XII).", "A concessão de Cartas de Franquia aos burgos medievais no século XII representou um processo de:", ["restauração integral da servidão coletiva compulsória sobre todas as populações mercantis urbanas.", "autonomia jurídica e tributária dos centros urbanos frente à dominação tradicional dos senhores feudais.", "fechamento permanente de feiras e portos para impedir a circulação de moedas de prata e ouro.", "subordinação absoluta dos novos artesãos fabris ao regime de escravidão clássica das lavouras.", "proibição aos comerciantes de elegerem seus próprios juízes e de exercerem qualquer ofício livre."], 1, "Passo a passo:\n1. Fonte e contexto: A Carta de Franquia de 1127 documenta a conquista da liberdade jurídica pelos burgueses mediante pagamento ao senhor feudal.\n2. Raciocínio: As cartas de privilégio libertavam as cidades das amarras feudais, permitindo aos burgueses criar tribunais de comércio, erguer muralhas de defesa e comercializar sem pagar corveias servis (Gabarito B).\n3. Distratores: A e D contrariam a emancipação do comércio; C e E dizem o exato oposto dos direitos outorgados no texto."], "Crise do Século XIV: Peste Negra e Fome": ["O século XIV foi o período de maior tragédia e convulsão da Idade Média, abalando até as fundações a ordem feudal através da tríade catastrófica: a Fome, a Peste e a Guerra. Entre 1315 e 1317, a 'Grande Fome' decorrente de alterações climáticas e esgotamento dos solos matou milhões de camponeses. A partir de 1347, navios mercantes genoveses vindos do Mar Negro trouxeram a Peste Negra (peste bubônica, provocada pela bactéria Yersinia pestis e transmitida por pulgas de ratos que infestavam cidades e feiras imundas). A pandemia varreu o continente entre 1347 e 1351, exterminando entre um terço e metade de toda a população da Europa. Sem mão de obra, os senhores feudais sobreviventes tentaram intensificar a exploração servil, deflagrando sangrentas revoltas camponesas: as 'Jacqueries' na França (1358) e a Revolta de Wat Tyler na Inglaterra (1381). Para agravar o colapso, França e Inglaterra enfrentaram-se na prolongada Guerra dos Cem Anos (1337-1453), conflito feudal pela coroa francesa que consolidou o sentimento nacional e celebrou a heroína camponesa Joana d'Arc.", ["Peste Negra (1347-1351): Epidemia de peste bubônica que matou mais de 25 milhões de europeus em poucos anos", "Transmissão e Ausência de Higiene: Pulgas de ratos proliferando em cidades medievais superlotadas e sem saneamento", "Mentalidade Religiosa Fatalista: A peste era interpretada como castigo divino, gerando procissões de flagelantes e massacres de judeus (bodes expiatórios)", "Jacqueries (1358): Insurreições camponesas francesas violentas contra os castelos dos nobres feudais", "Guerra dos Cem Anos (1337-1453): Conflito bélico prolongado que enfraqueceu a cavalaria nobre e abriu caminho para a centralização monárquica"], "A crise do século XIV foi o golpe de misericórdia no feudalismo tradicional: a escassez de braços valorizou o trabalho do camponês livre sobrevivente, forçando os senhores feudais a aceitar pagamentos em dinheiro e permitindo aos reis centralizarem o poder monárquico nacional.", "Relato do escritor florentino Giovanni Boccaccio na introdução da obra 'Decamerão' (1348):\n\n'Nasciam aos doentes, na virilha ou debaixo das axilas, certos inchaços que atingiam o tamanho de um ovo comum, aos quais o vulgo chamava de bubões; e logo essa peste mortal começava a se propagar em todas as direções. E para a cura dessas doenças de nada valiam conselhos de médicos nem virtude de qualquer mezinha; a violência da enfermidade era tamanha que o pai abandonava o filho e o marido à mulher nos leitos de morte.'\n\n(Fonte: Giovanni Boccaccio, Decamerão, Introdução, 1348).", "A narrativa de Giovanni Boccaccio sobre a devastação causada pela Peste Negra em Florença em 1348 ilustra:", ["a eficácia dos antibióticos e das medidas hospitalares que debelaram a bactéria em poucas semanas.", "a comprovação científica de que a peste fora inoculada intencionalmente por laboratórios industriais renascentistas.", "o desespero humanitário, a desagregação dos laços sociais e a mortandade em massa que abalaram as estruturas da Europa medieval.", "a celebração festiva da peste como uma oportunidade voluntária para a redistribuição pacífica das terras feudais.", "a união solidária inabalável de todas as famílias nobres que permaneceram juntas nos hospitais comunitários."], 2, "Passo a passo:\n1. Fonte e contexto: Boccaccio foi testemunha ocular da Peste em Florença e registrou a dissolução do tecido moral e familiar sob o pavor do contágio.\n2. Raciocínio: A Peste Negra desestruturou a demografia europeia, matando milhões de pessoas e gerando pânico cósmico, esvaziamento dos campos e a crise terminal do feudalismo (Gabarito C).\n3. Distratores: A e C são anacronismos absurdos (antibióticos e indústrias só surgiram séculos depois); D e E contrariam o terror fúnebre descrito por Boccaccio ('o pai abandonava o filho')."], "Fontes Históricas e Métodos de Análise": ["A História é a ciência que investiga as ações humanas no tempo e no espaço. Para construir o conhecimento histórico, o historiador não trabalha com suposições vazias ou 'verdades absolutas', mas opera por meio da crítica rigorosa das Fontes Históricas — vestígios, pegadas e testemunhos deixados pelas sociedades passadas. A historiografia contemporânea superou a visão positivista tradicional do século XIX (que considerava como fontes unicamente os documentos escritos oficiais produzidos pelo Estado). Hoje, considera-se fonte histórica qualquer manifestação da atividade humana: fontes escritas (leis, jornais, cartas, diários), fontes visuais (pinturas, fotografias, charges, grafites), fontes materiais e arqueológicas (utensílios, cerâmicas, ossadas, monumentos), fontes orais (relatos orais, canções, entrevistas) e fontes digitais. Nenhuma fonte histórica fala por si mesma: o historiador deve submetê-la à crítica interna e externa, investigando sua autoria, a intencionalidade do autor, o contexto social e as relações de poder que a produziram.", ["Alargamento da Noção de Fonte: Inclusão de fotos, relatos orais, patrimônio material, músicas e vestígios cotidianos", "Superação do Positivismo: O documento oficial estatal não é neutro nem sinônimo incontestável de verdade", "Crítica da Fonte: Análise metódica de quem produziu o documento, para quem, em qual suporte e com quais intenções", "Marc Bloch: 'O historiador parece-se com o ogro da lenda: onde fareja carne humana, sabe que ali está a sua presa'", "História como Diálogo: Construção dialética entre os questionamentos do presente e os vestígios herdados do passado"], "O historiador não é um juiz que condena ou absolve personagens: seu ofício é compreender e explicar os processos humanos em sua complexidade, analisando os conflitos e os pontos de vista contraditórios das fontes.", "Reflexão do historiador francês Marc Bloch na obra 'Apologia da História' (1949):\n\n'Mesmo os testemunhos mais aparentemente claros e voluntários não devem ser aceitos como verdades acabadas. Os textos ou os monumentos arqueológicos não falam senão quando sabemos interrogá-los. [...] Toda fonte é um produto humano e traz consigo as marcas das paixões, dos interesses e dos silêncios da época que a gerou.'\n\n(Fonte: Marc Bloch, Apologia da História ou o Ofício de Historiador, Zahar).", "A concepção de análise histórica apresentada por Marc Bloch estabelece que o trabalho do historiador contemporâneo deve se pautar pela:", ["aceitação ingênua e literal de tudo o que estiver registrado em documentos oficiais de arquivo.", "rejeição completa de quaisquer vestígios materiais em favor da imaginação ficcional puramente subjetiva.", "subordinação da pesquisa acadêmica às ordens dogmáticas estabelecidas pela propaganda partidária estatal.", "postura crítica e investigativa perante os documentos, interrogando o contexto, as intencionalidades e os silêncios das fontes.", "eliminação de documentos orais e visuais para pesquisar exclusivamente pergaminhos medievais em latim."], 3, "Passo a passo:\n1. Fonte e contexto: Marc Bloch, cofundador da Escola dos Annales, refletiu sobre a epistemologia da história enquanto lutava na Resistência Francesa.\n2. Raciocínio: As fontes não trazem a verdade pronta; elas devem ser interrogadas com método crítico para desvelar o que dizem e também o que deliberadamente ocultam (Gabarito D).\n3. Distratores: A expressa o positivismo ingênuo superado; C, D e E negam o método científico da história e limitam arbitrariamente os tipos de fontes."], "Tempo Histórico, Periodização e Anacronismo": ["O tempo histórico difere do tempo cronológico (o mero fluir dos relógios e calendários): ele é medido pelas continuidades e rupturas nas relações sociais, políticas, econômicas e culturais. O historiador Fernand Braudel formulou o conceito revolucionário das 'Três Durações do Tempo': o tempo curto (o evento factual imediato e efêmero, como uma batalha ou eleição); o tempo médio (a conjuntura de ciclos econômicos de décadas); e a 'Longa Duração' (as estruturas profundas, mentalidades e modos de viver que mudam de forma quase imperceptível ao longo de séculos). A divisão tradicional da História em quatro idades (Antiga, Média, Moderna e Contemporânea) é uma convenção didática eurocêntrica que toma acontecimentos europeus como marcos universais. O maior pecado contra a ciência histórica é o 'Anacronismo': o erro metodológico de projetar valores, conceitos, leis e julgamentos morais do nosso presente sobre as pessoas e sociedades do passado.", ["Fernand Braudel e as Três Durações: Tempo curto (evento), tempo médio (conjuntura) e longa duração (estrutura)", "Anacronismo: Erro metodológico de julgar o passado a partir dos parâmetros e tecnologias exclusivas do presente", "Periodização Tradicional Eurocêntrica: Marcos fixados a partir de eventos europeus (queda de Roma, queda de Constantinopla, Revolução Francesa)", "Tempo Histórico versus Cronológico: O tempo das sociedades marcado por ritmos desiguais, permanências e rupturas", "Culturas com Noções Distintas de Tempo: Noções lineares (tradição judaico-cristã e ocidental) versus circulares/cósmicas (povos indígenas e orientais)"], "Cuidado redobrado com o anacronismo no ENEM: Evite julgar homens do passado com valores éticos de hoje, mas também NÃO confunda combate ao anacronismo com relativismo moral: a escravidão e o genocídio eram contestados e reconhecidos como crimes pelos próprios contemporâneos oprimidos que foram massacrados.", "Reflexão do historiador francês Lucien Febvre em 'O Problema da Incredulidade no Século XVI':\n\n'O pecado dos pecados, o pecado imperdoável e mortal do historiador é o anacronismo. Nada mais fácil e nada mais enganoso do que aplicar aos homens de outros séculos as nossas categorias mentais, os nossos preconceitos morais e os conhecimentos que a humanidade demorou séculos para acumular.'\n\n(Fonte: Lucien Febvre, Le Problème de l'incroyance au XVIe siècle).", "A advertência formulada por Lucien Febvre define o anacronismo como uma armadilha intelectual que consiste em:", ["analisar os fatos passados à luz de rigorosa pesquisa empírica em fontes primárias de arquivos históricos.", "reconhecer que a linha do tempo cronológica foi uma invenção sagrada do profeta bíblico Moisés.", "adotar o método da longa duração formulado pelos historiadores da Escola dos Annales.", "recusar a utilização de computadores e internet para a catalogação de acervos arquivísticos digitais.", "projetar anacronicamente valores morais, mentalidades e categorias do presente para julgar as ações de indivíduos de outras épocas."], 4, "Passo a passo:\n1. Fonte e contexto: Lucien Febvre, cofundador dos Annales, combateu o hábito de anacronismo que distorce a compreensão do passado.\n2. Raciocínio: Anacronismo é colocar uma pessoa, ideia ou objeto fora de seu tempo histórico real, exigindo de sujeitos passados pensamentos que só surgiram com a modernidade posterior (Gabarito E).\n3. Distratores: A e D descrevem práticas corretas do método historiográfico; C e E trazem formulações sem relação com a definição conceitual de anacronismo."], "Escola dos Annales e a História Nova": ["Fundada na França em 1929 pelos historiadores Marc Bloch e Lucien Febvre com a célebre revista 'Annales d'Histoire Économique et Sociale', a Escola dos Annales protagonizou a mais revolucionária transformação da ciência histórica no século XX. Os Annales rebelaram-se contra a escola metódica positivista tradicional, que se limitava à narrativa factual descritiva de eventos militares e diplomáticos centrados em 'grandes homens' heróicos (reis, generais e papas). A Escola dos Annales propôs a 'História-Problema' (a história nasce da formulação de perguntas e problemas teóricos pelo pesquisador), a Interdisciplinaridade (o diálogo indispensável da História com a Geografia, Economia, Sociologia, Antropologia e Linguística) e o alargamento absoluto dos temas de pesquisa. Desenvolveram-se sucessivas gerações: a segunda geração com Fernand Braudel e a longa duração geopolítica; e a terceira e quarta gerações (a 'História Nova', com Jacques Le Goff, Georges Duby e Philippe Ariès), inaugurando a História das Mentalidades, a história das mulheres, das crianças, da morte, do medo, do corpo e da vida cotidiana.", ["1929: Fundação da Revista dos Annales por Marc Bloch e Lucien Febvre", "Superação da 'História Batalha': Rejeição da narrativa de fatos heróicos isolados e datas decoradas sem reflexão social", "História-Problema: A pesquisa histórica é orientada por hipóteses e problemas conceituais levantados no presente", "Interdisciplinaridade: Fusão de metodologias da História com a Antropologia, Demografia, Geografia e Sociologia", "História das Mentalidades e do Cotidiano: Estudo de grupos historicamente silenciados (camponeses, mulheres, crianças e minorias)"], "O legado dos Annales mudou o próprio formato do ENEM: não se cobram datas descontextualizadas ou nomes de batalhas decoradas; o ENEM cobra processos estruturais, vida material, relações de gênero e a história social dos trabalhadores e marginalizados.", "Reflexão do historiador medievalista Jacques Le Goff na obra 'A História Nova' (1978):\n\n'A história não é mais apenas a narrativa dos acontecimentos políticos e das proezas dos príncipes. A história hoje interessa-se pelos homens anônimos, pelos camponeses silenciosos que araram a terra, pela alimentação dos operários, pelos medos coletivos e pela forma como as sociedades representavam a morte e os sonhos.'\n\n(Fonte: Jacques Le Goff, A História Nova, Martins Fontes).", "A abordagem historiográfica associada à Escola dos Annales e à 'História Nova' revolucionou os estudos históricos ao:", ["ampliar o campo temático da história para abarcar a cultura material, o cotidiano, as mentalidades e os sujeitos anônimos.", "restringir a pesquisa histórica aos atos heróicos e biografias laudatórias de generais militares vitoriosos.", "adotar o modelo positivista do século XIX que considerava válidos unicamente os decretos régios absolutistas.", "afirmar que a economia e as relações sociais não possuem nenhuma relevância para a compreensão das civilizações.", "proibir o diálogo da ciência histórica com a sociologia, a geografia humana e a antropologia cultural."], 0, "Passo a passo:\n1. Fonte e contexto: Jacques Le Goff, líder da 3ª geração dos Annales, resume a renovação epistemológica da História Nova.\n2. Raciocínio: Ao romper com o elitismo da história dos generais, os historiadores passaram a valorizar a trajetória das pessoas comuns, as sensibilidades, a comida, a morte e o imaginário social (Gabarito A).\n3. Distratores: A e C descrevem a historiografia positivista tradicional combatida pelos Annales; D e E negam as contribuições centrais da interdisciplinaridade e da história socioeconômica."], "Memória Coletiva, Patrimônio Material e Imaterial": ["A Memória e a História são campos complementares, mas distintos. A Memória é viva, afetiva, seletiva e ligada à identidade subjetiva de grupos sociais (que escolhem o que lembrar e o que esquecer); a História é a reconstrução crítica, analítica e metodológica do passado sustentada por fontes e procedimentos científicos. A memória coletiva corporifica-se nos Lugares de Memória (conceito formulado pelo historiador Pierre Nora): museus, monumentos públicos, cemitérios, datas comemorativas e sítios tombados. A preservação desses legados cabe às políticas públicas de Patrimônio Cultural. O patrimônio divide-se em Patrimônio Material (bens tangíveis com valor arquitetônico, histórico e arqueológico, como o Centro Histórico de Ouro Preto, Olinda e o Cais do Valongo) e Patrimônio Imaterial (saberes, tradições orais, celebrações, ofícios tradicionais e expressões vivas, como o Frevo pernambucano, o Círio de Nazaré e a Roda de Capoeira). No Brasil, o IPHAN (fundado em 1937 com a colaboração de Mário de Andrade e Rodrigo Melo Franco de Andrade) é a agência estatal encarregada de inventariar, tombar e salvaguardar esses tesouros coletivos.", ["História versus Memória: A memória é viva e seletiva; a história é análise crítica metódica e contextualizada", "Pierre Nora e os 'Lugares de Memória': Espaços físicos ou simbólicos onde a identidade coletiva se cristaliza", "Patrimônio Material: Monumentos, centros históricos, ruínas e sítios arqueológicos tombados pelo Estado", "Patrimônio Imaterial: Saberes, celebrações festivas, modos de fazer e tradições registradas pelo IPHAN", "Disputas de Memória: Derrubadas de estátuas de escravocratas e colonizadores no século XXI como revisão crítica da história pública"], "A derrubada de estátuas de figuras ligadas ao tráfico de escravizados e colonizadores (como Borba Gato em SP ou Edward Colston na Inglaterra) não é 'apagar a história'; é uma disputa de memória pública cidadã sobre quem a sociedade contemporânea decide homenagear em praça pública.", "Artigo 216 da Constituição da República Federativa do Brasil (1988):\n\n'Constituem patrimônio cultural brasileiro os bens de natureza material e imaterial, tomados individualmente ou em conjunto, portadores de referência à identidade, à ação, à memória dos diferentes grupos formadores da sociedade brasileira, nos quais se incluem: as formas de expressão; os modos de criar, fazer e viver; as criações científicas, artísticas e tecnológicas; as obras, objetos, documentos, edificações e demais espaços destinados às manifestações artístico-culturais.'\n\n(Fonte: Constituição Federal do Brasil de 1988).", "A definição de patrimônio cultural estabelecida pelo Artigo 216 da Constituição de 1988 inovou ao:", ["restringir o conceito de patrimônio unicamente aos palácios faustosos erguidos pela nobreza imperial europeia.", "reconhecer a legitimidade das manifestações imateriais e os modos de viver e criar das diversas matrizes formadoras do povo brasileiro.", "determinar a destruição de arquivos orais para privilegiar unicamente monumentos esculpidos em bronze e mármore.", "proibir que comunidades indígenas e quilombolas tenham suas tradições registradas como patrimônio da Nação.", "transferir a custódia de todos os museus públicos federais para corporações bancárias privadas transnacionais."], 1, "Passo a passo:\n1. Fonte e contexto: O artigo 216 da CF/88 superou a antiga visão elitista de patrimônio que só protegia 'a grande arquitetura de pedra e cal'.\n2. Raciocínio: Ao incorporar os 'modos de criar, fazer e viver' e a pluralidade dos grupos formadores (indígenas, afro-brasileiros, imigrantes, classes trabalhadoras), o texto democratizou o conceito de patrimônio nacional (Gabarito B).\n3. Distratores: A e C descrevem a antiga visão patrimonialista aristocrática superada; D e E contrariam os princípios garantistas e públicos da Constituição de 1988."], "Negacionismo Histórico e Usos Políticos do Passado": ["No século XXI, a historiografia enfrenta uma grave ameaça à verdade factual e à memória cidadã: o Negacionismo Histórico e as ondas de revisionismo ideológico obscurantista. O negacionismo não se confunde com o legítimo revisionismo historiográfico acadêmico (que é o processo científico normal de reavaliar hipóteses e teses a partir da descoberta de novas fontes documentais ou novas abordagens metodológicas). O Negacionismo, por outro lado, é a rejeição deliberada, fraudulenta e militante de fatos históricos fartamente comprovados por montanhas de evidências documentais, testemunhais e materiais, quase sempre movida por interesses políticos autoritários, fanatismo religioso ou ódio racista. Exemplos trágicos de negacionismo incluem a negação do Holocausto nazista, a romantização e negação dos crimes da escravidão africana, a negação do massacre dos povos originários e o falseamento da ditadura civil-militar brasileira de 1964 (alegando que 'não houve ditadura' ou negando a tortura sistemática documentada pelo relatório da Comissão Nacional da Verdade em 2014). O ofício do historiador é fundamental para defender a memória coletiva e o direito à verdade.", ["Negacionismo versus Revisão Historiográfica: Negacionismo é fraude ideológica militante; revisão é metodologia científica normal", "Negação do Holocausto: Crime penal em vários países que tenta inocentar o nazismo de suas atrocidades industriais", "Falseamento da Ditadura Militar Brasileira: Tentativas de dourar o regime autoritário ocultando censura, assassinatos e torturas", "Comissão Nacional da Verdade (CNV, 2011-2014): Relatório público que documentou as graves violações de direitos humanos do Estado ditatorial", "Direito à Memória e à Verdade: Preceito internacional dos direitos humanos garantindo que crimes de lesa-humanidade não sejam esquecidos nem repetidos ('Para que não se esqueça, para que nunca mais aconteça!')"], "A expressão 'Para que não se esqueça, para que nunca mais aconteça' sintetiza o dever de memória: lembrar os crimes das ditaduras e do genocídio não é 'revanchismo', mas a única garantia ética de que tais atrocidades não se repitam no presente.", "Trecho do Relatório Final da Comissão Nacional da Verdade (CNV, Brasil, 2014):\n\n'A alegação de que as graves violações de direitos humanos praticadas na ditadura militar decorreram de excessos individuais isolados de alguns subordinados é categoricamente refutada pelas evidências. As torturas, execuções e desaparecimentos forçados foram fruto de uma política de Estado sistemática, concebida no topo da cadeia de comando das Forças Armadas. Reconhecer a verdade histórica não é alimentar o ódio; é vacinar a democracia contra a tentação do autoritarismo.'\n\n(Fonte: Relatório Final da Comissão Nacional da Verdade, Volume 1, Brasília, 2014).", "A apuração e divulgação das conclusões da Comissão Nacional da Verdade em 2014 teve como propósito fundamental:", ["ocultar os registros documentais da repressão para evitar que a população conheça as violências da ditadura.", "estabelecer que a censura governamental e a tortura constituíram práticas legítimas e indispensáveis para a ordem econômica.", "resgatar a verdade factual sobre os crimes do Estado autoritário, consolidando a memória coletiva e fortalecendo a ordem democrática.", "anular todos os julgamentos e exilar os membros das famílias dos desaparecidos políticos brasileiros.", "proibir que historiadores acadêmicos pesquisem documentos oficiais custodiados pelo Arquivo Nacional."], 2, "Passo a passo:\n1. Fonte e contexto: A Comissão Nacional da Verdade entregou seu relatório oficial em 2014 após ouvir testemunhas e cruzar milhares de arquivos da repressão.\n2. Raciocínio: Ao provar documentalmente que as torturas e mortes eram política de Estado planejada, a CNV combateu o negacionismo histórico, afirmando o direito inalienável da sociedade à verdade e à justiça (Gabarito C).\n3. Distratores: A, B, D e E descrevem medidas de censura e impunidade que representam exatamente o oposto do papel democrático e transparente da Comissão da Verdade."]};

var SUB = M.map(function(m){

  });
});

var uniq = function(a){ var s = {}; return a.filter(function(x){ return s[x.n] ? 0 : (s[x.n] = 1); }); };
var nz = function(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); };
var pad = function(n){ return String(n).padStart(2, "0"); };
var fmt = function(s){ return (s >= 3600 ? Math.floor(s / 3600) + ":" : "") + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60); };
var shuf = function(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.random() * (i + 1) | 0;
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
};

var pr = function(i){ return Math.round(100 * SUB[i].filter(function(x, j){ return D[i + "." + j]; }).length / SUB[i].length); };
var doneN = function(){ return Object.keys(D).filter(function(k){ return D[k]; }).length; };
var favN = function(){ return Object.keys(S.fav).filter(function(k){ return S.fav[k]; }).length; };
var ms = function(i){
  var a = 0, e = 0;
  SUB[i].forEach(function(x){
    var r = S.res[x.n];
    if(r){ a += r.a; e += r.e; }
  });
  return {a: a, e: e, t: a + e, p: a + e ? Math.round(100 * a / (a + e)) : 0};
};

var bar = function(p){ return '<div class="pb"><i data-w="' + p + '"></i></div>'; };
var ring = function(p){ return '<div class="rg"><svg viewBox="0 0 120 120"><circle class="r0" cx="60" cy="60" r="52"/><circle class="r1" cx="60" cy="60" r="52" data-ring="' + p + '"/></svg><b>' + p + '%</b></div>'; };
var go = function(p){ location.hash = "#/" + p; };
var bars = function(){
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      document.querySelectorAll("[data-w]").forEach(function(e){ e.style.width = e.dataset.w + "%"; });

};

}

function hl(){

    var x = SUB[cur.i][cur.j];

    var nm = Q.list[Q.k].n, ok = n == C[nm][6];

    q("#qs").textContent = "✔ " + Q.score;
  }
}

  var wr = n - Q.score;
  return '<div class="res a">' + ring(pc).replace('class="rg"', 'class="rg big"') + '<h1>' + (pc >= 70 ? 'Mandou bem demais! 🎉' : pc >= 40 ? 'Bom rendimento! 💪' : 'Vale a pena revisar! 📚') + '</h1><p class="mu">' + Q.score + ' de ' + n + ' acertos em ' + fmt(Q.sec) + ' · ' + Q.title + '</p><div class="row" style="justify-content:center">' + (wr ? '<button class="bt" onclick="redo()">Refazer as ' + wr + ' erradas</button>' : '') + '<a class="bt gh" href="#/sim">Novo simulado</a><a class="bt gh" href="#/st">Ver estatísticas</a></div></div><div class="bx a" style="--i:1"><h2>Desempenho por módulo</h2>' + Object.keys(by).map(function(m){
    return '<div class="mr hu" style="--h:' + (m * 24) + '"><span>' + IC[m] + ' ' + M[m].n + '</span>' + bar(100 * by[m].a / by[m].t) + '<small>' + by[m].a + '/' + by[m].t + '</small></div>';
  }).join('') + '</div>';
}

/* Flashcards */
function vFc(s){
  var sc = s === undefined || s === "" ? -1 : +s;
  if(!FC || FC.sc != sc) FC = {sc: sc, k: 0, f: 0, list: uniq(FLAT.filter(function(x){ return sc < 0 || x.i == sc; }))};
  return '<h1 class="a">🃏 Flashcards de Conceitos e Datas</h1><p class="a mu">Toque no cartão para virar e conferir os conceitos, personagens e datas mais cobrados.</p><div class="chs a"><a class="ch' + (sc < 0 ? ' on' : '') + '" href="#/fc">Todos os Módulos</a>' + M.map(function(m, i){
    return '<a class="ch' + (sc == i ? ' on' : '') + '" href="#/fc/' + i + '" title="' + m.n + '">' + IC[i] + '</a>';
  }).join('') + '</div><div id="fcx" class="a" style="--i:1">' + fcHtml() + '</div><div class="row fcb a" style="--i:2"><button class="bt gh" onclick="fcGo(-1)">← Anterior</button><button class="bt" onclick="flipFc()">Virar Cartão</button><button class="bt gh" onclick="fcGo(1)">Próximo →</button><button class="bt gh" onclick="fcShuf()">🔀 Embaralhar</button></div><p class="mu" style="text-align:center">Atalhos: ← → navega · Espaço vira o cartão</p>';
}

function fcHtml(){
  var x = FC.list[FC.k], c = C[x.n];
  return '<div class="fcnt">' + (FC.k + 1) + ' de ' + FC.list.length + '</div><div class="fcw"><div class="fcard' + (FC.f ? ' flip' : '') + '" onclick="flipFc()"><div class="face"><span class="bd ' + x.l + '">' + M[x.i].n + '</span><h2>' + x.n + '</h2><small class="mu">Toque para ver conceitos e marcos históricos</small></div><div class="face bk2"><b style="color:var(--ac);margin-bottom:6px">' + x.n + '</b><div style="font-size:13.5px">' + c[1].map(function(f){ return '<code>• ' + f + '</code>'; }).join('') + '</div></div></div></div>';
}

var fcGo = function(d){ FC.k = (FC.k + d + FC.list.length) % FC.list.length; FC.f = 0; q("#fcx").innerHTML = fcHtml(); };
var flipFc = function(){ FC.f ^= 1; q(".fcard").classList.toggle("flip", !!FC.f); };
var fcShuf = function(){ FC.list = shuf(FC.list); FC.k = 0; FC.f = 0; q("#fcx").innerHTML = fcHtml(); };

/* Timeline View */
var tlPeriod = "T";
function vTl(modFilter){
  var mF = modFilter === undefined || modFilter === "" ? -1 : +modFilter;
  var events = T.slice().sort(function(a, b){ return a.y - b.y; });
  if(mF >= 0){
    var sSet = new Set(SUB[mF].map(function(x){ return x.n; }));
    events = events.filter(function(e){ return sSet.has(e.s); });
  }
  if(tlPeriod == "ANT") events = events.filter(function(e){ return e.y < 476; });
  else if(tlPeriod == "MED") events = events.filter(function(e){ return e.y >= 476 && e.y < 1453; });
  else if(tlPeriod == "MOD") events = events.filter(function(e){ return e.y >= 1453 && e.y < 1789; });
  else if(tlPeriod == "CNT") events = events.filter(function(e){ return e.y >= 1789; });
  else if(tlPeriod == "BRA") events = events.filter(function(e){
    return e.y >= 1500 && (e.s.includes("Brasil") || e.s.includes("Vargas") || e.s.includes("República") || e.s.includes("Ditadura") || e.s.includes("Constituição") || e.s.includes("Canudos") || e.s.includes("Contestado") || e.s.includes("Vacina") || e.s.includes("Chibata") || e.s.includes("Abolicionista") || e.s.includes("Café") || e.s.includes("Independência") || e.s.includes("Capitanias") || e.s.includes("Quilombo") || e.s.includes("Conjuração"));
  });

  var periods = [["T", "Toda a História"], ["BRA", "História do Brasil"], ["ANT", "Antiguidade (< 476)"], ["MED", "Idade Média (476-1453)"], ["MOD", "Idade Moderna (1453-1789)"], ["CNT", "Contemporânea (1789+)"]];
  return '<h1 class="a">⏳ Linha do Tempo Interativa</h1><p class="a mu">Eixo cronológico com eventos cruciais de toda a matriz do ENEM. Clique em qualquer evento para ir diretamente ao assunto correspondente.</p><div class="chs a">' + periods.map(function(p){
    return '<button class="ch' + (tlPeriod == p[0] ? ' on' : '') + '" onclick="tlPeriod=\'' + p[0] + '\';render()">' + p[1] + '</button>';
  }).join('') + '</div><div class="tl-wrap a" style="--i:1">' + events.map(function(ev, k){
    var fIdx = FLAT.findIndex(function(f){ return f.n == ev.s; });
    var yrStr = ev.y < 0 ? Math.abs(ev.y) + ' a.C.' : (ev.y <= 1000 ? ev.y + ' d.C.' : String(ev.y));
    var link = fIdx >= 0 ? 'go(\'s/' + FLAT[fIdx].i + '/' + FLAT[fIdx].j + '\')' : '';
    return '<div class="tl-item a" style="--i:' + (k % 12) + '" onclick="' + link + '"><div class="tl-dot"></div><div class="tl-year">' + yrStr + '</div><div class="tl-card"><h4>' + ev.e + '</h4><p>📌 Assunto: <b>' + ev.s + '</b></p></div></div>';
  }).join('') + '</div>';
}

/* Mindmap (Trilha de Causas e Consequências) */
function vMp(){
  return '<h1 class="a">🗺️ Trilha de Causas e Consequências</h1><p class="a mu">A História no ENEM não é uma lista de fatos isolados: é um encadeamento dinâmico de causas, processos e consequências. Clique nos assuntos para explorar.</p><div class="mm-grid a">' + MINDMAP.map(function(edge, k){
    var f1 = FLAT.findIndex(function(f){ return f.n == edge.from; });
    var f2 = FLAT.findIndex(function(f){ return f.n == edge.to; });
    var c1 = f1 >= 0 ? 'go(\'s/' + FLAT[f1].i + '/' + FLAT[f1].j + '\')' : '';
    var c2 = f2 >= 0 ? 'go(\'s/' + FLAT[f2].i + '/' + FLAT[f2].j + '\')' : '';
    return '<div class="mm-card a" style="--i:' + (k % 12) + '"><div class="mm-flow"><span onclick="' + c1 + '">' + edge.from + '</span> ➜ <span onclick="' + c2 + '">' + edge.to + '</span></div><p>' + edge.desc + '</p></div>';
  }).join('') + '</div>';
}

/* Glossary View */
var glQ = "";
function vGl(){
  return '<h1 class="a">📖 Glossário Histórico do ENEM</h1><p class="a mu">Mais de 500 conceitos, termos essenciais, personagens e eventos com definições sintéticas e precisas.</p><div class="srch a"><input type="search" placeholder="Filtrar por conceito, personagem ou assunto..." value="' + glQ + '" oninput="glQ=this.value;q(\'#glx\').innerHTML=glItems();" autocomplete="off"></div><div id="glx" class="a">' + glItems() + '</div>';
}

function glItems(){
  var qStr = nz(glQ.trim());
  var filtered = GLOSSARY.filter(function(g){ return !qStr || nz(g.t + " " + g.d + " " + g.s).includes(qStr); });
  return filtered.length ? filtered.slice(0, 100).map(function(g, k){
    var fIdx = FLAT.findIndex(function(f){ return f.n == g.s; });
    var link = fIdx >= 0 ? 'href="#/s/' + FLAT[fIdx].i + '/' + FLAT[fIdx].j + '"' : '';
    var safeT = g.t.replace(/'/g, "\\'");
    var safeD = g.d.replace(/'/g, "\\'");
    return '<div class="gl-item a" style="--i:' + (k % 12) + '"><div><h4>' + g.t + '</h4><p>' + g.d + '</p><small>Assunto: <a ' + link + ' style="color:var(--ac);font-weight:600">' + g.s + '</a></small></div><button class="ib" onclick="copyTxt(\'' + safeT + ': ' + safeD + '\', this)" title="Copiar definição">📋 Copiar</button></div>';
  }).join('') + (filtered.length > 100 ? '<p class="mu" style="text-align:center">Exibindo os primeiros 100 termos de ' + filtered.length + '. Refine a busca acima.</p>' : '') : '<p class="mu">Nenhum termo encontrado para "' + glQ + '".</p>';
}

function copyTxt(txt, btn){
  navigator.clipboard.writeText(txt).then(function(){
    var old = btn.textContent;
    btn.textContent = "✓ Copiado!";
    setTimeout(function(){ btn.textContent = old; }, 1800);
  }).catch(function(){});
}

/* Common Traps View */
function vEr(){
  return '<h1 class="a">⚠️ Pegadinhas Clássicas do ENEM</h1><p class="a mu">Confusões conceituais, anacronismos e armadilhas recorrentes que o examinador do ENEM costuma usar nos distratores:</p><div class="a">' + TRAPS.map(function(t, k){
    return '<div class="trap-card a" style="--i:' + k + '"><h3>⚡ ' + t.t + '</h3><p>' + t.d + '</p></div>';
  }).join('') + '</div>';
}

/* Statistics View */
function vSt(){
  var A = 0, E = 0;
  Object.values(S.res).forEach(function(r){ A += r.a; E += r.e; });
  var T_tot = A + E;
  var cs = [
    ["✅", doneN() + "/" + FLAT.length, "assuntos concluídos"],
    ["🎯", T_tot ? Math.round(100 * A / T_tot) + "%" : "—", "de acerto geral"],
    ["✔", A, "questões certas"],
    ["✘", E, "questões erradas"],
    ["⏱", fmt(S.t), "tempo total de estudo"],
    ["📝", S.sims.length, "simulados realizados"]
  ];
  return '<h1 class="a">📊 Estatísticas e Rendimento</h1><div class="g3">' + cs.map(function(c, k){
    return '<div class="bx stat a" style="--i:' + k + '"><span>' + c[0] + '</span><b>' + c[1] + '</b><small>' + c[2] + '</small></div>';
  }).join('') + '</div><h2 class="a">Acertos e erros por módulo</h2><div class="bx a">' + M.map(function(m, i){
    var s = ms(i);
    return '<div class="mr"><span>' + IC[i] + ' ' + m.n + '</span><div class="sb"><i class="g1" data-w="' + (s.t ? 100 * s.a / s.t : 0) + '"></i><i class="e1" data-w="' + (s.t ? 100 * s.e / s.t : 0) + '"></i></div><small>' + (s.t ? s.a + ' certas · ' + s.e + ' erradas · ' + s.p + '%' : '—') + '</small></div>';
  }).join('') + '</div><h2 class="a">Histórico dos últimos simulados</h2>' + (S.sims.length ? '<div class="bx a">' + S.sims.map(function(x){
    return '<div class="mr2"><span>' + new Date(x.d).toLocaleDateString("pt-BR") + ' · ' + x.t + '</span><b>' + x.s + '/' + x.n + ' (' + Math.round(100 * x.s / x.n) + '%)</b><small>' + fmt(x.sec) + '</small></div>';
  }).join('') + '</div>' : '<p class="mu">Nenhum simulado registrado. Inicie pelo menu Simulado.</p>') + '<button class="bt gh" onclick="rst()">Zerar estatísticas</button>';
}

function rst(){
  if(confirm("Deseja zerar acertos, erros, histórico de simulados e cronômetro? Seus assuntos concluídos e favoritos serão mantidos.")){
    S.res = {}; S.wrong = {}; S.sims = []; S.t = 0; sv(); render();
  }
}

/* Erros pendentes e Favoritos */
function vRv(){
  var l = uniq(FLAT).filter(function(x){ return S.wrong[x.n]; });
  return '<h1 class="a">🔁 Revisão de Erros Pendentes</h1>' + (l.length ? '<p class="a mu">Assuntos em que você errou a última questão respondida. Acertar novamente remove da lista de revisão.</p><div class="row a"><button class="bt" onclick="startRev()">▶ Refazer as ' + l.length + ' questões erradas</button></div>' + l.map(row).join('') : '<div class="bx empty a">🎉<p>Nenhum erro pendente! Você acertou todas as questões tentadas recentemente.</p><a class="bt" href="#/sim">Fazer novo simulado</a></div>');
}

function vFv(){
  var l = FLAT.filter(function(x){ return S.fav[x.i + "." + x.j]; });
  return '<h1 class="a">⭐ Assuntos Favoritos</h1>' + (l.length ? l.map(row).join('') : '<div class="bx empty a">⭐<p>Toque na estrela de qualquer assunto para guardá-lo nesta lista de consulta rápida.</p><a class="bt" href="#/">Explorar módulos</a></div>');
}

/* Main Router */
function render(){
  var p = location.hash.replace(/^#\/?/, "").split("/"), v = p[0];
  view = v;
  st.q = null;
  var o;
  if(v == "m") o = vMod(+p[1]);
  else if(v == "s"){ cur = {i: +p[1], j: +p[2]}; o = vSub(cur.i, cur.j); }
  else if(v == "sim") o = vSim();
  else if(v == "q") o = vQ();
  else if(v == "fc") o = vFc(p[1]);
  else if(v == "tl") o = vTl(p[1]);
  else if(v == "mp") o = vMp();
  else if(v == "gl") o = vGl();
  else if(v == "er") o = vEr();
  else if(v == "st") o = vSt();
  else if(v == "rv") o = vRv();
  else if(v == "fv") o = vFv();
  else { view = ""; o = vHome(); }

  if(o == null) return;
  q("#app").innerHTML = o;
  bars();
  var act = ["m", "s", ""].includes(view) ? "" : view == "q" ? "sim" : view;
  document.querySelectorAll("nav a").forEach(function(a){ a.classList.toggle("on", a.dataset.r == act); });
  scrollTo(0, 0);
}

function th(){
  var d = document.documentElement;
  var dark = d.dataset.theme ? d.dataset.theme == "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme = dark ? "light" : "dark";
  d.dataset.theme = S.theme;
  sv();
}
if(S.theme) document.documentElement.dataset.theme = S.theme;

/* Stopwatch */
var tick = function(){
  var e = q("#tm");
  if(e) e.textContent = (run ? "⏸ " : "⏱ ") + fmt(S.t);
  var t = q("#qt");
  if(t && Q && Q.k < Q.list.length) t.textContent = "⏱ " + fmt(Math.floor((Date.now() - Q.t0) / 1000));
};
function tmT(){ run = !run; tick(); }
setInterval(function(){
  if(run){ S.t++; if(S.t % 5 == 0) sv(); }
  tick();
}, 1000);

/* Keyboard Shortcuts */
addEventListener("keydown", function(e){
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){
    if(e.key == "Escape") e.target.blur();
    return;
  }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key;
  if(k == "/"){
    var s = q("#sq");
    if(s){ e.preventDefault(); s.focus(); }
    return;
  }
  var oi = k.length == 1 && "abcde".includes(k.toLowerCase()) ? "abcde".indexOf(k.toLowerCase()) : "12345".indexOf(k);
  if((view == "s" || view == "q") && oi >= 0 && k.length == 1){
    pick(oi);
    return;
  }
  if(k == "ArrowRight"){
    if(view == "s") navS(1);
    else if(view == "q" && Q && Q.sel != null) nextQ();
    else if(view == "fc") fcGo(1);
  } else if(k == "ArrowLeft"){
    if(view == "s") navS(-1);
    else if(view == "fc") fcGo(-1);
  } else if(k == " " && view == "fc"){
    e.preventDefault(); flipFc();
  } else if(k == "Enter" && view == "q" && Q && Q.sel != null){
    nextQ();
  } else if(k == "Escape" && view != ""){
    go("");
  }
});

addEventListener("pagehide", sv);
addEventListener("hashchange", render);
render();
tick();
</script>
</body>
</html>
