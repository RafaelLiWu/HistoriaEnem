<style>

    --hi:#1E293B;
    --ht:#93C5FD;
    --ln:#1F2937;
    --gl:#111827;
    --A:#F87171;
    --M:#FBBF24;
    --B:#94A3B8;
    --ok:#4ADE80;

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{

}
body::before{

}
h1,h2,h3,.lg,.bt,.bd,.nm,.rg b,.stat b,.ch{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
h1{font-size:clamp(24px,4.5vw,36px);line-height:1.15;margin:6px 0 10px;letter-spacing:-.02em}
h2{font-size:19px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
a{color:inherit;text-decoration:none}

header{

.sp{flex:1}
.ib{

}
.ib:hover{border-color:var(--ac)}.ib:active{transform:scale(.95)}
.w{max-width:1120px;margin:0 auto;padding:18px 16px}
.mu{color:var(--mu)}.k{font-size:13px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.a{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.hero{

  gap:22px;
  align-items:center;
  flex-wrap:wrap;
  background:var(--cd);
  border:1.5px solid var(--ln);

  padding:22px;

}

.rg{position:relative;width:118px;height:118px;flex:none}

.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.r0,.r1{fill:none;stroke-width:10}
.r0{stroke:var(--ln)}
.r1{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bt{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1.5px solid var(--ac);
  background:var(--ac);
  color:var(--bt);
  border-radius:99px;
  padding:9px 18px;
  font-weight:700;
  font-size:13.5px;
  cursor:pointer;
  transition:transform .15s,box-shadow .2s;
}
.bt:hover{box-shadow:0 4px 0 var(--ht);transform:translateY(-2px)}
.bt:active{transform:none;box-shadow:none}
.bt.gh{background:var(--cd);color:var(--tx);border-color:var(--ln)}
.bt.gh:hover{border-color:var(--ac);box-shadow:0 4px 0 var(--ln)}
.srch input{
  width:100%;
  margin:18px 0 4px;
  padding:12px 16px;
  border-radius:14px;
  border:1.5px solid var(--ln);
  background:var(--cd);
  color:var(--tx);
  font:inherit;
  transition:border-color .2s;
}
.srch input:focus{
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent);
}
.chs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.ch{
  border:1.5px solid var(--ln);
  background:var(--cd);
  border-radius:99px;
  padding:6px 14px;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  transition:all .2s;
}
.ch.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cd,.hu{--c:hsl(var(--h,225) 75% var(--lm))}
.cd{
  position:relative;
  background:var(--cd);
  border:1.5px solid var(--ln);
  border-radius:16px;
  padding:18px;
  cursor:pointer;
  box-shadow:var(--sh);
  transition:transform .2s,box-shadow .2s,border-color .2s;
  overflow:hidden;
}
.cd::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.cd:hover{transform:translate(-2px,-4px);border-color:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 30%,var(--ln))}
.ci{
  width:46px;
  height:46px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:23px;
  background:color-mix(in srgb,var(--c) 16%,transparent);
  margin-bottom:8px;
}
.ci.big{width:64px;height:64px;font-size:32px;flex:none}
.cd h3{margin:8px 0 4px;font-size:16.5px;line-height:1.25}
.cd p{color:var(--mu);font-size:13.5px;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ft{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mu);margin-bottom:6px}
.pb{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}
.pb i{display:block;height:100%;width:0;border-radius:9px;background:var(--c,var(--ac));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bd{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.bd.A{--c:var(--A)}.bd.M{--c:var(--M)}.bd.B{--c:var(--B)}
.bc{font-size:13px;color:var(--mu);margin-bottom:6px}.bc a{color:var(--ac);font-weight:600}
.mh,.hd{display:flex;gap:16px;align-items:center;justify-content:space-between}.mh{justify-content:flex-start}.mh p{margin:8px 0 0;color:var(--mu)}
.rw{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--cd);
  border:1.5px solid var(--ln);
  padding:11px 14px;
  border-radius:14px;
  margin-bottom:9px;
  cursor:pointer;
  transition:transform .2s,border-color .2s;
}
.rw:hover{transform:translateX(5px);border-color:var(--ac)}
.rt{flex:1;font-weight:600;display:flex;flex-direction:column;line-height:1.3}
.rt small{font-weight:400;color:var(--mu);font-size:12px}
.nm{width:30px;height:30px;border-radius:9px;background:var(--hi);color:var(--ht);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.rw em{color:var(--ok);font-style:normal;font-weight:800}
.fv{border:0;background:none;font-size:20px;color:var(--ln);cursor:pointer;padding:0 4px;transition:transform .2s,color .2s}
.fv.big{font-size:30px}
.fv.on{color:var(--am);transform:scale(1.15)}.fv:hover{transform:scale(1.3) rotate(12deg)}
.bx{background:var(--cd);border:1.5px solid var(--ln);border-radius:16px;padding:20px;margin:14px 0;box-shadow:var(--sh)}
.bx h2{margin:0 0 12px;font-size:17.5px;color:var(--ac)}
.fm{display:flex;flex-direction:column;gap:8px;margin:14px 0}
code{font-family:inherit;background:color-mix(in srgb,var(--ac) 9%,transparent);border-left:4px solid var(--ac);padding:8px 12px;border-radius:8px;font-size:14px;display:block}
.dc{background:color-mix(in srgb,var(--am) 16%,transparent);border-left:4px solid var(--am);padding:10px 14px;border-radius:8px;font-size:14px}
.op{
  display:flex;
  gap:12px;
  width:100%;
  text-align:left;
  background:var(--bg);
  border:2px solid var(--ln);
  border-radius:12px;
  padding:10px 14px;
  margin:8px 0;
  cursor:pointer;
  transition:transform .15s,border-color .2s;
  font:inherit;
}
.op b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--hi);color:var(--ht);display:grid;place-items:center;font-size:13px}
.op:not(:disabled):hover{border-color:var(--ac);transform:translateX(4px)}.op:disabled{cursor:default}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);animation:pop .4s}
.op.er{border-color:var(--er);background:color-mix(in srgb,var(--er) 12%,transparent);animation:shake .4s}
.op.ok b{background:var(--ok);color:var(--bt)}.op.er b{background:var(--er);color:var(--bt)}
.fb{margin-top:14px;padding:14px;border-radius:12px;border-left:5px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);animation:up .4s both}
.fb.erb{border-color:var(--er);background:color-mix(in srgb,var(--er) 9%,transparent)}.fb p{margin:6px 0 0;white-space:pre-line}
.dn{background:var(--cd);color:var(--ac);border:1.5px solid var(--ac);border-radius:99px;padding:10px 22px;font:700 13.5px "Bricolage Grotesque",sans-serif;cursor:pointer;transition:all .25s}
.dn.on{background:var(--ok);border-color:var(--ok);color:var(--bt)}
.pn{display:flex;justify-content:space-between;gap:10px;margin:18px 0;flex-wrap:wrap}
.qh{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:8px 0}
.res{text-align:center;padding:10px 0}
.stat{text-align:center;margin:0}.stat span{font-size:22px}.stat b{display:block;font-size:26px}.stat small{color:var(--mu)}
.mr{display:grid;grid-template-columns:minmax(140px,1.3fr) 2fr minmax(90px,.8fr);gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.mr small,.mr2 small{color:var(--mu);text-align:right}
.mr2{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--ln);font-size:13.5px}
.sb{display:flex;height:10px;background:var(--ln);border-radius:9px;overflow:hidden}
.sb i{display:block;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.sb .g1{background:var(--ok)}.sb .e1{background:var(--er)}
.sm{text-align:center;display:flex;flex-direction:column;gap:2px;font:inherit}.sm b{font-family:"Bricolage Grotesque",sans-serif;font-size:28px}
.empty{text-align:center;font-size:40px;padding:32px 16px}.empty p{font-size:15px;color:var(--mu)}
.fcnt{text-align:center;color:var(--mu);font-size:13px;margin:4px 0 8px}.fcb{justify-content:center}
.fcw{perspective:1200px}
.fcard{position:relative;min-height:300px;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:20px;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:10px;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:var(--cd);
  border:1.5px solid var(--ln);
  box-shadow:var(--sh);
  overflow:auto;
}
.face.bk2{transform:rotateY(180deg);background:var(--hi);align-items:flex-start;text-align:left}
.face h2{font-size:24px;margin:0}
/* Timeline styles */
.tl-wrap{position:relative;margin:24px 0;padding-left:28px;border-left:3px solid var(--ac)}
.tl-item{position:relative;margin-bottom:20px;cursor:pointer;transition:transform .2s}
.tl-item:hover{transform:translateX(4px)}
.tl-dot{position:absolute;left:-35px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--ac);border:3px solid var(--bg)}
.tl-year{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--hi);color:var(--ht);font-weight:700;font-size:12px;margin-bottom:4px}
.tl-card{background:var(--cd);border:1.5px solid var(--ln);border-radius:12px;padding:12px 16px;box-shadow:var(--sh)}
.tl-card h4{margin:0 0 4px;font-size:14.5px;color:var(--tx)}
.tl-card p{margin:0;font-size:13px;color:var(--mu)}
/* Mindmap styles */
.mm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin:16px 0}
.mm-card{background:var(--cd);border:1.5px solid var(--ln);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.mm-flow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--ac);margin-bottom:6px}
.mm-flow span{cursor:pointer;padding:3px 8px;border-radius:6px;background:var(--hi);color:var(--ht)}
.mm-flow span:hover{text-decoration:underline}
.mm-card p{margin:0;font-size:13px;color:var(--mu)}
/* Glossary list */
.gl-item{background:var(--cd);border:1.5px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gl-item h4{margin:0 0 3px;font-size:14.5px;color:var(--ac)}
.gl-item p{margin:0;font-size:13px;color:var(--tx)}
.gl-item small{display:block;margin-top:4px;color:var(--mu);font-size:11.5px}
/* Traps */
.trap-card{background:var(--cd);border:1.5px solid var(--ln);border-left:5px solid var(--am);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.trap-card h3{margin:0 0 6px;color:var(--am);font-size:16px}
.trap-card p{margin:0;font-size:14px;color:var(--tx)}
/* Nav Bar */
nav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  z-index:25;
  width:min(100%,720px);
  display:flex;
  gap:2px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--hd);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1.5px solid var(--ln);
  border-bottom:0;
  border-radius:20px 20px 0 0;
}
nav a{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:17px;
  line-height:1.2;
  padding:5px 1px;
  border-radius:10px;
  color:var(--mu);
  transition:all .2s;
  text-align:center;
}
nav i{font-style:normal}
nav a span{font-size:10px;font-weight:700;white-space:nowrap}
nav a.on{background:var(--hi);color:var(--ht);transform:translateY(-2px)}
.nt{font-size:12px;color:var(--mu);margin:28px 0 0;text-align:center}
@media(max-width:520px){
  .mr{grid-template-columns:1fr 1fr}
  .mr .sb{grid-column:1/-1;order:3}
  .hero{padding:16px}
  nav a span{font-size:9.5px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<div class="w">

var M = [{"n": "Era Vargas, Democracia e Ditadura Militar", "p": 14, "l": "A", "d": "Revolução de 1930, Estado Novo, legislação trabalhista, período democrático, golpe de 1964, AI-5 e anistia.", "s": "Revolução de 1930 e Governo Provisório|A;Constituição de 1934 e Era Constitucional|M;Estado Novo e Ditadura Vargas|A;Legislação Trabalhista e CLT|A;Período Democrático e Populismo (1945-1964)|A;Governo Juscelino Kubitschek e o Desenvolvimentismo|M;Golpe Civil-Militar de 1964 e Anos de Chumbo|A;Atos Institucionais, AI-5 e Resistência|A;Abertura Política e Lei da Anistia|M"}, {"n": "Brasil Colônia", "p": 13, "l": "A", "d": "Capitanias, economia açucareira, invasões holandesas, mineração, escravidão e revoltas emancipacionistas.", "s": "Capitanias Hereditárias e Governo-Geral|M;Economia Açucareira e Sociedade dos Engenhos|A;União Ibérica e Invasões Holandesas|M;Bandeirismo e Expansão Territorial|M;Ciclo do Ouro e Sociedade Mineradora|A;Escravidão Colonial e Resistência Quilombola|A;Revoltas Nativistas: Beckman e Emboabas|B;Conjuração Mineira (Inconfidência)|A;Conjuração Baiana (Revolta dos Alfaiates)|A"}, {"n": "Guerras Mundiais, Totalitarismos e Guerra Fria", "p": 11, "l": "A", "d": "Primeira Guerra, Revolução Russa, crise de 1929, nazi-fascismo, Holocausto, Segunda Guerra e bipolaridade.", "s": "Primeira Guerra Mundial e Tratado de Versalhes|A;Revolução Russa de 1917 e Formação da URSS|A;Crise de 1929 e o New Deal|A;Fascismo Italiano e Nazismo Alemão|A;Segunda Guerra Mundial e o Holocausto|A;Criação da ONU e Declaração dos Direitos Humanos|M;Guerra Fria: Bipolaridade e Corrida Armamentista|A;Conflitos da Guerra Fria: Cuba e Vietnã|M"}, {"n": "Brasil Império e Escravidão", "p": 10, "l": "A", "d": "Independência, Primeiro Reinado, Período Regencial, Segundo Reinado, café, Guerra do Paraguai e abolição.", "s": "Processo de Independência e Primeiro Reinado|A;Período Regencial e Revoltas Provinciais|A;Segundo Reinado e Parlamentarismo às Avessas|A;Economia Cafeeira e Imigração Europeia|A;Guerra do Paraguai e Crise Monárquica|M;Tráfico Negreiro e Leis Abolicionistas|A;Movimento Abolicionista e Lei Áurea|A;Golpe Republicano e Proclamação da República|M"}, {"n": "Revolução Industrial, Capitalismo e Imperialismo", "p": 8, "l": "A", "d": "Primeira e Segunda Revoluções Industriais, movimento operário, socialismo científico e partilha imperialista.", "s": "Primeira Revolução Industrial e Mudanças Sociais|A;Segunda Revolução Industrial e Capital Financeiro|A;Movimento Operário: Ludismo e Cartismo|M;Doutrinas Sociais: Socialismo e Anarquismo|A;Imperialismo e Conferência de Berlim|A;Resistências Anticoloniais: Cipaios e Boxers|B;Belle Époque e Paz Armada|M"}, {"n": "Primeira República", "p": 7, "l": "M", "d": "República da Espada, coronelismo, política dos governadores, Canudos, Contestado, revoltas urbanas e tenentismo.", "s": "República da Espada e Constituição de 1891|M;Coronelismo, Voto de Cabresto e Clientelismo|A;Política dos Governadores e Café com Leite|A;Guerra de Canudos e Messianismo Sertanejo|A;Guerra do Contestado e Conflitos de Fronteira|M;Revolta da Vacina e Higienismo Urbano|A;Revolta da Chibata e Movimento Tenentista|M;Greve Geral de 1917 e Semana de Arte Moderna de 1922|A"}, {"n": "África, Diáspora e Afro-brasileiros", "p": 7, "l": "M", "d": "Reinos africanos, tráfico atlântico, resistências, pós-abolição, movimento negro e cultura afro-brasileira.", "s": "Reinos e Impérios Africanos Pré-Coloniais|M;Tráfico Transatlântico e o Navio Negreiro|A;Quilombos e Estratégias de Resistência Negra|A;Pós-Abolição e Marginalização Social|A;Movimento Negro e Luta pelos Direitos Civis|A;Patrimônio Cultural Afro-Brasileiro|M;Legislação Antirracista e Ações Afirmativas|A"}, {"n": "Iluminismo, Revoluções Liberais e Independências", "p": 6, "l": "M", "d": "Revoluções Inglesas, Iluminismo, Independência dos EUA, Revolução Francesa e independências latino-americanas.", "s": "Revoluções Inglesas do Século XVII|M;Filosofia Iluminista e Crítica ao Antigo Regime|A;Independência dos Estados Unidos (1776)|M;Revolução Francesa: Queda da Bastilha à República|A;Era Napoleônica e Congresso de Viena|M;Revolução do Haiti (1791-1804)|A;Independências da América Espanhola|M"}, {"n": "Antiguidade Clássica", "p": 5, "l": "M", "d": "Pólis grega, democracia ateniense, cidadania, República Romana, expansão e decadência do Império Romano.", "s": "Civilizações Fluviais: Mesopotâmia e Egito Antigo|B;A Pólis Grega: Atenas e Esparta|M;Democracia Ateniense e Cidadania Antiga|A;República Romana e Lutas Plebeias|M;Império Romano e a Pax Romana|M;Crise do Império Romano e Cristianismo|M"}, {"n": "Idade Moderna", "p": 5, "l": "M", "d": "Renascimento cultural, Grandes Navegações, Reformas Religiosas, Absolutismo régio e Mercantilismo.", "s": "Renascimento Cultural e Humanismo|A;Grandes Navegações e Expansão Marítima|M;Reforma Protestante e Ruptura Cristã|A;Contrarreforma e Tribunal do Santo Ofício|M;Absolutismo Monárquico e Teóricos do Poder|A;Mercantilismo e Práticas Coloniais|A"}, {"n": "Redemocratização e Brasil Atual", "p": 4, "l": "B", "d": "Diretas Já, Constituição Cidadã de 1988, estabilização econômica, consolidação democrática e direitos humanos.", "s": "Campanha das Diretas Já e Transição Política|M;Constituição Cidadã de 1988|A;Governo Collor e o Impeachment de 1992|M;Plano Real e Estabilização Econômica|M;Governos dos Anos 2000 e Políticas Sociais|M;Movimentos Sociais e Desafios da Cidadania Atual|M"}, {"n": "Mundo Contemporâneo", "p": 3, "l": "B", "d": "Descolonização afro-asiática, geopolítica do Oriente Médio, fim da URSS, globalização e multipolaridade.", "s": "Descolonização da Ásia e da África|M;Conflitos Árabe-Israelenses e o Oriente Médio|M;Queda do Muro de Berlim e Fim da URSS|M;Globalização e Blocos Econômicos|M;Crises Geopolíticas e Atentados de 11 de Setembro|B;Multipolaridade e a Ascensão da China|B"}, {"n": "América Indígena e Povos Originários", "p": 3, "l": "B", "d": "Povos indígenas do Brasil, maias, astecas, incas, colonização espanhola e lutas originárias contemporâneas.", "s": "Povos Originários do Brasil Antes de 1500|M;Civilizações Pré-Colombianas: Maias e Astecas|M;O Império Inca e a Organização Andina|M;Conquista Espanhola e a Catástrofe Demográfica|A;Sistemas de Trabalho Compulsório: Mita e Encomienda|M;Resistência Indígena e Direitos Territoriais Contemporâneos|M"}, {"n": "Idade Média", "p": 2, "l": "B", "d": "Feudalismo, Igreja Católica medieval, mundo islâmico, Cruzadas e renascimento urbano-comercial.", "s": "Feudalismo: Relações de Suserania e Servidão|M;O Papel da Igreja Católica na Cristandade Medieval|M;O Islã Medieval e a Expansão Árabe|B;As Cruzadas e o Renascimento Comercial dos Burgos|M;Crise do Século XIV: Peste Negra e Fome|M"}, {"n": "Historiografia, Fontes e Memória", "p": 2, "l": "B", "d": "Tipos de fontes históricas, tempo histórico, anacronismo, Escola dos Annales, patrimônio e negacionismo.", "s": "Fontes Históricas e Métodos de Análise|M;Tempo Histórico, Periodização e Anacronismo|M;Escola dos Annales e a História Nova|B;Memória Coletiva, Patrimônio Material e Imaterial|M;Negacionismo Histórico e Usos Políticos do Passado|M"}];
var C = {"Revolução de 1930 e Governo Provisório": ["O movimento armado de 1930 pôs fim à hegemonia das oligarquias cafeeiras tradicionais da Primeira República após o assassinato de João Pessoa e a contestação da posse de Júlio Prestes. Getúlio Vargas assumiu a chefia do Governo Provisório, dissolveu o Congresso Nacional, suspendeu a Constituição de 1891 e nomeou tenentes interventores nos estados. A centralização do poder provocou forte insatisfação da elite paulista, culminando na Revolução Constitucionalista de 1932. Mesmo derrotada militarmente, a revolta de São Paulo forçou a convocação de eleições para uma Assembleia Nacional Constituinte.", ["1930: Deposição de Washington Luís e posse de Getúlio Vargas no Governo Provisório", "Tenentismo: Apoio militar inicial ao governo e nomeação de interventores estaduais", "1932: Revolução Constitucionalista de São Paulo em defesa da reconstitucionalização do país", "Centralização política: Suspensão do Legislativo e criação do Ministério do Trabalho, Indústria e Comércio"], "Não confunda o Governo Provisório (1930-1934) com a ditadura do Estado Novo (1937-1945). O Governo Provisório foi marcado pela instabilidade e pela pressão civil por uma nova Constituição.", "Trecho do Manifesto da Aliança Liberal (1929):\n\n'A Aliança Liberal não visa a uma simples mudança de governantes, mas à profunda renovação dos costumes políticos e à restauração da moralidade pública no país. Reclamamos o voto secreto, a representação proporcional das minorias e a independência do Poder Judiciário, além de leis sociais que amparem as classes produtoras e os trabalhadores do solo e das oficinas.'\n\n(Fonte: Documentos Históricos Brasileiros. CPDOC/FGV).", "O Manifesto da Aliança Liberal e os desdobramentos de 1930 expressavam demandas de modernização institucional que tinham como principal alvo político:", ["a substituição do pacto oligárquico tradicional por uma ordem centralizadora com ampliação dos direitos políticos e sociais.", "a extinção imediata das Forças Armadas e sua substituição por milícias operárias urbanas.", "o restabelecimento da monarquia parlamentarista inspirada no modelo britânico do século XIX.", "a coletivização compulsória das fazendas cafeeiras e a estatização de todo o comércio exterior.", "a aliança incondicional com as lideranças paulistas que comandavam a política do café com leite."], 0, "Passo a passo:\n1. Fonte e contexto: O manifesto de 1929 sintetiza as reivindicações da chapa de oposição (Vargas e João Pessoa) contra a oligarquia paulista da Primeira República.\n2. Raciocínio: A Aliança Liberal exigia reforma eleitoral (voto secreto), justiça eleitoral e legislação trabalhista, quebrando o domínio da 'política dos governadores' e abrindo caminho para o Estado centralizador de Vargas (Gabarito A).\n3. Distratores: A é anacrônica e absurda (os militares foram aliados centrais); C erra o regime (o movimento era republicano); D confunde com propostas comunistas (a Aliança Liberal era burguesa-reformista); E inverte a relação, pois a oposição combatia exatamente a hegemonia paulista."], "Constituição de 1934 e Era Constitucional": ["Promulgada por uma Assembleia Constituinte eleita, a Constituição de 1934 introduziu avanços decisivos inspirados na Constituição alemã de Weimar, como o voto secreto, o voto feminino e a Justiça Eleitoral para conter as fraudes oligárquicas. No campo social, incorporou direitos trabalhistas inéditos (jornada de oito horas, salário mínimo, proibição do trabalho infantil e repouso semanal remunerado). Contudo, a estabilidade foi curta: o período constitucional (1934-1937) foi marcado pela radicalização ideológica entre a Ação Integralista Brasileira (AIB, de extrema-direita) e a Aliança Nacional Libertadora (ANL, antifascista com liderança comunista). O levante comunista de 1935 (Intentona) serviu de justificativa para endurecer o regime e decretar o estado de sítio.", ["Constituição de 1934: Marco do voto secreto, voto feminino e direitos trabalhistas no texto constitucional", "Voto Feminino: Conquista formalizada pelo Código Eleitoral de 1932 e consolidada na Carta de 1934", "Ação Integralista Brasileira (AIB): Inspirada no fascismo italiano, liderada por Plínio Salgado ('Deus, Pátria e Família')", "Aliança Nacional Libertadora (ANL): Frente ampla antifascista liderada por Luís Carlos Prestes", "1935: Levante Comunista (Intentona) e posterior repressão policial de Filinto Müller"], "O voto feminino e a criação da Justiça Eleitoral foram regulamentados pelo Código Eleitoral de 1932 e constitucionalizados em 1934. Esse período é de grande polarização política global refletida no Brasil.", "Art. 108 da Constituição da República dos Estados Unidos do Brasil (1934):\n\n'São eleitores os brasileiros de um e de outro sexo, maiores de 18 anos, que se alistarem na forma da lei. [...] Não podem alistar-se eleitores: os analfabetos; os mendigos; os militares em serviço ativo; os que estiverem privados dos direitos políticos.'\n\n(Fonte: Presidência da República do Brasil, Legislação Histórica).", "A legislação eleitoral de 1934 representou um avanço no processo de democratização brasileiro, embora mantivesse limitações de cidadania ao:", ["permitir o voto exclusivo de proprietários de terras e grandes comerciantes urbanos.", "manter a exclusão eleitoral de contingentes expressivos da população pobre, como os analfabetos.", "restringir a participação de mulheres solteiras e de funcionários públicos civis.", "revogar a exigência do voto secreto, restabelecendo o voto a descoberto da Primeira República.", "impedir a filiação partidária e proibir qualquer tipo de organização sindical no território nacional."], 1, "Passo a passo:\n1. Fonte e contexto: O artigo 108 da Carta de 1934 expandiu o sufrágio para as mulheres e instituiu o voto secreto, mas explicitamente manteve de fora analfabetos, mendigos e soldados.\n2. Raciocínio: A manutenção do veto aos analfabetos bloqueava grande parcela da população rural e trabalhadora, limitando a universalização real da cidadania política (Gabarito B).\n3. Distratores: A descreve o voto censitário do Império (1824); B é incorreta (mulheres não eram restritas por estado civil); D diz o oposto (o voto passou a ser estritamente secreto); E erra, pois a Constituição garantiu a organização sindical autônoma inicial."], "Estado Novo e Ditadura Vargas": ["Em novembro de 1937, Getúlio Vargas desfechou um golpe de Estado apoiando-se na farsa do 'Plano Cohen', um falso complô comunista forjado por oficiais militares. O Congresso foi fechado, partidos políticos foram banidos e outorgou-se a Constituição autoritária de 1937, apelidada de 'Polaca' por sua inspiração no regime semifascista polonês. O Estado Novo (1937-1945) caracterizou-se pelo controle policial rigoroso, torturas de opositores, culto oficial à figura do líder e censura prévia através do Departamento de Imprensa e Propaganda (DIP). O regime promoveu também o nacional-desenvolvimentismo industrial de base (CSN em Volta Redonda, Vale do Rio Doce) financiado com apoio norte-americano durante a Segunda Guerra Mundial.", ["1937: Golpe do Estado Novo e outorga da Constituição 'Polaca'", "Plano Cohen: Falso plano de insurreição comunista usado para justificar o golpe", "DIP (Departamento de Imprensa e Propaganda): Censura de jornais, rádio e cinema, e propaganda do líder", "Industrialização de base: Companhia Siderúrgica Nacional (CSN), Companhia Vale do Rio Doce e FNM", "1945: Pressão democrática após a vitória dos Aliados e deposição militar de Vargas"], "O DIP não realizava apenas censura; sua função mais sofisticada era a propaganda positiva, promovendo a imagem de Vargas como o 'Pai dos Pobres' e exaltando o trabalhador disciplinado.", "Trecho de diretriz oficial do Departamento de Imprensa e Propaganda (DIP, 1941):\n\n'A imprensa deve orientar o espírito público para a harmonia social e o culto das tradições nacionais, abstendo-se de divulgar polêmicas partidárias estéreis, greves ou fatos suscetíveis de perturbar a ordem pública ou abalar a fé da juventude no futuro do Brasil e na chefia suprema da Nação.'\n\n(Fonte: Arquivo Nacional, Fundo DIP).", "No contexto do Estado Novo (1937-1945), a atuação do Departamento de Imprensa e Propaganda (DIP) tinha como objetivo central:", ["estimular o pluralismo partidário e o debate aberto entre ideologias antagônicas no rádio.", "difundir ideais anarquistas entre os trabalhadores fabris dos grandes centros metropolitanos.", "construir a imagem harmoniosa do Estado e do líder, neutralizando conflitos de classe e opositores.", "promover a autonomia dos jornais de oposição financiados pelo Partido Comunista Brasileiro.", "combater a industrialização de base para preservar a vocação estritamente agrária do país."], 2, "Passo a passo:\n1. Fonte e contexto: A diretriz do DIP exemplifica a censura sistemática e o projeto de conformação ideológica durante a ditadura getulista.\n2. Raciocínio: O DIP buscava silenciar contestações, associar estabilidade à figura de Vargas e eliminar a noção de luta de classes em prol do nacionalismo corporativo (Gabarito C).\n3. Distratores: A e D contrariam a essência da censura estatal ditatorial; B confunde a repressão varguista com doutrinas operárias que eram perseguidas; E contradiz o projeto econômico varguista, que era focado na criação da indústria de base pesada."], "Legislação Trabalhista e CLT": ["A Consolidação das Leis do Trabalho (CLT), promulgada em 1º de maio de 1943 por Vargas, unificou a dispersa legislação social construída desde 1930. Ela assegurou garantias como férias remuneradas, jornada de trabalho regulamentada, licença-maternidade, estabilidade no emprego e Justiça do Trabalho. A historiografia analisa a CLT sob dois prismas complementares: por um lado, atendeu a históricas reivindicações operárias iniciadas nas greves da Primeira República; por outro, serviu de mecanismo de controle estatal sobre a classe trabalhadora mediante o enquadramento sindical corporativista e a exigência da Carta Sindical atrelada ao Ministério do Trabalho.", ["1º de Maio de 1943: Promulgação do Decreto-Lei nº 5.452 (Consolidação das Leis do Trabalho - CLT)", "Justiça do Trabalho: Instituição criada para mediar conflitos individuais e coletivos entre patrões e empregados", "Corporativismo: Atrelando sindicatos ao Estado e proibindo greves no Estado Novo", "Imposto Sindical: Contribuição compulsória que financiava a estrutura dos sindicatos oficiais", "Pelego: Termo popular para designar os líderes sindicais submissos aos interesses governamentais"], "Atenção para o debate historiográfico do 'trabalhismo': a CLT não foi mera 'dádiva' de um líder benevolente, mas sim resultado de décadas de luta operária canalizadas e tuteladas pelo Estado corporativo.", "Preâmbulo do Decreto-Lei nº 5.452, de 1º de maio de 1943 (CLT):\n\n'O Presidente da República dos Estados Unidos do Brasil, usando da atribuição que lhe confere o art. 180 da Constituição, decreta a Consolidação das Leis do Trabalho, destinadas a reger as relações individuais e coletivas de trabalho, nela previstas.'\n\n(Fonte: Diário Oficial da União, 9 ago. 1943).", "A instituição da CLT em 1943 evidenciava a estratégia política do Estado varguista caracterizada por:", ["garantir a liberdade irrestrita de greve e a independência absoluta das centrais sindicais autônomas.", "transferir aos empresários rurais a obrigação de conceder direitos idênticos aos dos operários fabris.", "extinguir os tribunais da Justiça do Trabalho para favorecer acordos informais sem mediação estatal.", "atender a antigas demandas trabalhistas por meio de uma estrutura sindical tutelada e controlada pelo poder público.", "restringir os direitos trabalhistas aos estrangeiros recém-chegados, excluindo a mão de obra nacional."], 3, "Passo a passo:\n1. Fonte e contexto: A CLT reuniu as normas de trabalho criadas no Brasil, editada por decreto durante o Estado Novo.\n2. Raciocínio: Vargas concedeu direitos concretos aos trabalhadores ao mesmo tempo em que enquadrava os sindicatos no modelo corporativo fascista italiano (Carta del Lavoro), cooptando as lideranças e proibindo greves autônomas (Gabarito D).\n3. Distratores: B erra, pois a greve foi considerada crime anti-social no Estado Novo; C erra porque o trabalhador rural ficou excluído da CLT até o Estatuto do Trabalhador Rural de 1963; D erra, pois a Justiça do Trabalho foi fortalecida; E inverte a prioridade nacionalista de Vargas."], "Período Democrático e Populismo (1945-1964)": ["Com o término da Segunda Guerra Mundial e a deposição de Vargas em 1945, abriu-se a 'República Democrática' (1945-1964), respaldada pela Constituição liberal de 1946. O período foi marcado pelo pluripartidarismo (PSD, UDN e PTB) e pela forte polarização entre o projeto nacionalista (intervenção estatal e soberania econômica, defendido pelo PTB e facções do PSD) e o projeto liberal-conservador (abertura ao capital estrangeiro, liderado pela UDN). Em seu retorno eleito pelo voto popular em 1950, Vargas criou a Petrobras (1953), mas enfrentou violenta oposição udenista e crise militar, culminando em seu suicídio em 24 de agosto de 1954.", ["Constituição de 1946: Restauração da democracia, liberdades civis e mandato presidencial de 5 anos", "Tripé partidário: PSD (oligarquias do interior), UDN (conservadora e anti-varguista) e PTB (trabalhista e sindical)", "1953: Campanha 'O Petróleo é Nosso' e fundação da Petrobras sob monopólio estatal", "Agosto de 1954: Atentado da Rua Tonelero, Manifesto dos Generais e Carta-Testamento de Vargas", "Nacionalismo versus Entreguismo: Debate central sobre os rumos do desenvolvimento brasileiro"], "A UDN de Carlos Lacerda combatia frontalmente Vargas e as reformas de base. A Carta-Testamento de Vargas adiou o golpe civil-militar por dez anos devido à comoção popular que despertou.", "Fragmento da Carta-Testamento de Getúlio Vargas (24 de agosto de 1954):\n\n'Mais uma vez as forças e os interesses contra o povo coordenaram-se e se desencadeiam sobre mim. Não me acusam, insultam; não me combatem, caluniam; e não me dão o direito de defesa. [...] Era preciso não deixar continuar o trabalho de criação da nossa riqueza nacional, que começava a libertar o Brasil por meio da exploração do nosso petróleo.'\n\n(Fonte: CPDOC/FGV).", "O documento redigido momentos antes do suicídio de Getúlio Vargas expressa a tensão política e ideológica que contrapunha:", ["a aliança armada entre comunistas e integralistas em prol da dissolução imediata da Federação brasileira.", "os setores monarquistas defensores da corte imperial e os cafeicultores paulistas da República Velha.", "os defensores da desmilitarização do país e as organizações paramilitares ligadas aos sindicatos camponeses.", "a exigência de privatização total do subsolo e a rejeição de qualquer taxa sobre os lucros das multinacionais.", "o nacionalismo com regulação estatal dos recursos estratégicos e os setores associados ao capital financeiro internacional e ao conservadorismo liberal."], 4, "Passo a passo:\n1. Fonte e contexto: A Carta-Testamento denunciou a orquestração de grupos externos e da elite udenista contra as medidas nacionalistas de seu governo, como o monopólio do petróleo.\n2. Raciocínio: A disputa central era entre o nacional-desenvolvimentismo soberano (Getúlio, Petrobras) e a oposição liberal-udenista, aliada ao capital internacional (Gabarito E).\n3. Distratores: B mistura grupos antagônicos absurdamente; C traz elementos de séculos anteriores; D inventa organizações paramilitares camponesas governando; E inverte a posição do próprio Vargas."], "Governo Juscelino Kubitschek e o Desenvolvimentismo": ["O mandato de Juscelino Kubitschek (1956-1961) simbolizou o auge do desenvolvimentismo no Brasil com o lema 'Cinquenta anos em cinco'. Baseado no Plano de Metas, JK priorizou investimentos em energia, transportes, indústrias pesadas e na edificação da nova capital federal, Brasília, inaugurada em 1960 no Planalto Central. A estratégia ancorou-se no tripé econômico: Estado garantindo infraestrutura básica, capital nacional em bens de consumo não duráveis e capital estrangeiro na indústria automobilística e eletrodomésticos. Apesar da euforia e da modernização urbana, o modelo gerou inflação crônica, endividamento externo e acentuada desigualdade regional.", ["Plano de Metas: 31 objetivos focados em energia, transportes, alimentação, educação e indústrias de base", "Brasília (1960): Projeto urbanístico de Lúcio Costa e arquitetura de Oscar Niemeyer para interiorizar o país", "Indústria Automobilística: Entrada maciça de montadoras multinacionais (Volkswagen, Ford, GM)", "Rodoviarismo: Opção preferencial pelo transporte rodoviário em detrimento das ferrovias", "Herança inflacionária: Rompimento com o FMI em 1959 e disparada do custo de vida"], "O 'desenvolvimentismo' de JK não eliminou a dependência externa; ele a reformulou, atraindo grandes corporações transnacionais para produzir internamente bens de consumo duráveis.", "Dados sobre o Plano de Metas de Juscelino Kubitschek (1956-1961):\n\n• Produção de veículos: de 30 mil (1956) para mais de 130 mil unidades/ano (1960).\n• Malha rodoviária pavimentada: ampliação em mais de 14.000 km.\n• Taxa média de crescimento do PIB: aproximadamente 7% ao ano.\n• Taxa de inflação anual: subiu de 12% (1956) para cerca de 30% (1960).\n\n(Fonte: IPEA / IBGE).", "A análise dos resultados socioeconômicos do governo Juscelino Kubitschek revela que o rápido crescimento da indústria esteve diretamente associado a:", ["uma modernização acelerada associada ao aumento do endividamento público e à inflação.", "um equilíbrio fiscal rigoroso e à redução completa da dívida externa brasileira perante o FMI.", "uma expansão das ferrovias públicas em detrimento do transporte automotivo individual.", "uma reforma agrária abrangente que distribuiu terras ociosas no Centro-Oeste brasileiro.", "um isolacionismo comercial que proibiu a entrada de empresas estrangeiras no mercado nacional."], 0, "Passo a passo:\n1. Fonte e contexto: Os dados mostram grande crescimento do PIB e estradas, acompanhado do salto inflacionário.\n2. Raciocínio: A modernização de JK (rodovias, automóveis, Brasília) foi custeada por emissão monetária e empréstimos externos, gerando inflação e concentração de renda (Gabarito A).\n3. Distratores: A contraria os fatos (houve rompimento com o FMI e aumento da dívida); B inverte a política (o foco foi rodoviário); D é falsa (JK não fez reforma agrária); E é falso (JK abriu amplamente as portas ao capital externo)."], "Golpe Civil-Militar de 1964 e Anos de Chumbo": ["Em 31 de março de 1964, um golpe civil-militar depôs o presidente constitucional João Goulart ('Jango'). Jango propunha as 'Reformas de Base' (agrária, tributária, educacional e urbana), vistas pelas elites proprietárias, empresários, Igreja conservadora, governo dos EUA (Operação Brother Sam) e setores militares como uma ameaça comunista em plena Guerra Fria. O regime ditatorial que se instalou (1964-1985) suprimiu eleições diretas para presidente, cassou mandatos parlamentares e perseguiu movimentos sociais. O período mais repressivo, os 'Anos de Chumbo' (1968-1974), ocorreu durante o governo Médici, combinando censura generalizada, torturas sistemáticas no DOI-CODI e a ilusão desenvolvimentista do 'Milagre Econômico' com propaganda ufanista.", ["1964: Deposição de João Goulart e Marcha da Família com Deus pela Liberdade", "Reformas de Base: Propostas de modernização estrutural com inclusão popular propostas por Jango", "Operação Brother Sam: Apoio logístico e naval do governo dos Estados Unidos ao golpe", "Governo Médici (1969-1974): Auge da repressão aos grupos armados e da propaganda ufanista ('Brasil, ame-o ou deixe-o')", "Milagre Econômico (1969-1973): PIB em alta com concentração de renda e endividamento sob Delfim Netto"], "O termo correto é golpe civil-militar, pois contou com o apoio ostensivo de jornais da grande imprensa, empresários (IPES/IBAD), da bancada da UDN e de setores da Igreja Católica.", "Trecho do Discurso do Presidente João Goulart no Comício da Central do Brasil (13 de março de 1964):\n\n'Democracia é o que o meu governo quer realizar quando deseja incorporar à sociedade os milhões de irmãos que vivem à margem da vida econômica e da cidadania. [...] Não há ameaça comunista mais grave para a pátria do que a miséria que destrói os lares e empobrece a terra. As reformas de base são o caminho para a justiça social.'\n\n(Fonte: O Estado de S. Paulo, 14 mar. 1964).", "A reação conservadora que culminou no golpe de 31 de março de 1964 fundamentou-se no temor de que as Reformas de Base representassem:", ["o fortalecimento incontestável da propriedade latifundiária tradicional apoiada pela UDN.", "uma ruptura radical com a ordem capitalista e uma adesão do Brasil ao bloco soviético durante a Guerra Fria.", "a entrega da exploração mineral aos conglomerados financeiros sediados nos Estados Unidos.", "o desarmamento compulsório das polícias militares estaduais para incentivar revoltas monarquistas.", "o cancelamento dos direitos trabalhistas garantidos aos operários urbanos desde a Era Vargas."], 1, "Passo a passo:\n1. Fonte e contexto: O comício da Central reuniu milhares de trabalhadores ouvindo o anúncio das Reformas de Base por Jango.\n2. Raciocínio: As forças conservadoras utilizaram o pânico anticomunista da Guerra Fria para justificar a deposição do presidente legítimo, acusando as reformas sociais de prelúdio ao comunismo (Gabarito B).\n3. Distratores: A diz o oposto do temor dos fazendeiros (que temiam a desapropriação da terra); C descreve a política que os próprios golpistas acabaram favorecendo; D e E são incongruentes com os debates históricos de 1964."], "Atos Institucionais, AI-5 e Resistência": ["A ditadura militar governou por meio de Atos Institucionais (AIs), decretos emanados do Executivo que se sobrepunham à Constituição. O Ato Institucional nº 5 (AI-5), baixado pelo general Costa e Silva em 13 de dezembro de 1968, representou o fechamento total do regime: fechou o Congresso por tempo indeterminado, suspendeu o habeas corpus para crimes políticos, autorizou cassações de mandatos, confiscos e institucionalizou a censura prévia aos meios de comunicação e à produção artística. A resistência manifestou-se na luta armada urbana e rural (ALN, MR-8, Guerrilha do Araguaia), nas passeatas estudantis (Passeata dos Cem Mil) e na contestação cultural de artistas e músicos, duramente perseguidos e forçados ao exílio.", ["13 de dezembro de 1968: Promulgação do AI-5 pelo presidente Costa e Silva", "Suspensão do Habeas Corpus: Autorização legal para prisões arbitrárias e tortura sem controle judicial", "Passeata dos Cem Mil (1968): Mobilização popular no Rio de Janeiro contra a violência ditatorial", "Resistência Armada: Ações guerrilheiras de grupos de esquerda, como o sequestro do embaixador Charles Elbrick", "Música e Teatro de Protesto: Tropicália, MPB e dramaturgia enfrentando a censura federal"], "O AI-5 não tinha prazo de validade estabelecido. Ele permaneceu em vigor por dez anos, até ser revogado no governo Geisel em dezembro de 1978, no início da abertura lenta e gradual.", "Art. 10 do Ato Institucional nº 5 (13 de dezembro de 1968):\n\n'Fica suspensa a garantia de habeas corpus, nos casos de crimes políticos, contra a segurança nacional, a ordem econômica e social e a economia popular.'\n\n(Fonte: Diário Oficial da União, 13 dez. 1968).", "A medida estipulada no artigo 10 do AI-5 teve como consequência imediata no cenário político brasileiro:", ["o fortalecimento do Poder Judiciário como instância máxima de garantia dos direitos fundamentais da população.", "a legalização irrestrita de protestos sindicais e manifestações pacíficas em praças públicas.", "a desarticulação das garantias legais contra prisões arbitrárias, intensificando a tortura e a repressão de opositores.", "a convocação de eleições presidenciais diretas com participação de todos os partidos de oposição.", "o restabelecimento integral da liberdade de expressão na imprensa e nas produções artísticas universitárias."], 2, "Passo a passo:\n1. Fonte e contexto: O artigo 10 do AI-5 liquidou a garantia jurídica do habeas corpus para réus políticos.\n2. Raciocínio: Sem habeas corpus, os órgãos da repressão (como DOI-CODI e OBAN) puderam sequestrar, deter incomunicáveis e torturar opositores sem qualquer fiscalização da Justiça (Gabarito C).\n3. Distratores: A diz exatamente o inverso da perda de poder do Judiciário; B, D e E descrevem situações de plena democracia, opostas ao rigor autoritário do AI-5."], "Abertura Política e Lei da Anistia": ["Diante do esgotamento do 'Milagre Econômico', da crise do petróleo de 1973 e do avanço eleitoral do MDB, os generais Ernesto Geisel e João Figueiredo coordenaram a transição para a democracia descrita como 'lenta, gradual e segura'. A Linha Dura militar reagiu com atentados a bomba (como no Riocentro em 1981) para tentar barrar a abertura. Em agosto de 1979, foi aprovada a Lei da Anistia (Lei nº 6.683), que permitiu o retorno dos exilados políticos e a libertação de presos da oposição, mas também estendeu o perdão aos agentes estatais acusados de tortura e assassinatos ('anistia bilateral e recíproca'). No mesmo ano, extinguiu-se o bipartidarismo (ARENA e MDB), restabelecendo o pluripartidarismo no país.", ["Geisel e Figueiredo: Condução da abertura política tutelada pelas Forças Armadas", "1979: Promulgação da Lei da Anistia (Lei nº 6.683)", "Linha Dura e Atentado do Riocentro (1981): Tentativa de sabotar a transição democrática", "Fim do Bipartidarismo (1979): Surgimento do PDS, PMDB, PT, PDT e PTB", "Campanha das Diretas Já (1984): Mobilização popular em torno da Emenda Dante de Oliveira"], "A Lei da Anistia de 1979 foi alvo de intenso debate nas décadas seguintes: os movimentos de direitos humanos criticam a autoanistia que blindou torturadores das Forças Armadas de punição penal.", "Art. 1º da Lei nº 6.683, de 28 de agosto de 1979:\n\n'É concedida anistia a todos quantos, no período compreendido entre 02 de setembro de 1961 e 15 de agosto de 1979, cometeram crimes políticos ou conexos com estes, crimes eleitorais, aos que tiveram seus direitos políticos suspensos e aos servidores da Administração Direta e Indireta punidos com fundamento nos Atos Institucionais.'\n\n(Fonte: Presidência da República).", "A interpretação oficial conferida ao conceito de 'crimes conexos' na Lei da Anistia de 1979 resultou politicamente na:", ["condenação imediata dos generais presidentes por tribunais internacionais de direitos humanos.", "cassação definitiva dos direitos políticos de todos os exilados que regressaram ao território nacional.", "proibição da formação de novos partidos políticos para manter a hegemonia perpétua da ARENA.", "extensão do perdão legal aos agentes da repressão estatal que cometeram atos de violência e tortura.", "recusa governamental em reintegrar servidores públicos e professores universitários demitidos pelo regime."], 3, "Passo a passo:\n1. Fonte e contexto: A redação do art. 1º incluiu a fórmula dos 'crimes conexos', redigida pelo governo militar.\n2. Raciocínio: Essa formulação serviu para a 'autoanistia': perdoava os militantes de esquerda, mas protegia simultaneamente os agentes policiais e militares envolvidos em torturas e desaparecimentos forçados (Gabarito D).\n3. Distratores: A é historicamente falsa no Brasil (torturadores não foram julgados penalmente); C contraria o efeito prático (exilados recuperaram direitos e disputaram eleições); D contraria o pluripartidarismo instituído no mesmo ano; E contraria o texto da lei, que permitiu o retorno funcional de punidos."], "Capitanias Hereditárias e Governo-Geral": ["Ameaçada pela cobiça de potências estrangeiras como a França, a Coroa portuguesa instituiu em 1534 o sistema descentralizado de Capitanias Hereditárias, doando 15 lotes de terra a 12 capitães donatários. Reguladas pela Carta de Doação e pelo Foral, as capitanias transferiam os custos da colonização para particulares, mas a maioria fracassou devido à escassez de recursos, à falta de apoio central e à resistência combativa dos povos originários (apenas Pernambuco e São Vicente prosperaram com o cultivo da cana). Para centralizar a administração e garantir a soberania territorial, Portugal criou em 1548 o Governo-Geral, fundando Salvador em 1549 como a primeira capital colonial com o governador Tomé de Sousa.", ["1534: Criação das Capitanias Hereditárias por D. João III", "Carta de Doação e Foral: Instrumentos jurídicos que definiam posse inalienável e deveres fiscais à Coroa", "1548: Regimento do Governo-Geral e criação de Salvador (1549)", "Tomé de Sousa: Primeiro governador-geral, acompanhado por jesuítas liderados por Manuel da Nóbrega", "Cargos auxiliares: Ouvidor-mor (justiça), Provedor-mor (finanças) e Capitão-mor (defesa costeira)"], "O Governo-Geral não extinguiu as Capitanias Hereditárias; ele veio para coordenar e auxiliar a defesa e administração sem anular os donatários existentes.", "Trecho do Regimento de Tomé de Sousa outorgado por D. João III (1548):\n\n'Ordeno que nas ditas terras do Brasil se faça uma povoação e fortaleza grande e forte, em lugar conveniente, para dela se dar favor e ajuda às outras capitanias e se ministrar a justiça e prover as coisas de minha fazenda e defesa de meus vassalos.'\n\n(Fonte: Regimento do Governador-Geral, Arquivo Nacional da Torre do Tombo).", "A criação do Governo-Geral em 1548 decorreu da necessidade da monarquia lusitana de:", ["substituir a exploração açucareira pelo cultivo exclusivo de especiarias asiáticas no interior.", "conceder autonomia política completa às câmaras municipais formadas pelos homens-bons locais.", "proibir a atuação de ordens religiosas jesuíticas em toda a faixa litorânea do Atlântico Sul.", "declarar a igualdade jurídica plena entre colonizadores portugueses e populações indígenas escravizadas.", "centralizar a autoridade administrativa e a defesa militar diante das deficiências das capitanias hereditárias."], 4, "Passo a passo:\n1. Fonte e contexto: O documento de 1548 ordena a fundação de uma praça forte (Salvador) para socorrer as capitanias e centralizar a fazenda e a justiça.\n2. Raciocínio: A fragilidade financeira e as rebeliões indígenas mostraram a ineficiência do modelo estritamente descentralizado, exigindo um poder central coordenador no Brasil (Gabarito E).\n3. Distratores: A confunde produtos (o açúcar se expandiu); C erra, pois o objetivo era subordinar os poderes locais a um centro régio; D é falsa (Tomé de Sousa veio com os primeiros jesuítas); E é um absurdo anacrônico ante a opressão colonial."], "Economia Açucareira e Sociedade dos Engenhos": ["A produção de açúcar consolidou a colonização portuguesa no Nordeste a partir da segunda metade do século XVI, aproveitando o solo fértil de massapê, o clima favorável e a proximidade com o mercado consumidor europeu. O sistema de plantation estruturou-se no tripé: latifúndio monocultor, mão de obra escravizada (inicialmente indígena e predominantemente africana) e produção voltada à exportação. A sociedade do engenho era patriarcal, ruralizada, estratificada e escravocrata, com o senhor de engenho detendo poder econômico, militar e político através das Câmaras Municipais ('homens-bons'), enquanto na base a população negra escravizada sofria violências desumanizadoras cotidianas.", ["Plantation: Latifúndio, monocultura da cana-de-açúcar, trabalho escravo e exportação", "Engenho: Unidade produtiva complexa formada por casa-grande, senzala, canavial, capela e moenda", "Sociedade Patriarcal: Domínio absoluto do senhor de engenho sobre a família e os dependentes", "Capital holandês: Financiamento de maquinários e controle do refino e da distribuição na Europa", "Câmaras Municipais: Órgãos de poder local controlados pelos proprietários de terra e escravos ('homens-bons')"], "Não confunda a casa-grande com toda a sociedade: havia setores intermediários (feitores, mestres de açúcar, artesãos, agregados), mas a estrutura social era bipolar e marcada pela rigidez da escravidão.", "Relato do padre Antonil em 'Cultura e Opulência do Brasil por suas Drogas e Minas' (1711):\n\n'Os escravos são as mãos e os pés do senhor de engenho, porque sem eles no Brasil não é possível fazer, conservar e aumentar fazenda, nem ter engenho corrente. E do modo com que se há com eles depende tê-los bons e fiéis para o trabalho, ou rebeldes e fugitivos pelos matos.'\n\n(Fonte: Antonil, Cultura e Opulência do Brasil, 1711).", "A passagem da obra de Antonil destaca uma característica fundamental da estrutura socioeconômica do Brasil colonial:", ["a total dependência da economia dos engenhos em relação à exploração da força de trabalho escravizada.", "a substituição precoce do trabalho escravo pelo regime de assalariamento livre nas lavouras do Nordeste.", "o caráter igualitário das relações de trabalho estabelecidas entre mestres açucareiros e trabalhadores cativos.", "a ausência de qualquer forma de resistência ou fuga por parte das populações africanas escravizadas.", "a prioridade concedida à produção de alimentos para o mercado interno colonial em detrimento do açúcar."], 0, "Passo a passo:\n1. Fonte e contexto: O jesuíta Antonil escreveu em 1711 uma descrição detalhada da economia colonial do açúcar e das minas.\n2. Raciocínio: Ao definir os escravos como 'as mãos e os pés do senhor de engenho', o autor evidencia que toda a riqueza e funcionamento da lavoura assentavam-se na exploração violenta da escravidão (Gabarito A).\n3. Distratores: A é historicamente falsa para o século XVIII; C é um contrassenso em uma sociedade escravista; D contradiz o próprio texto ('rebeldes e fugitivos pelos matos'); E erra a lógica mercantilista de exportação monocultora."], "União Ibérica e Invasões Holandesas": ["Com a crise sucessória de Portugal e o desaparecimento de D. Sebastião, o rei Filipe II da Espanha assumiu a Coroa lusitana em 1580, iniciando a União Ibérica (1580-1640). Como consequência, os inimigos da Espanha tornaram-se inimigos de Portugal. As Províncias Unidas dos Países Baixos (Holanda), que disputavam a independência contra os espanhóis e haviam sido proibidas de comerciar o açúcar brasileiro, fundaram a Companhia das Índias Ocidentais (WIC). Após fracassarem na Bahia (1624), os holandeses invadiram e ocuparam Pernambuco entre 1630 e 1654. O governo de Maurício de Nassau (1637-1644) marcou o ápice da presença holandesa, com obras urbanísticas em Recife, liberdade religiosa e fomento científico e artístico.", ["1580-1640: União Ibérica sob a dinastia dos Felipes da Espanha", "Anulação do Tratado de Tordesilhas: Fronteira aberta que permitiu o avanço de bandeirantes ao interior", "Companhia das Índias Ocidentais (WIC): Empresa holandesa de comércio e conquista militar", "Maurício de Nassau: Governo caracterizado por tolerância religiosa e incentivos à cultura e urbanismo", "Insurreição Pernambucana (1645-1654): Movimento luso-brasileiro de expulsão dos holandeses (Batalhas dos Guararapes)"], "A expulsão dos holandeses provocou a concorrência do açúcar produzido por eles nas Antilhas, gerando uma crise prolongada na economia açucareira tradicional do Nordeste luso-brasileiro.", "Trecho de proclamação de Maurício de Nassau aos moradores de Pernambuco (1637):\n\n'Prometemos a todos os habitantes, assim portugueses como naturais da terra, livre exercício de sua religião católica, conservação de seus bens e privilégios, bem como créditos para que possam reformar os engenhos arruinados pelas guerras e retomar a moagem dos canaviais.'\n\n(Fonte: Documentos Holandeses no Brasil, Instituto Arqueológico de Pernambuco).", "A política de alianças implementada pela administração de Maurício de Nassau em Pernambuco visava:", ["promover a conversão compulsória de toda a população colonizada à fé calvinista holandesa.", "garantir a cooperação da elite proprietária luso-brasileira para restabelecer a produção e a rentabilidade do açúcar.", "decretar a abolição imediata da escravidão para recrutar trabalhadores africanos nos exércitos da WIC.", "anexar permanentemente o território pernambucano à Coroa imperial espanhola de Filipe IV.", "destruir os engenhos nordestinos para transferir a indústria açucareira para os portos de Amsterdã."], 1, "Passo a passo:\n1. Fonte e contexto: Nassau buscou apaziguar a colônia conquistada concedendo empréstimos e tolerância aos católicos e judeus.\n2. Raciocínio: A WIC precisava que os senhores de engenho produzissem açúcar para auferir lucros com o frete e refino; daí a concessão de crédito e respeito aos bens dos colonos luso-brasileiros (Gabarito B).\n3. Distratores: B contradiz a tolerância explícita no texto; C é anacrônica (os holandeses foram grandes traficantes de escravizados africanos); D erra, pois a Holanda lutava contra a Espanha; E contraria a lógica da WIC em lucrar com o engenho em pleno funcionamento."], "Bandeirismo e Expansão Territorial": ["Originárias da vila de São Paulo, uma região periférica e empobrecida no século XVII, as expedições bandeirantes desbravaram o sertão brasileiro desrespeitando os limites do Tratado de Tordesilhas. Impulsionadas pelo apresamento indígena (aproveitando o bloqueio do tráfico africano durante as guerras holandesas) e pela busca de metais preciosos, as bandeiras atacaram violentamente missões jesuíticas espanholas no Sul (como Guairá e Tape). As monções eram expedições fluviais que abasteciam áreas mineradoras. As bandeiras foram responsáveis pela expansão geográfica que delineou as fronteiras do Brasil moderno, mas custaram o massacre e a escravização de dezenas de milhares de indígenas.", ["Bandeiras de apresamento: Caça e escravização de indígenas, especialmente nas missões jesuíticas", "Bandeiras de prospecção: Busca por ouro e diamantes que culminou nas descobertas em Minas Gerais (fim do séc. XVII)", "Sertanismo de contrato: Contratação de bandeirantes por latifundiários para destruir quilombos (ex.: Domingos Jorge Velho e Palmares)", "Entradas versus Bandeiras: Entradas eram expedições oficiais da Coroa; bandeiras eram empreendimentos particulares", "Tratado de Madri (1750): Princípio do uti possidetis reconhecendo a posse territorial efetiva portuguesa"], "Cuidado com a mitificação do bandeirante como herói civilizador: a historiografia contemporânea destaca o caráter mercantil, violento e predatório de suas ações contra indígenas e quilombolas.", "Carta do jesuíta Montoya sobre o ataque bandeirante às reduções do Guairá (1629):\n\n'Vieram os paulistas com armas de fogo e grande multidão de tupis aliados, cercaram a igreja e arrancaram mais de mil índios batizados, matando os que resistiam e levando homens, mulheres e crianças atados em cordas para serem vendidos como escravos em São Paulo.'\n\n(Fonte: Cartas Jesuíticas dos Séculos XVI e XVII).", "A atuação das bandeiras paulistas no século XVII relacionou-se diretamente com:", ["a defesa pacífica das terras comunais indígenas contra as invasões de colonos estrangeiros.", "a construção de um modelo econômico urbano baseado exclusivamente em mão de obra assalariada.", "a busca de mão de obra indígena escravizada e de metais preciosos, rompendo as fronteiras de Tordesilhas.", "o apoio militar incondicional aos jesuítas espanhóis na criação de um Estado indígena independente.", "o cumprimento rigoroso dos limites geográficos estipulados no Tratado de Tordesilhas assinado em 1494."], 2, "Passo a passo:\n1. Fonte e contexto: A carta de Montoya documenta a devastação das missões no sul pelos paulistas caçadores de cativos indígenas.\n2. Raciocínio: A carência de recursos em São Paulo e a demanda por escravos levaram à interiorização e captura de nativos, descumprindo a linha de Tordesilhas (Gabarito C).\n3. Distratores: A e D invertem a relação antagônica com os jesuítas e a violência contra nativos; C erra as relações de produção (escravistas); E nega o fato básico da penetração sertaneja além do meridiano."], "Ciclo do Ouro e Sociedade Mineradora": ["A descoberta de jazidas auríferas no final do século XVII em Minas Gerais, Goiás e Mato Grosso transformou a dinâmica da América portuguesa. A mineração provocou intensa migração interna e vinda de reinóis, deslocando o eixo econômico e político do Nordeste para o Centro-Sul (resultando na transferência da capital de Salvador para o Rio de Janeiro em 1763). A sociedade mineradora era mais urbana, diversa e estratificada que a dos engenhos, desenvolvendo expressiva classe média (artesãos, tropeiros, comerciantes, advogados) e o florescimento do Barroco Mineiro de Aleijadinho. A Coroa intensificou a cobrança fiscal (o quinto, as Casas de Fundição, a finta e a temida derrama), gerando profunda insatisfação popular.", ["1693-1695: Primeiras grandes descobertas de ouro nas 'Minas Gerais'", "Casas de Fundição e Quinto: Ouro fundido em barras com o selo real e cobrança compulsória de 20%", "Derrama: Cobrança forçada do saldo tributário quando a cota anual de 100 arrobas de ouro não era atingida", "1763: Transferência da capital de Salvador para o Rio de Janeiro pelo Marquês de Pombal", "Barroco e Rococó Mineiro: Expressão artística marcante com Aleijadinho e Mestre Ataíde"], "Apesar da maior mobilidade social e da existência de libertos, a sociedade mineradora permaneceu essencialmente escravista, com condições de trabalho nas galerias ainda mais degradantes e curta expectativa de vida.", "Carta Régia de D. João V sobre a criação das Casas de Fundição (1719):\n\n'Ordeno que todo o ouro que se tirar das minas seja levado à Casa de Fundição mais próxima, onde se cobrará o quinto para a minha Fazenda Real, sendo o restante marcado e fundido em barras, ficando expressamente proibido o comércio de ouro em pó sob pena de confisco de todos os bens e degredo para a África.'\n\n(Fonte: Legislação Régia Portuguesa, Tomo VI).", "A rígida fiscalização imposta pela Coroa portuguesa na região das Minas Gerais tinha por finalidade:", ["incentivar a circulação livre de metais preciosos para estimular as manufaturas fabris coloniais.", "distribuir a riqueza aurífera igualmente entre os mineradores independentes e a população escravizada.", "promover a separação pacífica da capitania de Minas Gerais em relação ao Império colonial luso.", "reprimir o contrabando de ouro em pó e assegurar a arrecadação integral dos tributos devidos ao erário régio.", "isentar a elite mineradora do pagamento de impostos em virtude dos riscos da extração subterrânea."], 3, "Passo a passo:\n1. Fonte e contexto: A criação das Casas de Fundição proibia o ouro em pó e retinha o imposto real de 20% (quinto).\n2. Raciocínio: A Coroa pretendia bloquear as inúmeras rotas de contrabando e garantir que nenhuma grama circulasse sem o pagamento do imposto real (Gabarito D).\n3. Distratores: B contradiz o exclusivo metropolitano (manufaturas foram inclusive proibidas em 1785 pelo Alvará de D. Maria I); C é um disparate em uma colônia escravocrata; D e E contrariam frontalmente os interesses fazendários de Lisboa."], "Escravidão Colonial e Resistência Quilombola": ["A escravidão de africanos foi o sustentáculo econômico, social e institucional do Brasil por mais de três séculos. O tráfico transatlântico mercantilizou seres humanos de diversas etnias (bantos, iorubás, jejes) e os desumanizou nos trabalhos agrícolas, mineradores e domésticos. Diante do cativeiro e dos castigos corporais, os escravizados articularam múltiplas formas de resistência cotidiana: suicídios, infanticídios, sabotagens, quebra de ferramentas, negociações por brechas de autonomia, preservação de tradições religiosas (sincretismo) e, com destaque, as fugas e a fundação de quilombos. O Quilombo dos Palmares, na Serra da Barriga (atual Alagoas), resistiu por quase um século, abrigando milhares de negros, indígenas e homens livres sob a liderança de Ganga Zumba e Zumbi.", ["Tráfico Transatlântico: Deslocamento forçado de milhões de africanos com alta mortalidade nos tumbeiros", "Quilombo dos Palmares: Maior comunidade quilombola do período colonial, destruída em 1695 por Domingos Jorge Velho", "20 de Novembro de 1695: Assassinato de Zumbi dos Palmares, data símbolo do Dia da Consciência Negra", "Formas de Resistência: Fugas, revoltas, preservação cultural, irmandades religiosas e compra de alforrias", "Brecha Camponesa: Pequenas lavouras autônomas cultivadas pelos escravizados aos domingos para comércio e subsistência"], "Resistência escrava não foi apenas fuga para quilombo ou luta armada: a historiografia valoriza a resistência cultural diária, a solidariedade nas irmandades e as negociações por direitos costumeiros.", "Relato do cronista Fernão de Cardim sobre a fuga de cativos (1584):\n\n'Se os negros fogem e se metem pelos matos, fazem mocambos e vivem da caça e do que roubam nos caminhos; e quando se juntam muitos, é necessária muita gente armada para os desbaratar, porque se defendem com grande ousadia e conhecimento da terra.'\n\n(Fonte: Tratados da Terra e Gente do Brasil).", "A formação de mocambos e quilombos no Brasil colonial representava:", ["uma estratégia consentida pelos senhores para isolar os trabalhadores considerados inaptos para o trabalho rural.", "um agrupamento cooperativo patrocinado pelo governo metropolitano para colonizar áreas florestais inexploradas.", "uma instituição criada pela Igreja Católica para catequizar pacificamente escravizados recém-desembarcados.", "uma tentativa pacífica dos colonizadores de integrar as lideranças tribais africanas à burocracia colonial.", "um espaço de resistência política, social e cultural contra o regime opressivo da escravidão."], 4, "Passo a passo:\n1. Fonte e contexto: O relato de 1584 demonstra que a fuga e a fundação de mocambos acompanharam a colonização desde os seus primórdios.\n2. Raciocínio: Os quilombos eram polos de contestação ativa da autoridade senhorial e colonial, reconstruindo modos de vida comunitários e autônomos (Gabarito E).\n3. Distratores: A, C, D e E atribuem a formação dos quilombos a senhores, à Coroa ou à Igreja, o que é um erro crasso, desconsiderando o protagonismo negro na luta pela própria liberdade."], "Revoltas Nativistas: Beckman e Emboabas": ["As revoltas nativistas, ocorridas entre o fim do século XVII e o início do XVIII, refletiam conflitos entre colonos ('nascidos na terra') e reinóis (portugueses metropolitanos) por interesses econômicos locais imediatos, sem contestar o pacto colonial nem almejar a independência nacional. A Revolta de Beckman (Maranhão, 1684) explodiu contra o monopólio mercantil abusivo da Companhia de Comércio do Maranhão e a oposição dos jesuítas à escravização de indígenas. A Guerra dos Emboabas (Minas Gerais, 1707-1709) opôs os bandeirantes paulistas pioneiros aos imigrantes reinóis e baianos ('emboabas') pelo controle das jazidas auríferas recém-descobertas, resultando na expulsão dos paulistas e na criação da Capitania de São Paulo e Minas de Ouro.", ["1684: Revolta de Beckman no Maranhão (liderada pelos irmãos Manuel e Tomás Beckman)", "Companhia Geral de Comércio do Maranhão: Falha no fornecimento de escravos africanos e preços inflacionados", "1707-1709: Guerra dos Emboabas em Minas Gerais (liderança de Manuel Nunes Viana)", "Capão da Traição: Massacre de paulistas desarmados pelas forças emboabas", "Guerra dos Mascates (1710-1711): Conflito em Pernambuco entre os aristocratas de Olinda e os mascates do Recife"], "Diferencie revoltas nativistas (locais, sem projeto separatista) de revoltas emancipacionistas (influenciadas pelo Iluminismo, anticoloniais e separatistas, como a Inconfidência Mineira).", "Documento dos colonos do Maranhão encaminhado a Lisboa (1684):\n\n'Queixam-se os moradores desta capitania do intolerable monopólio da Companhia de Comércio, que cobra preços exorbitantes pelos gêneros essenciais e não fornece o número de escravos prometido, impedindo o sustento de nossas famílias e nos proibindo de buscar índios para nossas roças.'\n\n(Fonte: Manuscritos Coloniais, Biblioteca Nacional).", "A Revolta de Beckman (1684) e a Guerra dos Emboabas (1707-1709) caracterizaram-se como rebeliões nativistas porque:", ["expressavam tensões e divergências corporativas locais entre colonos e a metrópole sem romper com o vínculo colonial.", "pretendiam proclamar repúblicas independentes inspiradas na Revolução Francesa e nas ideias liberais.", "defendiam a abolição imediata da escravidão e a reforma agrária em benefício dos indígenas e mestiços.", "lutavam pela união militar entre o Brasil e as colônias hispânicas sob a Coroa espanhola.", "combatiam o cultivo de produtos de exportação em favor da restauração da economia de subsistência indígena."], 0, "Passo a passo:\n1. Fonte e contexto: A petição dos revoltosos maranhenses reclama da companhia monopolista e dos jesuítas, sem propor ruptura com o rei.\n2. Raciocínio: As revoltas nativistas tinham motivações econômicas regionais imediatas e lealdade monárquica, diferindo das conjurações do final do século XVIII (Gabarito A).\n3. Distratores: A é anacrônica (antecede o Iluminismo revolucionário); B erra, pois colonos queriam explorar o trabalho alheio; D e E inventam objetivos incompatíveis com os colonos do Antigo Regime."], "Conjuração Mineira (Inconfidência)": ["A Conjuração Mineira de 1789 foi um movimento emancipacionista de caráter elitista ocorrido na Capitania de Minas Gerais, impulsionado pela decadência da produção aurífera e pela iminência da cobrança da 'derrama' pelo governador Visconde de Barbacena. Influenciados pelas ideias iluministas e pela Independência dos Estados Unidos (1776), os inconfidentes (proprietários de terras, mineradores endividados com a Coroa, poetas e militares, como o alferes Joaquim José da Silva Xavier, o Tiradentes) planejavam assassinar o governador, proclamar uma república com capital em São João del-Rei e fundar uma universidade em Vila Rica. O movimento, contudo, não chegou a se concretizar: delatado por Joaquim Silvério dos Reis em troca do perdão de suas dívidas, foi desbaratado pelas autoridades régias.", ["1789: Conspiração em Vila Rica (Minas Gerais)", "Derrama: Cobrança compulsória de tributos atrasados que serviu de estopim conspiratório", "Lema: 'Libertas Quae Sera Tamen' (Liberdade ainda que tardia), inspirado no poeta latino Virgílio", "Limitação social: Movimento de elite que não previa a abolição da escravidão por interesse dos grandes proprietários", "1792: Enforcamento e esquartejamento de Tiradentes no Rio de Janeiro como exemplo punitivo"], "A Inconfidência Mineira não era abolicionista! Os líderes eram grandes senhores de escravos e endividados da Fazenda Real. O projeto de república era restrito aos homens proprietários.", "Depoimento constante nos Autos da Devassa da Inconfidência Mineira (1789):\n\n'Perguntado ao réu sobre o que pretendiam com a sedição projetada na capitania, respondeu que o intento era fazer deste país uma república independente da Coroa de Portugal no dia em que o senhor governador lançasse a derrama, tomando por modelo o que haviam feito as colônias da América do Norte.'\n\n(Fonte: Autos da Devassa da Inconfidência Mineira, Imprensa Oficial).", "A Conjuração Mineira de 1789 expressou os interesses de setores da elite colonial que, influenciados pelo ideário iluminista, propunham:", ["a extinção do tráfico negreiro e a concessão de terras públicas aos escravizados forros das minas.", "a separação política em relação a Portugal e a fundação de uma ordem republicana, mantendo intocada a escravidão.", "a manutenção da dependência colonial portuguesa condicionada à concessão de empréstimos sem juros a Lisboa.", "a imediata restauração do Pacto Colonial nos moldes do século XVI e o fechamento do porto do Rio de Janeiro.", "a criação de uma monarquia absolutista em que o alferes Tiradentes exerceria a coroa de forma hereditária."], 1, "Passo a passo:\n1. Fonte e contexto: Os Autos da Devassa registram o projeto republicano dos inconfidentes pautado na independência norte-americana.\n2. Raciocínio: Os inconfidentes queriam o rompimento colonial e o calote de suas dívidas com a Coroa, mas, sendo senhores de cativos, não defenderam o fim da escravidão (Gabarito B).\n3. Distratores: B descreve uma proposta abolicionista que o movimento não abraçou; C e D contrariam a meta central da independência; E inventa um delírio monárquico absolutista para Tiradentes."], "Conjuração Baiana (Revolta dos Alfaiates)": ["A Conjuração Baiana de 1798, também chamada de Revolta dos Alfaiates ou Revolução dos Búzios, foi um movimento emancipacionista de perfil marcadamente popular e radical que eclodiu em Salvador. Motivada pela transferência da capital para o Rio de Janeiro (1763), pela crise de abastecimento e pela escassez de alimentos, a revolta foi influenciada pela fase jacobina da Revolução Francesa e pela Revolução do Haiti. Liderada por soldados, alfaiates, homens livres pobres e escravizados (como Lucas Dantas, Manuel Faustino, Luís Gonzaga das Virgens e João de Deus), a conjuração panfletou pedindo a proclamação da República Baiense, a liberdade de comércio, igualdade racial e a abolição irrestrita da escravidão. Desbaratada antes de eclodir, seus líderes populares foram sumariamente enforcados.", ["1798: Revolta dos Alfaiates em Salvador (Bahia)", "Composição social: Participação preponderante de alfaiates, soldados pobres, negros libertos e escravizados", "Reivindicações: República, igualdade jurídica e racial, abertura dos portos e abolição imediata da escravidão", "Influência ideológica: Jacobinismo da Revolução Francesa e exemplo da Revolução Negra do Haiti", "Repressão implacável: Quatro líderes negros e pardos enforcados e esquartejados na Praça da Piedade (1799)"], "Compare sempre: Conjuração Mineira (1789) foi elitista e não abolicionista; Conjuração Baiana (1798) foi popular, antirracista e abolicionista.", "Boletim sedicioso afixado nas portas das igrejas de Salvador (1798):\n\n'Aviso grande e panfleto à nação baense: Está para chegar o tempo venturoso de nossa liberdade, tempo em que seremos todos irmãos, tempo em que seremos todos iguais. O grande e invencível povo republicano quer a liberdade dos comércios e o fim do cativeiro da escravidão.'\n\n(Fonte: Documentos Históricos da Bahia, Fundo da Inconfidência Baiana).", "Comparada à Conjuração Mineira de 1789, a Conjuração Baiana de 1798 destacou-se por apresentar um programa político e social que incluía expressamente:", ["a aliança diplomática com o império colonial britânico para reabrir o tráfico de cativos da África.", "a defesa da monarquia constitucional sob a tutela de príncipes da dinastia portuguesa de Bragança.", "a erradicação da escravidão e a garantia de igualdade racial e social entre os cidadãos.", "a preservação irrestrita do monopólio comercial exercido pelos grandes traficantes portugueses em Salvador.", "a exclusão deliberada de artesãos, militares subalternos e trabalhadores pobres das decisões públicas."], 2, "Passo a passo:\n1. Fonte e contexto: O panfleto afixado em 1798 conclama o 'povo republicano' à fraternidade, igualdade e 'fim do cativeiro da escravidão'.\n2. Raciocínio: A Conjuração Baiana distinguiu-se das demais rebeliões do período colonial por seu caráter popular e pela defesa taxativa do abolicionismo e da igualdade de direitos para negros e pardos (Gabarito C).\n3. Distratores: A e D contrariam a abertura dos portos e a abolição; B erra a forma de governo (eram republicanos radicais); E descreve o elitismo da Inconfidência Mineira, não da Baiana."], "Primeira Guerra Mundial e Tratado de Versalhes": ["A Primeira Guerra Mundial (1914-1918) originou-se das rivalidades imperialistas geradas pela Segunda Revolução Industrial, disputas por mercados coloniais, corrida armamentista e tensões nacionalistas na Europa (pangermanismo e pan-eslavismo). O sistema de alianças dividiu as potências entre a Tríplice Entente (Reino Unido, França e Rússia) e a Tríplice Aliança (Alemanha, Áustria-Hungria e Itália, que trocou de lado em 1915). O assassinato do herdeiro austríaco Francisco Ferdinando em Sarajevo desencadeou a guerra em cadeia. Após a fase de trincheiras e a entrada decisiva dos EUA em 1917, a Alemanha foi derrotada. O Tratado de Versalhes (1919) impôs punições humilhantes aos alemães (perda territorial, desmilitarização e reparações astronômicas), alimentando o revanchismo que abriu caminho ao nazismo.", ["Causas estruturais: Imperialismo, corrida armamentista (Paz Armada) e nacionalismos inflamados", "Guerra de Trincheiras: Conflito estático e letal com uso pioneiro de metralhadoras, tanques e gases venenosos", "1917: Saída da Rússia pós-revolução bolchevique e entrada militar decisiva dos Estados Unidos", "Tratado de Versalhes (1919): Cláusula de culpa de guerra alemã e criação da Liga das Nações", "Diktat: Sentimento de humilhação alemã que fomentou o surgimento do Partido Nazista"], "O Tratado de Versalhes não construiu uma paz duradoura; historiadores como Eric Hobsbawm o definem como uma trégua de vinte anos que semeou o ódio e as condições materiais para a Segunda Guerra.", "Artigo 231 do Tratado de Versalhes (1919):\n\n'Os Governos Aliados e Associados declaram, e a Alemanha reconhece, que a Alemanha e seus aliados são responsáveis, por tê-los causado, por todas as perdas e danos sofridos pelos Governos Aliados e Associados e seus concidadãos em consequência da guerra que lhes foi imposta pela agressão da Alemanha e seus aliados.'\n\n(Fonte: Tratado de Paz entre os Aliados e a Alemanha, Versalhes, 1919).", "A imposição do Artigo 231 do Tratado de Versalhes e das demais cláusulas punitivas à Alemanha produziu no entreguerras:", ["o fortalecimento definitivo das democracias parlamentares em toda a Europa Central.", "um clima de estabilidade econômica internacional baseado no desarmamento mútuo e solidário.", "a completa reconciliação diplomática entre a França e a República de Weimar.", "um sentimento de humilhação nacional e crise econômica que alimentou discursos ultranacionalistas de revanche.", "a conversão imediata do exército alemão a ideais pacifistas defendidos pela Liga das Nações."], 3, "Passo a passo:\n1. Fonte e contexto: O artigo 231 obrigou a Alemanha a assumir a culpa exclusiva pelo conflito mundial.\n2. Raciocínio: A humilhação territorial, as indenizações confiscatórias e a hiperinflação geraram ressentimento generalizado na população alemã, terreno fértil para a ascensão do totalitarismo nazista de Hitler (Gabarito D).\n3. Distratores: A, B, C e E descrevem um cenário pacífico e estável que foi completamente desmentido pela crise brutal dos anos 1920 e 1930."], "Revolução Russa de 1917 e Formação da URSS": ["A Rússia czarista do início do século XX combinava uma monarquia autocrática falida, servidão camponesa no campo e industrialização tardia com superexploração operária. O envolvimento desastroso na Primeira Guerra Mundial colapsou o abastecimento, provocando a Revolução de Fevereiro de 1917 que derrubou o czar Nicolau II e instaurou um Governo Provisório burguês. Em outubro de 1917, os bolcheviques, liderados por Lenin e Trotsky sob o lema 'Paz, Pão e Terra' e a palavra de ordem 'Todo poder aos sovietes', tomaram o poder. Seguiu-se uma violenta Guerra Civil (1918-1921), o 'Comunismo de Guerra' e, para reerguer a economia destruída, a NEP (Nova Política Econômica, permitindo práticas capitalistas controladas). Em 1922, fundou-se a União das Repúblicas Socialistas Soviéticas (URSS).", ["Czarismo: Autocracia imperial absolutista da dinastia Romanov apoiada pela nobreza e Igreja Ortodoxa", "Sovietes: Conselhos deliberativos de operários, camponeses e soldados", "Teses de Abril (Lenin): Ruptura com o governo burguês e nacionalização imediata dos bancos e latifúndios", "NEP (Nova Política Econômica, 1921): Reintrodução temporária de comércio privado para evitar a fome generalizada", "Ascensão de Stalin (1924): Disputa com Trotsky ('socialismo num só país' versus 'rev
