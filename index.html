rça política que dirige a Nação reside nos governos dos Estados. A política dos Estados é a política nacional. O Presidente da República, apoiando os governadores em suas províncias, assegura a cooperação pacífica da Câmara e do Senado para governar em paz.'\n\n(Fonte: Cartas Políticas de Campos Sales, Coleção Documentos Brasileiros).", "O arranjo político concebido por Campos Sales para viabilizar a governabilidade federal assentava-se no:", ["incentivo a rebeliões populares urbanas para dissolver as oligarquias rurais dissidentes.", "fechamento permanente do Congresso Nacional e governo por decretos-leis militares arbitrários.", "sorteio público de mandatos legislativos entre os trabalhadores das ferrovias e dos portos cafeeiros.", "apoio mútuo entre o Executivo federal e as oligarquias estaduais dominantes, neutralizando a oposição parlamentar.", "rompimento diplomático com governos estaduais que não adotassem a reforma agrária socialista."], 3, "Passo a passo:\n1. Fonte e contexto: A carta de Campos Sales explicita a doutrina de governar a partir do pacto com os governadores estaduais.\n2. Raciocínio: A Política dos Governadores eliminou o risco de impeachment do presidente da República e conferiu aos clãs estaduais carta branca para mandarem em suas províncias sem interferência federal (Gabarito D).\n3. Distratores: A, B, D e E apontam mecanismos inexistentes e incompatíveis com a dominação oligárquica conservadora da Primeira República."], "Guerra de Canudos e Messianismo Sertanejo": ["A Guerra de Canudos (1896-1897), ocorrida no sertão da Bahia, foi o mais trágico conflito social e messiânico da Primeira República. Liderados pelo beato cearense Antônio Conselheiro, milhares de sertanejos pobres, ex-escravizados, vaqueiros e indígenas reuniram-se no arraial de Belo Monte, às margens do rio Vaza-Barris. Canudos tornou-se uma comunidade autônoma e comunitária que cresceu para mais de 25 mil habitantes, desafiando a ordem dos coronéis locais, a cobrança de tributos da jovem República e a autoridade do clero católico tradicional. Vista pela imprensa e pelo Exército como um enclave monarquista e fanático que ameaçava o regime, a comunidade foi alvo de quatro expedições militares sucessivas. Após derrotar as três primeiras tropas governamentais, Canudos foi inteiramente destruída pela quarta expedição munida de canhões pesados, culminando no massacre da população indefesa.", ["Antônio Conselheiro: Líder religioso messiânico e peregrino que acolheu as massas desvalidas do sertão", "Belo Monte / Canudos: Comunidade comunitária de partilha da terra sem coronéis, sem impostos e sem miséria extrema", "Messianismo: Crença na salvação divina e em um líder carismático contra a opressão social", "Quatro Expedições Militares: As primeiras três foram humilhadas e aniquiladas pela tática sertaneja de guerrilha na caatinga", "Euclides da Cunha: Jornalista e autor de 'Os Sertões' (1902), que denunciou a campanha como 'um crime' de Estado"], "Canudos não era uma conspiração armada monarquista paga do exterior como dizia a propaganda governamental; era uma resposta de sobrevivência social e fé contra o abandono e a violência do latifúndio no sertão.", "Trecho clássico de 'Os Sertões', de Euclides da Cunha (1902):\n\n'Canudos não se rendeu. Exemplo único em toda a história, resistiu até ao esgotamento completo. Vencido desde o primeiro dia, combateu até o último homem. Caiu no dia 5 de outubro, ao entardecer, quando caíram os seus últimos quatro defensores: um velho, dois homens feitos e uma criança, na frente dos quais rugiam raivosamente cinco mil soldados da República.'\n\n(Fonte: Euclides da Cunha, Os Sertões, 1902).", "A narrativa de Euclides da Cunha sobre o desfecho da Guerra de Canudos denuncia:", ["o patriotismo exemplar dos generais federais que preservaram a vida de todas as famílias do arraial baiano.", "a vitória militar dos seguidores de Antônio Conselheiro, que marcharam vitoriosos sobre o Rio de Janeiro.", "a rendição imediata dos sertanejos perante o primeiro apelo pacífico transmitido pelo Ministério da Guerra.", "o apoio financeiro e diplomático maciço concedido pela Inglaterra aos defensores de Belo Monte.", "a desproporção e a violência impiedosa do Estado republicano contra uma população sertaneja miserável que lutava pela sobrevivência."], 4, "Passo a passo:\n1. Fonte e contexto: Euclides da Cunha registrou em 'Os Sertões' a agonia de Canudos, cobrindo o massacre como correspondente do jornal 'O Estado de S. Paulo'.\n2. Raciocínio: O autor desconstrói o discurso oficial civilizatório da República, mostrando que a expedição foi um massacre genocida desmedido contra pessoas empobrecidas que apenas defendiam sua terra e seu modo de vida (Gabarito E).\n3. Distratores: A é refutada pela degola de prisioneiros e destruição total; C é falsa (Canudos foi destruída); D é negada pelo próprio texto ('resistiu até o último homem'); E é uma calúnia conspiratória inventada pela imprensa republicana da época."], "Guerra do Contestado e Conflitos de Fronteira": ["A Guerra do Contestado (1912-1916) eclodiu na região fronteiriça disputada pelos estados do Paraná e de Santa Catarina, rica em erva-mate e madeira. A construção da ferrovia São Paulo-Rio Grande pela empresa norte-americana 'Brazil Railway Company', do empresário Percival Farquhar, provocou a expulsão violenta de milhares de famílias de posseiros e caboclos de suas terras ancestrais. Sem assistência após a conclusão das obras e despojados de seus meios de vida, os caboclos uniram-se em torno da liderança messiânica do 'Monge' José Maria, fundando as 'Cidades Santas' sob um regime comunitário e rebelde. O governo federal enviou tropas do Exército com fuzis modernos, canhões e o uso pioneiro da aviação militar no Brasil, reprimindo brutalmente o movimento com o massacre de milhares de caboclos.", ["Região do Contestado: Território disputado entre PR e SC e cobiçado por multinacionais e coronéis", "Brazil Railway Company e Southern Brazil Lumber: Concessão imperialista que expropriou terras caboclas de 15 km de cada lado dos trilhos", "Monge José Maria: Figura messiânica que pregava a justiça divina e a 'Monarquia Celeste'", "Cidades Santas (Taquaruçu e Santa Maria): Redutos comunitários de resistência camponesa cabocla", "Aviação Militar: Primeiro conflito bélico na história brasileira com emprego de aviões de reconhecimento e bombardeio"], "A semelhança entre Canudos e Contestado é profunda: ambos foram movimentos messiânicos de camponeses deserdados da terra contra a violência dos coronéis e do Estado republicano que servia ao grande capital.", "Relato de um camponês caboclo do Contestado (1914):\n\n'Vieram os agrimensores da companhia estrangeira com os soldados do governo, mediram a terra onde nossos pais nasceram e nos disseram que agora ela pertencia ao gringo da ferrovia. Quem não saísse por bem, via sua roça queimada e a casa derrubada.'\n\n(Fonte: Memórias Orais do Contestado, Acervo Histórico de Caçador/SC).", "O conflito armado do Contestado (1912-1916) teve como uma de suas causas socioeconômicas estruturais:", ["a concessão de vastas extensões de terras públicas a conglomerados empresariais estrangeiros, resultando na desapropriação violenta de posseiros locais.", "a recusa dos fazendeiros catarinenses em comercializar erva-mate com as capitais dos países do Cone Sul.", "a revolta dos imigrantes italianos contra a obrigatoriedade do ensino da língua portuguesa nas escolas rurais.", "o apoio militar e financeiro prestado pela Força Aérea alemã para anexar o Sul do Brasil ao Império Germânico.", "a tentativa dos monges messiânicos de instituir o trabalho escravo compulsório nas lavouras de fumo da serra."], 0, "Passo a passo:\n1. Fonte e contexto: O depoimento oral demonstra a desapropriação forçada de terras habitadas por gerações em favor da construtora da ferrovia.\n2. Raciocínio: A doação governamental de terras à empresa de Farquhar expulsou os caboclos, que, sem alternativas de sobrevivência, organizaram a resistência messiânica das 'Cidades Santas' (Gabarito A).\n3. Distratores: B e C não constituíram os motores do conflito; D inventa uma conspiração bélica estrangeira inexistente; E inverte a moral dos caboclos, que viviam em cooperação comunitária."], "Revolta da Vacina e Higienismo Urbano": ["No início do século XX, a cidade do Rio de Janeiro, capital federal, vivia em condições sanitárias caóticas, com epidemias recorrentes de febre amarela, peste bubônica e varíola, o que lhe rendeu internacionalmente o pejorativo título de 'porto do túmulo dos estrangeiros'. O presidente Rodrigues Alves (1902-1906) e o prefeito Pereira Passos deram início a uma drástica reforma urbana ('Bota-Abaixo'), inspirada na modernização de Paris por Haussmann: abriram grandes avenidas (como a Avenida Central), demoliram centenas de cortiços no centro e expulsaram a população trabalhadora e negra para os morros periféricos, acelerando o processo de favelização. Paralelamente, o sanitarista Oswaldo Cruz assumiu a Diretoria Geral de Saúde Pública com métodos autoritários. Em 1904, a aprovação da lei que tornava a vacinação contra a varíola obrigatória culminou na violenta Revolta da Vacina.", ["1904: Revolta da Vacina no Rio de Janeiro com barricadas, tiroteios e bondes tombados", "Bota-Abaixo de Pereira Passos: Demolição de cortiços e saneamento elitista que empurrou as camadas populares para as favelas", "Oswaldo Cruz: Campanhas higienistas agressivas com brigadas sanitárias invadindo residências com auxílio policial", "Autoritarismo higienista: Ausência de campanhas educativas e desrespeito ao espaço privado dos lares populares", "Desdobramentos: Suspensão temporária da obrigatoriedade vacinal e deportação sumária de centenas de revoltosos para o Acre"], "A população não se revoltou por ser 'ignorante ou contrária à ciência': a revolta explodiu pelo acúmulo de opressão do Bota-Abaixo, invasão policial de suas casas e humilhação dos corpos femininos pelos vacinadores sem consentimento.", "Manchete do jornal 'Correio da Manhã' (Rio de Janeiro, 13 de novembro de 1904):\n\n'A cidade amanheceu em pé de guerra. Barricadas foram erguidas nas ruas da Saúde e Gamboa, bondes virados servem de trincheiras contra a cavalaria e o povo atira contra os oficiais da polícia aos gritos de: Abaixo a vacina obrigatória! Viva a liberdade do cidadão!'\n\n(Fonte: Correio da Manhã, 13 nov. 1904).", "A eclosão da Revolta da Vacina em 1904 articulou descontentamentos populares mais profundos relacionados a:", ["tentativas de restaurar o Império por meio de um golpe chefiado pelos antigos barões do açúcar de Salvador.", "violências e remoções forçadas promovidas pelas reformas urbanas combinadas com o autoritarismo das medidas sanitárias.", "desejos do operariado de fechar os portos para impedir a chegada de novas tecnologias industriais ao país.", "exigências de implantação da medicina alternativa indígena como único tratamento reconhecido pelo governo federal.", "acordos comerciais assinados com potências europeias que proibiam a produção de remédios no território nacional."], 1, "Passo a passo:\n1. Fonte e contexto: A cobertura jornalística de 1904 retrata o clima insurrecional na capital após o decreto da vacinação obrigatória.\n2. Raciocínio: A vacina foi o estopim de uma panela de pressão alimentada pelas demolições do 'Bota-Abaixo', pela alta do custo de vida e pela invasão domiciliar truculenta das brigadas sanitárias de Oswaldo Cruz (Gabarito B).\n3. Distratores: A é infundada (era um protesto popular autêntico); C e D inventam objetivos anacrônicos; E não tem conexão factual com as causas da revolta."], "Revolta da Chibata e Movimento Tenentista": ["A Primeira República foi profundamente abalada por rebeliões militares que questionavam as injustiças da ordem vigente. Em novembro de 1910, estourou a Revolta da Chibata na Marinha de Guerra: marinheiros negros e mestiços, liderados pelo marinheiro João Cândido ('o Almirante Negro'), amotinaram-se nos modernos encouraçados Minas Gerais e São Paulo na Baía de Guanabara, apontando os canhões para o Rio de Janeiro e exigindo o fim imediato dos castigos corporais (chibatadas), aumento salarial e alimentação decente. Na década de 1920, eclodiu o Movimento Tenentista: jovens oficiais do Exército de classe média que se revoltaram contra as oligarquias corruptas, exigindo moralização política, voto secreto, fim da fraude eleitoral e modernização do Estado. O tenentismo protagonizou episódios heroicos: os 18 do Forte de Copacabana (1922), a Revolução Paulista de 1924 e a épica marcha de mais de 25 mil km da Coluna Prestes (1925-1927).", ["1910: Revolta da Chibata liderada por João Cândido, exigindo o fim dos açoites corporais na Marinha", "Encouraçados Minas Gerais e São Paulo: Poder de fogo apontado para a capital forçando o governo de Hermes da Fonseca a prometer anistia (não cumprida)", "Tenentismo (década de 1920): Movimento de oficiais subalternos contra o controle oligárquico da República Velha", "18 do Forte de Copacabana (1922): Marcha heroica de tenentes na orla do Rio de Janeiro enfrentando forças legalistas", "Coluna Prestes (1925-1927): Marcha pelo interior do país liderada por Luís Carlos Prestes e Miguel Costa pregando a rebelião popular"], "Cuidado: O tenentismo não tinha um programa de reformas econômicas radicais ou socialistas; era um movimento nacionalista, moralista e reformista de classe média, que defendia a salvação da pátria pelas Forças Armadas.", "Carta do marinheiro João Cândido ao Presidente Hermes da Fonseca (novembro de 1910):\n\n'Cumpre-nos informar a Vossa Excelência que nós, marinheiros e cidadãos brasileiros, não podemos mais tolerar a escravidão que reina no interior dos navios da Marinha de Guerra. Não queremos mais a chibata que nos rasga as carnes como se fôssemos escravos no tempo da monarquia. Queremos ser tratados como homens honrados que servem à sua Pátria.'\n\n(Fonte: Memorial da Revolta da Chibata, Arquivo Nacional).", "A manifestação redigida por João Cândido e seus companheiros em 1910 evidencia que a Revolta da Chibata lutava contra:", ["a aliança diplomática estabelecida entre o governo de Hermes da Fonseca e os impérios coloniais absolutistas europeus.", "o recrutamento militar obrigatório imposto aos membros das famílias pertencentes à aristocracia cafeeira paulista.", "a permanência de práticas disciplinares herdeiras do período escravista no tratamento concedido aos marinheiros pelo oficialato da Marinha.", "a compra de encouraçados de guerra britânicos com vistas à destruição dos arsenais da marinha argentina.", "a adoção do sufrágio universal secreto nas eleições que definiam o comando das tropas militares das Forças Armadas."], 2, "Passo a passo:\n1. Fonte e contexto: A carta de João Cândido denuncia que a chibata perpetuava o cativeiro dentro dos navios da esquadra republicana.\n2. Raciocínio: Mesmo mais de vinte anos após a abolição formal da escravidão, o oficialato aristocrático branco aplicava chibatadas brutais na marujada negra, revelando a sobrevivência das violências escravistas na República (Gabarito C).\n3. Distratores: A, C, D e E contêm teses sem respaldo nos manifestos e nas reivindicações concretas dos marinheiros rebelados."], "Greve Geral de 1917 e Semana de Arte Moderna de 1922": ["O ano de 1917 foi o ápice da mobilização operária na Primeira República: a inflação gerada pela Primeira Guerra Mundial e a carestia de alimentos provocaram em São Paulo a Greve Geral de 1917, liderada por militantes anarcossindicalistas. Após o assassinato policial do sapateiro espanhol José Martinez, mais de 70 mil operários paralisaram a cidade exigindo redução da jornada para oito horas, aumento salarial, proibição do trabalho infantil e congelamento do preço dos alimentos. Em fevereiro de 1922, a insatisfação com os modelos culturais acadêmicos importados eclodiu na Semana de Arte Moderna, realizada no Teatro Municipal de São Paulo por artistas e intelectuais como Mário de Andrade, Oswald de Andrade, Anita Malfatti, Di Cavalcanti e Heitor Villa-Lobos. A Semana propôs a ruptura estética com o parnasianismo, o experimentalismo de vanguarda e a busca por uma identidade artística genuinamente brasileira, consagrada posteriormente pelo 'Manifesto Antropofágico'.", ["Greve Geral de 1917: Primeira grande greve geral do Brasil, paralisando fábricas, trens e comércio em SP e RJ", "Anarcossindicalismo: Ideologia predominante no movimento operário brasileiro nas primeiras décadas do século XX (ação direta sem partidos)", "Lei Adolfo Gordo (1907): Instrumento repressivo que autorizava a deportação sumária de líderes operários estrangeiros", "Semana de Arte Moderna (1922): Marco de ruptura cultural e estética realizado no Teatro Municipal de São Paulo", "Antropofagia Cultural: Proposta de Oswald de Andrade de 'devorar' influências estrangeiras e reelaborá-las com a matriz cultural brasileira"], "O ano de 1922 foi um divisor de águas da história brasileira: marcou o Centenário da Independência, a Semana de Arte Moderna, a fundação do Partido Comunista Brasileiro (PCB) e o levante dos 18 do Forte de Copacabana (Tenentismo), inaugurando a crise terminal da Primeira República.", "Trecho do 'Manifesto Antropófago', de Oswald de Andrade (1928):\n\n'Só a Antropofagia nos une. Socialmente. Economicamente. Filosoficamente. [...] Tupi, or not tupi that is the question. Contra todas as catequeses de gentes de além-mar. Queremos a revolução Caraíba. A absorção do inimigo sagrado para transformá-lo em totem.'\n\n(Fonte: Revista de Antropofagia, Ano 1, nº 1, São Paulo, 1928).", "O Manifesto Antropófago, desdobramento dos ideais da Semana de Arte Moderna de 1922, propunha para a cultura brasileira:", ["a cópia subserviente e irrestrita das formas acadêmicas clássicas herdadas da metrópole lusitana.", "a rejeição total de qualquer contato com inovações internacionais para preservar uma cultura pura e isolada.", "o fechamento de museus, teatros e galerias de arte para privilegiar exclusivamente a produção industrial seriada.", "a apropriação crítica e criativa das vanguardas artísticas mundiais, deglutidas e mescladas às raízes e tradições brasileiras.", "a subordinação das manifestações poéticas e pictóricas aos dogmas religiosos defendidos pelo clero católico."], 3, "Passo a passo:\n1. Fonte e contexto: O manifesto de Oswald de Andrade emprega a metáfora do ritual antropofágico dos indígenas tupinambás.\n2. Raciocínio: A antropofagia propunha canibalizar a cultura ocidental de vanguarda e digeri-la a partir da rica matéria-prima autóctone e popular brasileira, rompendo o complexo de colonizado (Gabarito D).\n3. Distratores: A descreve o academicismo parnasiano que os modernistas combatiam; B é xenofobia isolacionista incompatível com o cosmopolitismo modernista; D e E contrariam o florescimento das artes e a laicidade do movimento."], "Reinos e Impérios Africanos Pré-Coloniais": ["Antes da invasão colonial e do tráfico transatlântico, a África abrigava civilizações complexas, reinos e impérios letrados com grande desenvolvimento comercial, científico e urbano. O Império de Mali (séculos XIII a XVI), governado por Mansa Musa, controlava as rotas de comércio transaariano de ouro e sal, e a cidade de Tombuctu tornou-se polo global de saber com a Universidade de Sankoré. O Império Songhai e os Reinos Iorubás (como Ifé e Oió) destacavam-se pela refinada metalurgia do bronze, cerâmica e organização política urbana. O Reino do Congo mantinha sofisticada estrutura burocrática e relações diplomáticas com a Europa. A visão eurocêntrica racista que retrata a África como um continente selvagem e sem história é desmentida pela rica documentação arqueológica e historiográfica africana.", ["Mansa Musa: Imperador de Mali cuja peregrinação a Meca em 1324 revelou a opulência do ouro africano", "Tombuctu: Capital intelectual do Mali e centro de manuscritos árabes e erudição científica", "Império do Gana, Mali e Songhai: Grandes estados sudaneses baseados no controle das rotas transaarianas", "Metalurgia de Ifé e Benin: Esculturas em bronze e terracota que rivalizavam com o Renascimento europeu", "Oralidade e Griôs (Griots): Guardiões e transmissores ancestrais da memória e da história das linhagens africanas"], "O ENEM combate frontalmente a visão eurocêntrica que homogeneíza o continente africano: a África é diversa, com centenas de etnias, religiões autóctones, cristianismo antigo (Etiópia) e reinos islâmicos milenares.", "Relato do geógrafo e viajante árabe ibne Batuta em sua visita ao Império de Mali (1352):\n\n'Os habitantes de Mali possuem virtudes admiráveis. A injustiça é uma coisa rara entre eles, e de todos os povos é o que menos a tolera. Seu imperador não perdoa a ninguém que seja culpado de tirania. Há segurança absoluta em todo o país: nem o viajante nem o morador têm o que temer de ladrões ou de homens violentos.'\n\n(Fonte: Viagens de Ibn Battuta, Século XIV).", "O relato histórico de ibne Batuta sobre o Império de Mali no século XIV refuta o preconceito eurocêntrico sobre a África antiga ao demonstrar:", ["a ausência de qualquer forma de poder centralizado ou de administração jurídica nas sociedades da bacia do Níger.", "a inexistência de cidades ou núcleos urbanos capazes de acolher viajantes e diplomatas estrangeiros.", "o isolamento total das civilizações africanas em relação aos fluxos de comércio e intercâmbio cultural transcontinental.", "a subordinação irrestrita de todas as instituições políticas locais às determinações dos reinos europeus medievais.", "a presença de estruturas estatais organizadas, com rigorosa aplicação da justiça e estabilidade social e política."], 4, "Passo a passo:\n1. Fonte e contexto: O viajante muçulmano ibne Batuta registra em primeira mão o funcionamento de Mali sob um Estado que mantinha segurança, lei e comércio.\n2. Raciocínio: A documentação primária prova a maturidade política e jurídica de grandes impérios africanos muito antes da chegada dos colonizadores europeus, demolindo o mito racista do continente sem história (Gabarito E).\n3. Distratores: A e B afirmam carências inexistentes que o texto expressamente nega; C ignora o vigor das caravanas do Saara; E é anacrônica, pois antecede em séculos a invasão colonial."], "Tráfico Transatlântico e o Navio Negreiro": ["Entre os séculos XVI e XIX, o tráfico transatlântico de escravizados constituiu o maior deslocamento forçado de seres humanos da história mundial: mais de 12 milhões de africanos foram sequestrados e transportados para as Américas, dos quais cerca de 4,8 milhões desembarcaram no Brasil. O comércio triangular envolvia trocas de armas de fogo, tecidos, tabaco e aguardente com chefes costeiros. A travessia no oceano Atlântico nos 'navios negreiros' (conhecidos no Brasil como 'tumbeiros' pela altíssima taxa de mortalidade) constituía uma experiência de tortura sistemática: homens, mulheres e crianças eram amontoados nos porões sem ventilação, acorrentados, famintos e submetidos a doenças (escorbuto, disenteria e varíola). Ao chegarem aos portos (como o Cais do Valongo no Rio de Janeiro), eram leiloados como mercadorias desprovidas de humanidade jurídica.", ["Comércio Triangular: Articulação comercial entre Europa, entrepostos costeiros da África e as colônias americanas", "Tumbeiros: Embarcações negreiras superlotadas onde até 20% dos cativos morriam na travessia oceânica", "Cais do Valongo (RJ): Principal porto de desembarque de escravizados das Américas, hoje Patrimônio Mundial da UNESCO", "Bantos e Sudaneses: Duas grandes matrizes culturais e linguísticas desembarcadas compulsoriamente no Brasil", "Castro Alves: O 'Poeta dos Escravos', autor do poema 'O Navio Negreiro' denunciando a tragédia no Romantismo"], "O Cais do Valongo no Rio de Janeiro é o sítio de memória mais importante do tráfico negreiro nas Américas. Escavações arqueológicas revelaram amuletos, búzios e ossadas que comprovam a tragédia e a humanidade dos que ali aportaram.", "Trecho do poema 'O Navio Negreiro', de Castro Alves (1869):\n\n'Era um sonho dantesco... o tombadilho / Que das luzernas avermelha o brilho, / Em sangue a se banhar. / Tinir de ferros... estalar de açoite... / Legiões de homens negros como a noite, / Horrendos a dançar... / Senhor Deus dos desgraçados! / Dizei-me vós, Senhor Deus! / Se é loucura... se é verdade / Tanto horror perante os céus?!'\n\n(Fonte: Castro Alves, Os Escravos, 1869).", "A denúncia lírica e política expressa nos versos de Castro Alves sobre a travessia atlântica ressalta a dimensão da escravidão como:", ["um crime histórico contra a humanidade marcado pela violência extrema, desumanização e mortandade dos cativos.", "um sistema de colonização pacífica fundamentado na concordância mútua entre navegadores e nativos.", "um processo civilizatório indispensável para a difusão da fé cristã e a preservação da dignidade humana dos africanos.", "um comércio humanizado que assegurava alimentação adequada e repouso aos trabalhadores durante a viagem.", "uma estratégia exclusivamente militar voltada ao recrutamento voluntário de marinheiros para as frotas régias."], 0, "Passo a passo:\n1. Fonte e contexto: Castro Alves escreveu no século XIX sob o impacto do abolicionismo, denunciando a barbárie dos navios negreiros.\n2. Raciocínio: O poema rompe com a romantização do passado imperial, escancarando a tortura, os açoites e o sofrimento atroz imposto pelo tráfico mercantil de seres humanos (Gabarito A).\n3. Distratores: A, B e C utilizam justificativas eufemísticas ou falsas que relativizam o crime hediondo do tráfico; E fantasia um recrutamento militar inexistente."], "Quilombos e Estratégias de Resistência Negra": ["A resistência negra no Brasil colonial e imperial foi multiforme, cotidiana e permanente. Longe de aceitarem passivamente a condição de mercadorias, os escravizados desenvolveram estratégias de enfrentamento individuais e coletivas. No plano da resistência armada e comunitária, a fundação de quilombos (mocambos) espalhou-se por todo o território (como Palmares em Alagoas, Quilombo do Ambrósio em Minas e Quilombo do Piçarrão). Os quilombos organizavam uma economia de policultura de subsistência, criação de animais e comércio com vilas vizinhas. No plano cultural e religioso, preservaram cultos aos orixás, inquices e voduns por meio do sincretismo com os santos católicos e das irmandades religiosas negras (como a Irmandade de Nossa Senhora do Rosário dos Homens Pretos), que funcionavam também como fundos mútuos para a compra coletiva de cartas de alforria.", ["Quilombos: Comunidades autônomas de resistência que abrigavam escravizados fugidos, indígenas e desvalidos", "Ganga Zumba e Zumbi: Lideranças históricas de Palmares que organizaram a defesa militar e a diplomacia", "Sincretismo Religioso: Associação de divindades africanas a santos católicos para burlar a perseguição inquisitorial", "Irmandades dos Homens Pretos: Espaços de solidariedade comunitária negra e arrecadação de pecúlio para alforrias", "Artigo 68 do ADCT (CF/1988): Reconhecimento constitucional definitivo do direito de propriedade das comunidades remanescentes de quilombos"], "Comunidades quilombolas não são apenas fósseis do passado colonial: são sujeitos de direito vivos hoje, que lutam pela titulação de suas terras ancestrais e preservação de suas culturas tradicionais.", "Artigo 68 do Ato das Disposições Constitucionais Transitórias (ADCT da Constituição de 1988):\n\n'Aos remanescentes das comunidades dos quilombos que estejam ocupando suas terras é reconhecida a propriedade definitiva, devendo o Estado emitir-lhes os títulos respectivos.'\n\n(Fonte: Constituição da República Federativa do Brasil, 1988).", "A garantia constitucional outorgada pelo Artigo 68 do ADCT em 1988 representa para as comunidades quilombolas brasileiras:", ["a desapropriação compulsória de suas áreas territoriais em benefício de empreendimentos industriais de mineração.", "o reconhecimento jurídico e a reparação histórica pelo Estado brasileiro do direito originário às terras ocupadas tradicionalmente.", "a obrigação de abandonar suas práticas culturais e religiosas em favor da assimilação aos costumes urbanos.", "a proibição definitiva de exercer atividades agrícolas ou extrativistas nas áreas tituladas pelo governo federal.", "a subordinação administrativa direta das lideranças comunitárias aos comandos dos quartéis do Exército."], 1, "Passo a passo:\n1. Fonte e contexto: A Carta Cidadã de 1988 inovou ao reconhecer o direito formal dos remanescentes de quilombos à propriedade de suas terras ancestrais.\n2. Raciocínio: A titulação quilombola é uma das mais importantes conquistas jurídicas de reparação histórica do movimento negro, assegurando a posse da terra e a preservação de seus saberes tradicionais (Gabarito B).\n3. Distratores: A, C, D e E descrevem medidas de opressão e espoliação que contrariam frontalmente o mandamento garantista da Constituição."], "Pós-Abolição e Marginalização Social": ["A assinatura da Lei Áurea em 1888 não foi acompanhada de nenhuma política pública de integração econômica, educacional ou habitacional para a população negra liberta. O Estado brasileiro republicano de 1889 adotou uma política deliberada de 'embranquecimento' da população (teorias racistas eugênicas que previam o desaparecimento biológico do negro em algumas gerações), subsidiando a imigração europeia e reservando aos imigrantes as melhores terras e empregos nas lavouras e nas fábricas. Aos negros e pardos restaram o subemprego, a informalidade e a ocupação desordenada de morros e periferias. A criminalização de suas práticas culturais e religiosas foi institucionalizada no Código Penal de 1890, que tipificou como crimes a vadiagem, a capoeira e a prática do curandeirismo e ritos de matriz africana.", ["Ausência de Reparação: Libertos abandonados sem acesso à terra, alfabetização, moradia ou indenização", "Ideologia do Embranquecimento: Políticas estatais de estímulo à imigração branca apoiadas em teses eugênicas", "Código Penal de 1890: Criminalização da capoeiragem (art. 402) e da mendicância para perseguir a população negra", "Racismo Estrutural: Manutenção de barreiras invisíveis e abismos de renda entre brancos e negros que persistem no país", "Favela e Periferização: Consequência urbana direta da exclusão socioeconômica do pós-abolição e das reformas higienistas"], "O Código Penal de 1890 tinha artigos específicos punindo 'capoeiras' e praticantes de cultos de matriz africana: a lei foi usada pelas forças policiais republicanas como instrumento direto de perseguição racial e controle da pobreza urbana.", "Artigo 402 do Código Penal da República dos Estados Unidos do Brasil (1890):\n\n'Fazer nas ruas e praças públicas exercícios de agilidade e destreza corporal conhecidos pela denominação de capoeiragem: Pena — de prisão celular por dois a seis meses.'\n\n(Fonte: Código Penal de 1890, Imprensa Nacional).", "A inclusão da capoeiragem como delito criminal no Código Penal de 1890 evidenciava uma estratégia das autoridades republicanas voltada a:", ["proteger as manifestações folclóricas populares e promover a igualdade racial nos espaços públicos centrais.", "financiar academias esportivas para a preparação de atletas negros nas disputas das Olimpíadas mundiais.", "disciplinar e perseguir penalmente as práticas culturais da população negra liberta, associando-as à criminalidade e à desordem.", "incentivar a contratação de mestres de capoeira como instrutores oficiais de artes marciais nas academias do Exército.", "estimular o turismo cultural nos bairros periféricos para valorizar a memória da diáspora africana."], 2, "Passo a passo:\n1. Fonte e contexto: O Código Penal de 1890 proibiu os 'jogos de agilidade e capoeiragem' com pena de prisão celular.\n2. Raciocínio: A criminalização da capoeira e do samba foi uma forma jurídica do Estado republicano disciplinar os corpos negros recém-saídos da escravidão e exercer vigilância policial contínua sobre a população trabalhadora (Gabarito C).\n3. Distratores: A, B, D e E apontam valorização esportiva e inclusão cultural que contradizem frontalmente a repressão racista do pós-abolição."], "Movimento Negro e Luta pelos Direitos Civis": ["A luta antirracista no Brasil do século XX desdobrou-se em mobilizações políticas, teatrais, jornalísticas e acadêmicas para desconstruir o mito da 'democracia racial' — ideologia que alegava a convivência pacífica e a ausência de preconceito no país. Na década de 1930, destacou-se a Frente Negra Brasileira (FNB), o primeiro partido político de base negra, fundado em São Paulo com dezenas de milhares de filiados e jornal próprio ('A Voz da Raça'). Em 1944, Abdias do Nascimento fundou o Teatro Experimental do Negro (TEN), capacitando atores negros e encenando espetáculos que valorizavam a cultura afro-brasileira. Em plena ditadura militar (1978), o assassinato do operário negro Robson Silveira da Luz por policiais motivou a fundação do Movimento Negro Unificado (MNU) nas escadarias do Theatro Municipal de São Paulo, marco contemporâneo da luta pelos direitos civis e denúncia do racismo institucional.", ["Frente Negra Brasileira (FNB, 1931): Maior entidade negra da primeira metade do século XX, fechada pelo Estado Novo em 1937", "Mito da Democracia Racial: Narrativa ideológica construída nos anos 1930 que mascarava a desigualdade e a discriminação racial", "Teatro Experimental do Negro (TEN, 1944): Fundado por Abdias do Nascimento para combater o 'blackface' e formar intelectuais", "Movimento Negro Unificado (MNU, 1978): Protesto histórico em São Paulo e afirmação do termo 'Negro' com orgulho político", "Florestan Fernandes e Lélia Gonzalez: Intelectuais que comprovaram que o racismo é um componente estrutural da sociedade brasileira"], "O conceito de 'Améfrica Ladina', cunhado pela antropóloga e militante negra Lélia Gonzalez, valoriza a contribuição decisiva de mulheres negras e indígenas na forja da linguagem, culinária e identidade dos povos latino-americanos.", "Manifesto de Fundação do Movimento Negro Unificado (MNU), lido em São Paulo (18 de junho de 1978):\n\n'Nós, negros brasileiros, reunidos em praça pública, denunciamos perante o povo brasileiro o mito da democracia racial. Denunciamos a violência policial, a discriminação no mercado de trabalho e a marginalização a que somos submetidos há séculos. Exigimos punição para os crimes de racismo e o reconhecimento de nossa humanidade e de nossa cidadania plena.'\n\n(Fonte: Carta de Princípios do Movimento Negro Unificado, 1978).", "A mobilização histórica do Movimento Negro Unificado (MNU) em 1978 marcou uma virada política fundamental ao:", ["endossar a narrativa oficial de que o Brasil constituía uma nação harmoniosa e imune a preconceitos étnicos.", "defender a restauração da censura estatal sobre as produções literárias de escritores afro-brasileiros.", "propor a separação territorial do Nordeste brasileiro e a fundação de uma monarquia absolutista negra.", "desmistificar a tese da democracia racial e denunciar publicamente o racismo institucional e a violência do Estado.", "recusar qualquer diálogo com a classe trabalhadora para apoiar exclusivamente o empresariado internacional."], 3, "Passo a passo:\n1. Fonte e contexto: O ato do MNU em 1978 em plena ditadura foi a gênese do moderno movimento negro brasileiro.\n2. Raciocínio: O MNU rompeu com o discurso de que o Brasil não tinha racismo, expondo a violência policial e o racismo estrutural e exigindo a criminalização do preconceito como violação dos direitos humanos (Gabarito D).\n3. Distratores: A é exatamente o discurso que o MNU combateu; C defende a censura que perseguia os militantes; D e E inventam propostas absurdas descoladas da luta pelos direitos civis."], "Patrimônio Cultural Afro-Brasileiro": ["A cultura brasileira é profundamente enraizada nas tradições, tecnologias, saberes e espiritualidade trazidos pela diáspora africana. Elementos fundamentais da identidade nacional — como a culinária do azeite de dendê, acarajé e vatapá na Bahia; o ritmo sincopado do samba de roda, jongo, maracatu e congada; e os vocábulos incorporados ao português falado no Brasil (como caçamba, moleque, quitanda, fuxico, fubá e caçula) — foram forjados na resistência cotidiana. As religiões de matriz africana (Candomblé, Umbanda e Tambor de Mina) constituem complexos sistemas de valores filosóficos que cultuam a ancestralidade e a harmonia com a natureza. Em anos recentes, o Instituto do Patrimônio Histórico e Artístico Nacional (IPHAN) reconheceu o Ofício das Baianas de Acarajé, o Samba de Roda do Recôncavo Baiano e o Tambor de Crioula do Maranhão como Patrimônios Culturais Imateriais do Brasil.", ["Patrimônio Imaterial: Saberes, celebrações, formas de expressão e ofícios transmitidos entre gerações", "Ofício das Baianas de Acarajé: Primeiro patrimônio imaterial registrado pelo IPHAN com fortes laços religiosos com o Candomblé", "Samba de Roda do Recôncavo Baiano: Patrimônio da Humanidade pela UNESCO com raízes nas festas de senzala", "Territórios Sagrados (Terreiros): Espaços de acolhimento comunitário, preservação ecológica de ervas sagradas e resistência", "Intolerância Religiosa: Desafio contemporâneo marcado por ataques e depredações a terreiros de matriz africana"], "Patrimônio material são monumentos, estátuas e construções físicas; patrimônio imaterial são os saberes, rituais, festas e tradições orais vivas que definem a identidade de um grupo social.", "Parecer Técnico do IPHAN sobre o Registro do Ofício das Baianas de Acarajé (2005):\n\n'O ofício tradicional das baianas de acarajé constitui uma prática cultural reiterada, com fortes laços comunitários e de gênero, onde o saber transmitido de mãe para filha combina o preparo alimentar com o culto ancestral aos orixás nos terreiros de candomblé, configurando um patrimônio imaterial indissociável da identidade nacional.'\n\n(Fonte: Dossiê IPHAN nº 6, Brasília, 2005).", "O reconhecimento institucional do 'Ofício das Baianas de Acarajé' como patrimônio cultural imaterial reflete:", ["a obrigação de transformar todo o artesanato culinário regional em monopólio exclusivo de empresas transnacionais.", "a proibição de comercializar alimentos típicos fora dos templos religiosos regulamentados pelo Estado.", "a tentativa governamental de extinguir a influência dos terreiros de matriz africana na gastronomia popular.", "a descaracterização do acarajé para adaptá-lo unicamente aos padrões da indústria de fast-food europeia.", "a valorização e salvaguarda estatal dos saberes ancestrais e práticas culturais forjados pela população afrodescendente."], 4, "Passo a passo:\n1. Fonte e contexto: O parecer do IPHAN destaca a transmissão geracional feminina e o valor identitário do acarajé.\n2. Raciocínio: Ao titular o ofício das baianas como patrimônio imaterial, o Estado reconhece o valor civilizatório da herança africana, conferindo-lhe proteção jurídica e dignidade histórica (Gabarito E).\n3. Distratores: A, C, D e E propõem apropriação mercantilista ou destruição da tradição que contrariam a própria essência das políticas de patrimônio do IPHAN."], "Legislação Antirracista e Ações Afirmativas": ["A redemocratização e a pressão contínua do movimento negro impulsionaram avanços jurídicos decisivos no combate ao racismo estrutural no Brasil. A Constituição de 1988 estabeleceu em seu artigo 5º, inciso XLII, que a prática do racismo é crime inafiançável e imprescritível, sujeito à pena de reclusão. Em 2003, a Lei Federal nº 10.639 tornou obrigatório o ensino da História e Cultura Afro-Brasileira e Africana nas escolas de educação básica, visando desconstruir o currículo eurocêntrico. Em 2010, foi aprovado o Estatuto da Igualdade Racial (Lei nº 12.288). No âmbito do ensino superior e concursos públicos, a Lei de Cotas (Lei nº 12.711/2012) consolidou as ações afirmativas: políticas públicas compensatórias temporárias que reservam vagas para estudantes pretos, pardos, indígenas, quilombolas e de baixa renda, democratizando o acesso às universidades públicas federais.", ["Constituição de 1988: Art. 5º, XLII torna o racismo crime inafiançável e imprescritível", "Lei nº 10.639/2003: Obrigatoriedade do ensino de História e Cultura Afro-Brasileira na rede de ensino", "Estatuto da Igualdade Racial (Lei nº 12.288/2010): Instrumento de defesa de direitos individuais e coletivos da população negra", "Lei de Cotas (Lei nº 12.711/2012): Reserva de vagas nas universidades federais combinando critérios social e étnico-racial", "Ações Afirmativas: Políticas de reparação e promoção da igualdade material preconizadas por convenções internacionais"], "Atenção para a constitucionalidade das cotas: Em 2012, o Supremo Tribunal Federal (STF) julgou por unanimidade que as cotas raciais são constitucionais, baseadas no princípio da igualdade material (tratar desigualmente os desiguais para promover a igualdade real).", "Voto do Ministro Ricardo Lewandowski no julgamento da ADPF 186 sobre as Cotas Raciais no STF (2012):\n\n'A igualdade puramente formal não basta. Para que haja igualdade substantiva em uma sociedade marcada por séculos de escravidão e discriminação, faz-se imperiosa a intervenção do Estado por meio de ações afirmativas temporárias que corrijam as desvantagens históricas impostas à população negra.'\n\n(Fonte: Acórdão da ADPF 186/DF, Supremo Tribunal Federal, 2012).", "A adoção de políticas de ações afirmativas e cotas raciais no Brasil fundamenta-se juridicamente no princípio de que:", ["a superação das desigualdades socio-raciais herdadas da escravidão exige medidas estatais concretas de reparação e inclusão social.", "a igualdade perante a lei deve se ater estritamente à neutralidade formal sem qualquer intervenção corretiva do Estado.", "a universidade pública deve selecionar seus discentes exclusivamente com base em critérios hereditários de renda familiar.", "o acesso ao ensino superior deve ser restrito aos cidadãos pertencentes aos estratos sociais financeiramente privilegiados.", "os critérios meritocráticos tradicionais já garantem de forma perfeita a representação equitativa de todos os grupos étnicos no país."], 0, "Passo a passo:\n1. Fonte e contexto: O acórdão do STF estabeleceu a distinção entre igualdade formal (a lei diz que todos são iguais) e igualdade material (a realidade é desigual).\n2. Raciocínio: As cotas raciais visam mitigar séculos de desvantagens estruturais provocadas pelo cativeiro e pelo pós-abolição excludente, abrindo as portas do ensino superior e das carreiras públicas à juventude negra e indígena (Gabarito A).\n3. Distratores: A, D e E defendem a inação estatal e o mito da meritocracia abstrata em uma sociedade profundamente desigual; B propõe o privilégio hereditário oposto à justiça social."], "Revoluções Inglesas do Século XVII": ["No século XVII, a Inglaterra protagonizou a primeira revolução burguesa da Idade Moderna, desmantelando o absolutismo dos reis Stuart. O rei Carlos I tentou impor tributos sem a aprovação do Parlamento (como o Ship Money) e perseguiu puritanos (calvinistas). Eclodiu a Guerra Civil (1642-1649) entre os Cavaleiros (nobres partidários do rei) e os Cabeças-Redondas (forças parlamentares burguesas e puritanas chefiadas por Oliver Cromwell com o exército 'New Model Army'). Carlos I foi julgado e decapitado em 1649, instalando-se a República Puritana (Commonwealth). Cromwell decretou os Atos de Navegação (1651), garantindo a supremacia naval e comercial inglesa no comércio ultramarino. Após a morte de Cromwell e a restauração monárquica com Carlos II e Jaime II, a burguesia conduziu a Revolução Gloriosa (1688): sem derramamento de sangue, coroou Guilherme de Orange, que assinou a 'Bill of Rights' (1689), inaugurando a Monarquia Parlamentarista sob o lema 'O rei reina, mas o Parlamento governa'.", ["1642-1649: Guerra Civil Inglesa e execução pública do rei absolutista Carlos I", "Atos de Navegação (1651): Mercadorias inglesas só podiam viajar em navios ingleses, liquidando a frota holandesa", "Diggers e Levellers: Movimentos populares radicais que defendiam a partilha comunitária da terra e igualdade política", "1688: Revolução Gloriosa depondo Jaime II e consolidando o poder supremo da burguesia no Parlamento", "Bill of Rights (Declaração de Direitos, 1689): Subordinação definitiva do poder monárquico às leis parlamentares"], "A Revolução Gloriosa foi a precondição política indispensável para a Primeira Revolução Industrial: ela colocou a burguesia e os proprietários no controle do Estado e das finanças, permitindo leis que favoreciam o comércio, a mineração e a moeda estável.", "Trecho da 'Bill of Rights' (Declaração de Direitos da Inglaterra, 1689):\n\n'Que o pretenso poder da autoridade real de suspender as leis ou a execução das leis sem consentimento do Parlamento é ilegal. Que qualquer cobrança de dinheiro para a Coroa sem outorga do Parlamento é ilegal. Que é direito dos súditos apresentar petições ao Rei e que todos os encarceramentos por tal motivo são ilegais.'\n\n(Fonte: The Bill of Rights, Parlamento Britânico, 1689).", "A promulgação da Declaração de Direitos (Bill of Rights) em 1689 estabeleceu no Reino Unido:", ["a restauração do direito divino dos reis e a dissolução compulsória do poder legislativo.", "a limitação constitucional dos poderes da monarquia e a supremacia jurídica e política do Parlamento.", "a instauração da ditadura comunista dos escavadores com coletivização forçada da terra.", "a proibição definitiva de atividades manufatureiras e o isolamento comercial das ilhas britânicas.", "o retorno da Igreja Católica como religião oficial obrigatória para todos os cidadãos ingleses."], 1, "Passo a passo:\n1. Fonte e contexto: A Bill of Rights de 1689 encerrou quase um século de guerras civis na Inglaterra ao exigir a assinatura do novo monarca.\n2. Raciocínio: O documento subordinou a Coroa ao Parlamento (proibindo o rei de criar impostos, manter exército em tempo de paz ou revogar leis sem aprovação legislativa), fundando a monarquia constitucional (Gabarito B).\n3. Distratores: A é o exato oposto; B confunde com as reivindicações dos Diggers que foram esmagados; D e E contrariam a vocação comercial e a fé protestante consolidada pela revolução."], "Filosofia Iluminista e Crítica ao Antigo Regime": ["O Iluminismo (ou Século das Luzes), florescido no século XVIII predominantemente na França, foi um movimento intelectual que colocou a Razão humana e a ciência como instrumentos soberanos para combater as 'trevas' do obscurantismo religioso, da ignorância e da tirania absolutista do Antigo Regime. John Locke fundou o liberalismo político, defendendo os direitos naturais inalienáveis do homem (vida, liberdade e propriedade) e o contrato social. Montesquieu propôs a Teoria da Tripartição dos Poderes (Executivo, Legislativo e Judiciário, autônomos e harmônicos entre si para evitar a tirania). Voltaire foi o campeão da liberdade de expressão, da tolerância religiosa e da crítica mordaz à Igreja Católica. Jean-Jacques Rousseau distinguiu-se ao defender a soberania popular, a vontade geral e apontar a propriedade privada como origem da desigualdade social. Diderot e D'Alembert reuniram todo o saber racional na gigantesca 'Enciclopédia'. Na economia, os fisiocratas e Adam Smith formularam o liberalismo econômico do 'laissez-faire'.", ["John Locke: Direitos naturais inalienáveis e direito de rebelião contra governantes tirânicos", "Montesquieu: 'O Espírito das Leis' e o equilíbrio dos três poderes (Executivo, Legislativo e Judiciário)", "Voltaire: Crítica contundente ao fanatismo religioso e defesa intransigente da liberdade de pensamento", "Jean-Jacques Rousseau: 'Do Contrato Social', soberania popular e críticas à propriedade privada", "Enciclopédia: Obra monumental de Diderot e D'Alembert que compilou o conhecimento científico e racional iluminista"], "Não confunda Iluminismo com democracia direta ou socialismo: a maioria dos filósofos iluministas (como Voltaire e Locke) era liberal-burguesa e temia a 'plebe' pobre; Rousseau foi a exceção democrática mais radical.", "Trecho clássico de Montesquieu em 'Do Espírito das Leis' (1748):\n\n'Para que não se possa abusar do poder, é preciso que, pela disposição das coisas, o poder freie o poder. [...] Quando na mesma pessoa ou no mesmo corpo de magistratura o poder legislativo está reunido ao poder executivo, não há liberdade, porque se pode temer que o mesmo monarca ou o mesmo senado faça leis tirânicas para executá-las tiranicamente.'\n\n(Fonte: Montesquieu, Do Espírito das Leis, Livro XI).", "A tese formulada por Montesquieu no excerto constitui o pilar das democracias modernas contemporâneas conhecido como:", ["centralismo burocrático monárquico absolutista com poder perpétuo do soberano.", "tutela das forças militares sobre as decisões tomadas pelos parlamentos eleitos.", "divisão e equilíbrio harmônico entre os poderes Executivo, Legislativo e Judiciário para coibir a tirania.", "subordinação das leis civis aos dogmas da inquisição religiosa católica.", "supressão do direito de defesa e eliminação dos tribunais judiciais permanentes."], 2, "Passo a passo:\n1. Fonte e contexto: Montesquieu escreve em 1748 contra a concentração absolutista de poderes nas mãos do rei.\n2. Raciocínio: Ao propor que 'o poder freie o poder', ele concebeu o sistema de pesos e contrapesos (checks and balances), onde três poderes independentes fiscalizam-se mutuamente para assegurar a liberdade cidadã (Gabarito C).\n3. Distratores: A, C, D e E descrevem tiranias autocráticas que a tripartição de poderes visa expressamente impedir."], "Independência dos Estados Unidos (1776)": ["A Guerra de Independência dos Estados Unidos (1775-1783) foi a primeira revolução do ciclo atlântico a aplicar as ideias iluministas e a romper com uma metrópole colonial europeia. Durante séculos, as Treze Colônias inglesas viveram sob a política da 'negligência salutar', gozando de relativa autonomia política e manufatureira. Após a Guerra dos Sete Anos (1756-1763), o endividado governo britânico alterou radicalmente sua postura: impôs tributos confiscatórios (Lei do Açúcar, Lei do Selo e Leis Townshend) e o monopólio do chá à Companhia das Índias Orientais. Os colonos reagiram com o lema 'No taxation without representation' (sem representação no Parlamento, sem tributação!) e organizaram a Festa do Chá de Boston (1773). A Coroa revidou com as 'Leis Intoleráveis'. Em 4 de julho de 1776, o Segundo Congresso Continental da Filadélfia aprovou a Declaração de Independência, redigida por Thomas Jefferson inspirada em John Locke. Com o auxílio militar da França e da Espanha, os colonos derrotaram os britânicos e promulgaram a Constituição de 1787, instituindo a república federalista presidencialista.", ["Negligência Salutar: Autonomia administrativa tradicional que precedeu o arrocho tributário britânico", "Festa do Chá de Boston (1773): Colonos disfarçados de indígenas jogam carregamentos de chá inglês ao mar", "Leis Intoleráveis (1774): Fechamento do porto de Boston e ocupação militar britânica que unificou as colônias", "4 de Julho de 1776: Declaração de Independência redigida por Thomas Jefferson proclamando os direitos naturais", "Contradição fundadora: Proclamação da liberdade e igualdade convivendo com a manutenção da escravidão negra no Sul"], "O paradoxo da independência americana: Enquanto a Declaração afirmava solenemente que 'todos os homens são criados iguais', Thomas Jefferson, George Washington e a maioria dos pais fundadores mantinham centenas de seres humanos negros escravizados em suas fazendas de tabaco e algodão.", "Preâmbulo da Declaração de Independência dos Estados Unidos da América (4 de julho de 1776):\n\n'Consideramos estas verdades como evidentes por si mesmas: que todos os homens são criados iguais, que são dotados pelo Criador de certos direitos inalienáveis, que entre estes estão a vida, a liberdade e a busca da felicidade; que para garantir estes direitos, os governos são instituídos entre os homens, derivando seus justos poderes do consentimento dos governados.'\n\n(Fonte: Declaração de Independência dos EUA, Filadélfia, 1776).", "O documento redigido em 1776 fundamenta a ruptura das Treze Colônias com a Inglaterra nas teses iluministas ao afirmar que:", ["a autoridade dos monarcas é divina e inquestionável perante qualquer queixa dos súditos coloniais.", "a igualdade perante a lei deve se restringir exclusivamente aos cidadãos de nascimento aristocrático europeu.", "o Estado tem o dever soberano de confiscar toda a propriedade privada para redistribuí-la aos povos indígenas.", "a legitimidade de um governo emana do consentimento dos cidadãos governados e tem por fim proteger seus direitos naturais inalienáveis.", "a monarquia absolutista britânica constitui o modelo mais perfeito de justiça e harmonia social."], 3, "Passo a passo:\n1. Fonte e contexto: Jefferson incorporou quase literalmente a filosofia política do contratualismo liberal de John Locke na Declaração de 1776.\n2. Raciocínio: A soberania reside no povo; se o governante se torna tirânico e usurpa direitos naturais (vida, liberdade, propriedade/felicidade), os cidadãos têm o direito e o dever moral de destituí-lo e fundar uma nova ordem (Gabarito D).\n3. Distratores: B e E defendem a monarquia absolutista que a independência combatia; C restringe direitos por sangue (Antigo Regime); D inventa medidas comunistas inexistentes no projeto liberal burguês americano."], "Revolução Francesa: Queda da Bastilha à República": ["A Revolução Francesa (iniciada em 1789) foi o evento sísmico que destruiu o Antigo Regime na Europa e inaugurou a Idade Contemporânea. A sociedade francesa pré-revolucionária era dividida em três estados: o Primeiro Estado (clero) e o Segundo Estado (nobreza), isentos de impostos e detentores de terras e pensões régias; e o Terceiro Estado (97% da população: alta burguesia, camponeses e sans-culottes), que sustentava o luxo da corte de Luís XVI e sofria com colheitas desastrosas e inflação. Diante da bancarrota, o rei convocou os Estados Gerais. O Terceiro Estado rompeu com a contagem de votos por ordem e declarou-se em Assembleia Nacional. Em 14 de julho de 1789, as massas parisienses tomaram a Bastilha (símbolo do absolutismo). Aprovou-se a Declaração dos Direitos do Homem e do Cidadão (1789) e a Constituição de 1791 (monarquia constitucional). Após a tentativa de fuga do rei e a invasão estrangeira, proclamou-se a República (1792), inaugurando a fase da Convenção Nacional (disputa entre girondinos moderados e jacobinos radicais) e o 'Terror' sob comando de Robespierre.", ["14 de Julho de 1789: Queda da Bastilha, marco inicial da Revolução e da participação popular urbana (sans-culottes)", "Declaração dos Direitos do Homem e do Cidadão: Consagração da igualdade jurídica ('Liberdade, Igualdade, Fraternidade')", "Girondinos versus Jacobinos: Alta burguesia moderada versus pequena burguesia radical apoiada pelos sans-culottes", "Fase do Terror (1793-1794): Comitê de Salvação Pública liderado por Robespierre, guilhotina e medidas sociais radicais (Lei do Máximo e abolição da escravidão nas colônias)", "Reação Termidoriana (1794): Golpe da burguesia conservadora que depôs Robespierre e instalou o Diretório"], "Atenção para a guilhotina e o Terror jacobino: foi uma fase de extrema violência política e perseguições, mas também de medidas sociais populares avançadas: ensino público gratuito, tabelamento de preços de alimentos (Lei do Máximo) e a abolição da escravidão nas colônias francesas.", "Artigo 1º da Declaração dos Direitos do Homem e do Cidadão (França, 26 de agosto de 1789):\n\n'Os homens nascem e são livres e iguais em direitos. As distinções sociais só podem fundar-se na utilidade comum.'\n\n(Fonte: Assembleia Nacional Constituinte da França, 1789).", "A proclamação do Artigo 1º da Declaração dos Direitos do Homem e do Cidadão em 1789 desferiu um golpe mortal nas estruturas do Antigo Regime ao:", ["estabelecer que a nobreza de sangue continuaria a ter tribunais judiciais exclusivos e isenção tributária perpétua.", "anular o princípio da igualdade perante a lei para restaurar as antigas castas fechadas medievais.", "restringir a cidadania civil exclusivamente aos membros ordenados do alto clero da Igreja Católica.", "declarar a obrigatoriedade da escravidão compulsória para todos os habitantes dos campos agrícolas franceses.", "liquidar a sociedade estamental de privilégios hereditários e consagrar o princípio da igualdade jurídica universal dos cidadãos."], 4, "Passo a passo:\n1. Fonte e contexto: A Declaração de 1789 universalizou a liberdade individual e a igualdade perante a lei.\n2. Raciocínio: O artigo 1º demoliu a ordem estamental do Antigo Regime (onde o nascimento definia o status e os privilégios da nobreza), instituindo a igualdade jurídica formal, base da cidadania moderna (Gabarito E).\n3. Distratores: A, B, D e E descrevem os privilégios do Antigo Regime feudal que a Revolução Francesa derrubou com as barricadas e as leis revolucionárias."], "Era Napoleônica e Congresso de Viena": ["A instabilidade e a corrupção do Diretório abriram caminho para o Golpe do 18 Brumário (1799), que levou o general Napoleão Bonaparte ao poder como Primeiro Cônsul e, em 1804, à coroação como Imperador dos Franceses. Napoleão pacificou o país, fundou o Banco da França e promulgou o Código Civil Napoleônico (1804), consolidando as conquistas burguesas (igualdade perante a lei, Estado laico e garantia da propriedade privada). Na política externa, construiu o Grande Império vencendo coligações europeias. Incapaz de derrotar a marinha britânica na Batalha de Trafalgar, decretou o Bloqueio Continental (1806), proibindo os países europeus de comercializarem com a Inglaterra (fato que precipitou a transferência da Corte portuguesa para o Brasil em 1808 e a invasão da Espanha). Após o desastre da invasão da Rússia em 1812 e a derrota em Waterloo (1815), as potências absolutistas reuniram-se no Congresso de Viena (1814-1815) sob a liderança de Metternich, adotando os princípios da 'Legitimidade' e do 'Equilíbrio Europeu' para restaurar as monarquias depostas e criar a Santa Aliança.", ["18 Brumário (1799): Ascensão de Napoleão Bonaparte respaldado pela burguesia para garantir a ordem interna", "Código Civil Napoleônico (1804): Marco jurídico liberal que protegeu a propriedade privada e a laicidade do Estado", "Bloqueio Continental (1806): Tentativa napoleônica de estrangulamento econômico do comércio britânico", "Campanha da Rússia (1812): A tática russa da 'terra arrasada' e o inverno rigoroso aniquilaram a 'Grande Armée'", "Congresso de Viena (1815): Restauração monárquica e criação da Santa Aliança para reprimir revoluções liberais"], "O Congresso de Viena tentou fazer a história 'voltar para trás' restaurando as dinastias absolutistas, mas o 'vírus' do liberalismo e do nacionalismo burguês já havia contaminado a Europa, explodindo nas Revoluções de 1820, 1830 e 1848 ('Primavera dos Povos').", "Ata Final do Congresso de Viena (junho de 1815):\n\n'As Potências reunidas concordam em restabelecer a ordem pública e a paz duradoura na Europa com base nos princípios da Legitimidade e do Equilíbrio de Forças, restaurando em seus tronos os legítimos príncipes que foram despojados pelas usurpações revolucionárias e napoleônicas.'\n\n(Fonte: Documentos Diplomáticos Europeus, Viena, 1815).", "As decisões pactuadas no Congresso de Viena em 1815 tinham como propósito geopolítico imediato:", ["restaurar as dinastias absolutistas do Antigo Regime e conter o avanço do ideário liberal e nacionalista.", "incentivar a eclosão de insurreições operárias socialistas em todas as capitais europeias.", "promover a desmilitarização total dos impérios austríaco, russo e prussiano.", "decretar o fim da escravidão em todas as colônias ultramarinas do planeta.", "dissolver as fronteiras nacionais europeias para fundar uma federação republicana única e laica."], 0, "Passo a passo:\n1. Fonte e contexto: O documento de Viena sintetiza o projeto reacionário das monarquias vencedoras de Napoleão sob a batuta de Metternich.\n2. Raciocínio: O Congresso de Viena buscou 'restaurar o passado': devolveu tronos aos antigos reis absolutistas legítimos e estabeleceu a Santa Aliança militar para reprimir quaisquer manifestações liberais na Europa (Gabarito A).\n3. Distratores: A, C, D e E propõem objetivos progressistas, socialistas ou pacifistas que colidem frontalmente com a essência conservadora do Congresso de Viena."], "Revolução do Haiti (1791-1804)": ["A Revolução do Haiti (1791-1804) foi a mais radical revolução de independência das Américas e a única da história humana conduzida e vencida por africanos escravizados. Na época colônia francesa de Saint-Domingue, a ilha era a maior produtora mundial de açúcar e café, sustentada pela superexploração mortal de mais de 500 mil escravizados negros por uma minoria de senhores brancos e libertos mulatos. Inspirados pelo lema da Revolução Francesa ('Liberdade, Igualdade e Fraternidade') e guiados pela cerimônia de vodu de Bois-Caïman, os cativos iniciaram uma grande rebelião em agosto de 1791, incendiando fazendas. Sob a brilhante liderança militar de Toussaint Louverture e, posteriormente, de Jean-Jacques Dessalines, o exército negro derrotou sucessivamente as tropas coloniais francesas, as invasões britânicas e a expedição de elite enviada por Napoleão Bonaparte. Em 1º de janeiro de 1804, proclamou-se a República do Haiti, banindo para sempre a escravidão.", ["Saint-Domingue: Mais rica colônia açucareira do Caribe e cemitério humano de cativos africanos", "Bois-Caïman (1791): Cerimônia religiosa de vodu que selou o pacto de aliança insurrecional armada dos escravizados", "Toussaint Louverture: 'O Espártaco Negro', estrategista militar e político visionário que governou a ilha", "Jean-Jacques Dessalines: Líder que derrotou os generais de Napoleão na Batalha de Vertières e proclamou a independência (1804)", "'Haitianismo': Pavor disseminado entre as elites escravistas das Américas (inclusive no Brasil) de uma revolta negra vitoriosa"], "O termo 'haitianismo' é crucial para o ENEM: as elites proprietárias do Brasil Império viviam em constante pânico de que a escravidão brasileira pudesse ter o mesmo desfecho haitiano, o que motivou a brutal repressão a qualquer sinal de rebelião negra (como nos Malês em 1835).", "Proclamação de Independência do Haiti por Jean-Jacques Dessalines (1º de janeiro de 1804):\n\n'Juramos perante o universo e perante a posteridade renunciar para sempre à França e morrer antes de viver sob o seu jugo escravagista. Rasgamos as correntes do cativeiro com o sangue de nossos algozes. O Haiti renasce livre e negro, e nenhum homem branco senhor de escravos jamais pisará como mestre em nossa terra!'\n\n(Fonte: Proclamação da Independência da República do Haiti, Gonaïves, 1804).", "A Revolução Haitiana (1791-1804) provocou grande impacto geopolítico e psicológico no continente americano porque:", ["constituiu uma transição colonial pacífica coordenada e financiada pela corte monárquica de Versalhes.", "resultou em uma independência dirigida por uma insurreição vitoriosa de negros escravizados, gerando pânico nas elites escravocratas das Américas.", "manteve intocada a ordem escravocrata colonial para não desagradar aos investidores britânicos.", "foi liderada por grandes aristocratas franceses que desejavam transformar o Caribe em colônia espanhola.", "restringiu o direito de liberdade aos colonos europeus, mantendo os trabalhadores rurais no cativeiro."], 1, "Passo a passo:\n1. Fonte e contexto: A proclamação de Dessalines em 1804 sela a certidão de nascimento do primeiro Estado negro livre e abolicionista das Américas.\n2. Raciocínio: O Haiti quebrou o paradigma colonial: uma revolução vitoriosa de negros de pés descalços que massacrou os exércitos imperiais de Napoleão e extinguiu a escravidão, gerando o pânico do 'haitianismo' nas elites do Brasil, EUA e Caribe (Gabarito B).\n3. Distratores: A, C, D e E mentem sobre os fatos fundamentais da epopeia haitiana (a revolução foi radical, negra, armada e antiescravista)."], "Independências da América Espanhola": ["As guerras de independência na América Hispânica (1808-1825) foram precipitadas pela invasão napoleônica da Espanha e a prisão do rei Fernando VII em 1808. A sociedade colonial espanhola era rigidamente estratificada: no topo estavam os 'chapetones' (espanhóis peninsulares que ocupavam os altos cargos da administração, dos tribunais e da Igreja); logo abaixo estavam os 'criollos' (descendentes de espanhóis nascidos na América, grandes proprietários de terras e mineradores), donos dos 'Cabildos' (câmaras municipais), que lideraram as revoluções; e na base, desprovidos de direitos, os indígenas (submetidos à mita e encomienda), mestiços e escravizados. Sob a liderança dos 'Libertadores da América' — Simón Bolívar (no Norte: Venezuela, Colômbia, Equador, Bolívia e Peru) e José de San Martín (no Sul: Argentina, Chile e Peru) —, as tropas patriotas derrotaram o exército espanhol na Batalha de Ayacucho (1824). Bolívar defendia o 'Pan-americanismo' (união política e econômica das nações hispânicas no Congresso do Panamá, 1826), mas o projeto fracassou devido ao nacionalismo dos caudilhos locais e aos interesses britânicos e norte-americanos, resultando na fragmentação em repúblicas dominadas por oligarquias agrárias (Caudilhismo).", ["Chapetones versus Criollos: Disputa pelo controle político das colônias que culminou no rompimento com a Espanha", "Cabildos: Órgãos de poder local municipal que se converteram nas 'Juntas Governativas' rebeldes", "Simón Bolívar: 'O Libertador', autor da Carta da Jamaica (1815) e defensor da 'Grande Colômbia'", "Pan-americanismo de Bolívar: Sonho frustrado de criar uma confederação soberana e unida das repúblicas hispano-americanas", "Caudilhismo: Poder político autoritário e personalista de chefes militares e proprietários de terras rurais no pós-independência"], "Contraste indispensável para o ENEM: Enquanto a América portuguesa manteve sua imensa unidade territorial sob a forma monárquica, a América espanhola fragmentou-se em quase duas dezenas de repúblicas independentes dominadas por caudilhos locais.", "Trecho da 'Carta da Jamaica', redigida por Simón Bolívar em Kingston (1815):\n\n'É uma ideia grandiosa pretender formar de todo o Mundo Novo uma só nação, com um só vínculo que ligue suas partes entre si e com o todo. Já que tem uma mesma origem, uma mesma língua, mesmos costumes e uma mesma religião, deveria, pois, ter um só governo que confederasse os diferentes Estados que haverão de se formar.'\n\n(Fonte: Simón Bolívar, Carta da Jamaica, 1815).", "O ideal político expresso por Simón Bolívar na 'Carta da Jamaica' visava à construção de uma:", ["federação colonial subordinada ao comando direto da Coroa imperial britânica.", "monarquia absolutista continental onde Bolívar seria coroado imperador perpétuo de todas as províncias.", "união soberana e confederada das jovens repúblicas hispano-americanas para resistir às ambições neocoloniais e garantir a emancipação mútua.", "aliança militar com a Espanha absolutista para impedir a difusão das ideias liberais do Iluminismo.", "ordem política dividida em centenas de cidades-estados isoladas sem qualquer vínculo comercial mútuo."], 2, "Passo a passo:\n1. Fonte e contexto: A Carta da Jamaica é o manifesto onde Bolívar formula a tese do pan-americanismo hispânico.\n2. Raciocínio: Bolívar compreendeu que, se as antigas colônias se fragmentassem em pequenos países rivais, seriam facilmente dominadas e espoliadas pelas potências imperialistas emergentes (Inglaterra e EUA); daí a defesa da grande confederação unida (Gabarito C).\n3. Distratores: A e D contrariam a luta de vida e morte contra o colonialismo; C distorce a visão republicana de Bolívar; E descreve a fragmentação que Bolívar combateu até a morte."], "Civilizações Fluviais: Mesopotâmia e Egito Antigo": ["No Crescente Fértil, as civilizações da Antiguidade Oriental estruturaram-se em torno de grandes bacias hidrográficas (o Nilo no Egito; o Tigre e o Eufrates na Mesopotâmia), dependendo de gigantescas obras públicas de irrigação, diques e canais para controlar as cheias e viabilizar a agricultura. Essa dinâmica forjou o chamado Modo de Produção Asiático: o Estado era teocrático (o faraó egípcio era adorado como o próprio deus vivo; os governantes mesopotâmicos como representantes divinos) e detinha a propriedade formal das terras, enquanto as comunidades aldeãs camponesas eram submetidas à servidão coletiva, prestando tributos e trabalho forçado nas construções monumentais (pirâmides, zigurates e templos). Na Mesopotâmia, surgiram as primeiras cidades-estados (Ur, Uruk), a escrita cuneiforme suméria e a codificação pioneira das leis no Código de Hamurabi (Babilônia, século XVIII a.C.), famoso pela Lei de Talião ('olho por olho, dente por dente').", ["Sociedades Hidráulicas: Civilizações cuja sobrevivência e poder dependiam do controle das cheias dos rios", "Modo de Produção Asiático: Servidão coletiva camponesa e propriedade eminente da terra pelo Estado teocrático", "Teocracia: Poder político legitimado pela religião com os monarcas exercendo autoridade sagrada absoluta", "Escrita Cuneiforme e Hieroglífica: Sistemas desenvolvidos primordialmente para a contabilidade fiscal e templária", "Código de Hamurabi: Codificação babilônica da Lei de Talião que aplicava penalidades segundo a posição social da vítima e do agressor"], "Atenção para o Código de Hamurabi: a Lei de Talião ('olho por olho') NÃO se aplicava igualmente a todos! As punições variavam conforme a classe social: a ofensa contra um homem livre tinha punição gravíssima; a mesma ofensa contra um escravo resolvia-se com irrisória indenização ao proprietário.", "Artigos do Código de Hamurabi (Babilônia, séc. XVIII a.C.):\n\n'§ 196: Se um homem livre destruiu o olho de um outro homem livre, destruir-se-á o seu olho.\n§ 198: Se ele destruiu o olho de um homem comum ou quebrou o osso de um homem comum, pagará uma mina de prata.\n§ 199: Se ele destruiu o olho do escravo de um homem livre ou quebrou o osso do escravo de um homem livre, pagará a metade de seu valor em dinheiro.'\n\n(Fonte: Código de Hamurabi, Museu do Louvre, Paris).", "A análise dos artigos do Código de Hamurabi demonstra que a aplicação da justiça no mundo mesopotâmico antigo era marcada pela:", ["igualdade jurídica universal irrestrita entre todas as categorias de cidadãos perante a lei régia.", "ausência de qualquer intervenção do Estado na resolução dos conflitos patrimoniais e de sangue entre particulares.", "isenção absoluta de responsabilidade civil para quem causasse danos físicos involuntários a escravos.", "hierarquização jurídica das penas, que variavam de acordo com a condição social e estamental dos envolvidos.", "substituição completa das punições físicas por trabalhos comunitários pacíficos supervisionados pelos sacerdotes."], 3, "Passo a passo:\n1. Fonte e contexto: A pedra de diorito do Código de Hamurabi registra a gradação das penalidades conforme a classe do indivíduo lesado.\n2. Raciocínio: O princípio talional ('olho por olho') só valia estritamente entre nobres iguais; se a vítima fosse camponesa ou escravizada, a pena transformava-se em mera indenização pecuniária, espelhando a desigualdade da sociedade estamental babilônica (Gabarito D).\n3. Distratores: A é anacrônica (igualdade formal só surge com a Revolução Francesa); B contradiz o papel da lei estatal régia; D e E não correspondem às regras do texto de Hamurabi."], "A Pólis Grega: Atenas e Esparta": ["A pólis (cidade-estado) constituiu a unidade política fundamental da Grécia Antiga a partir do período Arcaico. O relevo montanhoso da península balcânica e o litoral recortado favoreceram a fragmentação territorial em centenas de cidades soberanas e autônomas (que compartilhavam língua, deuses e os Jogos Olímpicos), com espaço urbano dividido entre a Acrópole (centro religioso no topo) e a Ágora (praça pública de comércio e debate cívico). Esparta, na península do Peloponeso, organizou-se como uma sociedade militarista, xenófoba e oligárquica, governada por uma diarquia e pela Gerúsia: a elite guerreira dos 'esparciatas' dedicava-se exclusivamente à guerra desde os sete anos (agoge), enquanto a terra e o trabalho ficavam a cargo dos 'hilotas' (servos do Estado submetidos a constante terror policial na Kripteia). Em contraste, Atenas, na região da Ática, desenvolveu-se como uma pólis marítima, mercantil, cosmopolita e pioneira na criação da democracia direta.", ["Pólis: Cidade-estado independente com governo próprio, exército, leis e moeda particular", "Ágora e Acrópole: Os dois núcleos centrais da pólis clássica (debate cívico e culto aos deuses)", "Esparta Oligárquica: Militarismo rígido, laconismo e dominação escravista brutal dos hilotas pelo Estado", "Esparciatas, Periecos e Hilotas: Estrutura social espartana imóvel e sem nenhuma mobilidade", "Atenas Marítima: Abertura para o comércio e navegação no Mar Egeu que viabilizou a ascensão dos cidadãos marinheiros"], "Cuidado com anacronismos: Não projete a democracia ateniense sobre Esparta. Esparta era uma oligarquia rígida comandada por generais velhos (Gerúsia), e o ideal espartano era a disciplina de caserna e a anulação da individualidade em favor do Estado militar.", "Relato do historiador Plutarco sobre a educação espartana (Vida de Licurgo):\n\n'Desde os sete anos de idade, os meninos eram retirados de suas famílias e inscritos em companhias militares. Aprendiam a ler e escrever apenas o estritamente necessário; todo o restante da educação tinha um único objetivo: obedecer com presteza, suportar a fadiga com bravura e vencer ou morrer nos combates pela Pátria.'\n\n(Fonte: Plutarco, Vidas Paralelas: Vida de Licurgo).", "O modelo educacional espartano descrito por Plutarco expressava a estrutura sociopolítica de uma cidade-estado caracterizada pelo:", ["estímulo ao pensamento filosófico crítico e à participação democrática universal em assembleias populares abertas.", "isolamento militar e pacifismo diplomático com renúncia total ao uso de armamentos e guerras de conquista.", "desenvolvimento de manufaturas fabris e navegação transatlântica como fontes precípuas de arrecadação fiscal.", "desarmamento permanente da juventude para priorizar a formação de artistas, poetas e dramaturgos trágicos.", "militarismo estatal rigoroso voltado a moldar soldados disciplinados para manter a hegemonia sobre a população servil dos hilotas."], 4, "Passo a passo:\n1. Fonte e contexto: Plutarco documenta a 'agoge', a severa educação militar espartana instituída pela tradição de Licurgo.\n2. Raciocínio: A minoria esparciata vivia em constante prontidão de guerra porque temia a rebelião dos hilotas (população servil nativa subjugada que superava os cidadãos espartanos em proporção de dez para um) (Gabarito E).\n3. Distratores: A descreve Atenas; B, D e E apontam pacifismo, navegação ou foco artístico que eram o oposto do modo de vida lacônico e belicista de Esparta."], "Democracia Ateniense e Cidadania Antiga": ["A democracia ateniense, consolidada no século V a.C. ('Século de Péricles') após as reformas legislativas pioneiras de Sólon e Clístenes ('o pai da democracia'), constituiu um modelo inédito de democracia direta. Os cidadãos reuniam-se na colina da Pnix para deliberar e votar diretamente na Eclésia (Assembleia Popular) sobre a paz, a guerra e as leis, exercendo a isegoria (igualdade no direito à palavra) e a isonomia (igualdade de todos perante as leis). Para garantir a representatividade e evitar o monopólio aristocrático, a maioria dos cargos públicos e tribunais populares (Helieia) era preenchida por sorteio, e Péricles criou a 'mistoforia' (remuneração para quem participasse das sessões públicas). O ostracismo punia cidadãos suspeitos de ambição tirânica com dez anos de banimento da pólis. Contudo, essa democracia tinha limites estruturais decisivos: a cidadania era um privilégio altamente restritivo, concedido unicamente a homens adultos, livres e nascidos de pai e mãe atenienses. Mulheres, estrangeiros residentes (metecos) e a imensa população escravizada eram totalmente excluídos da cidadania.", ["Clístenes e Péricles: Reformadores que estruturaram as instituições da democracia direta ateniense", "Eclésia e Bulé: Assembleia soberana de todos os cidadãos e Conselho dos 500 que preparava as leis", "Isonomia e Isegoria: Princípios fundamentais de igualdade jurídica e direito irrestrito de voz na tribuna pública", "Mistoforia: Diária remunerada instituída por Péricles que permitia aos cidadãos mais pobres participarem das assembleias", "Limites da Democracia Ateniense: Exclusão sistemática de mulheres, escravizados e metecos (mais de 85% dos habitantes de Atenas)"], "A grande contradição da democracia ateniense para o ENEM: Foi a democracia mais participativa da Antiguidade, mas só pôde existir graças ao trabalho dos escravizados, que sustentavam a economia material e liberavam o tempo livre (ócio produtivo) dos homens livres para debater política na praça.", "Oração Fúnebre de Péricles, registrada pelo historiador Tucídides (século V a.C.):\n\n'Nossa constituição política não copia as leis dos países vizinhos: servimos antes de modelo do que imitamos outrem. O seu nome é Democracia, porque o governo é exercido não para o interesse de poucos, mas no interesse da maioria de nossos cidadãos. Se as leis garantem a todos a igualdade civil em suas disputas particulares, a consideração pública não se outorga ao nascimento, mas ao mérito demonstrado à Pátria.'\n\n(Fonte: Tucídides, História da Guerra do Peloponeso, Livro II).", "A despeito do discurso elogioso de Péricles sobre a excelência da democracia ateniense no século V a.C., a historiografia moderna destaca que esse regime político fundava-se em uma contradição estrutural ao:", ["manter a exclusão política da maioria absoluta dos habitantes da pólis, como mulheres, estrangeiros e a população escravizada.", "permitir que mulheres e escravizados ocupassem a maior parte dos assentos da Assembleia Popular.", "recusar a escravidão por motivos éticos e religiosos, adotando exclusivamente o trabalho assalariado livre nas minas de prata.", "proibir o debate oral nas praças públicas e obrigar os cidadãos a aceitarem cegamente a vontade dos generais.", "subordinar todas as decisões de governo aos oráculos dos sacerdotes do templo de Delfos."], 0, "Passo a passo:\n1. Fonte e contexto: Péricles exalta a democracia ateniense no célebre discurso aos soldados mortos na Guerra do Peloponeso.\n2. Raciocínio: A cidadania ateniense era restritiva: menos de 15% dos habitantes participavam da Eclésia, enquanto a massa de mulheres (eternas tuteladas), metecos e dezenas de milhares de escravizados realizava o trabalho braçal sem ter direito a voto nem voz (Gabarito A).\n3. Distratores: A e B contrariam os fatos basilares da exclusão cívica e da onipresença da escravidão em Atenas; D e E negam a isegoria e a soberania do debate racional na Assembleia."], "República Romana e Lutas Plebeias": ["A República Romana (509 a.C. a 27 a.C.), instaurada após a expulsão do último rei etrusco Tarquínio, o Soberbo, foi estruturada em torno do poder inconteste do Senado, uma assembleia oligárquica controlada pelas famílias patrícias (grandes proprietários aristocratas de terras e rebanhos). O corpo cívico era cindido: de um lado, os patrícios monopolizavam as magistraturas (Consulado, Pretura, Censura) e o sacerdócio; de outro, os plebeus (artesãos, comerciantes, camponeses e pequenos proprietários) pagavam impostos e compunham a espinha dorsal do exército legionário, mas sofriam com a escravidão por dívidas e a ausência de direitos políticos. Cansados da exploração, os plebeus deflagraram greves militares (como a Secessão do Monte Sagrado, em 494 a.C.), forçando a concessão
